name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# One run per ref; a newer push to a PR cancels the stale run. Runs on main
# are never cancelled so every merged commit gets a verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests + lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    services:
      # Live server for the Postgres storage adapters: the storage
      # contract suites run their "postgres" param when
      # NOETA_TEST_POSTGRES_DSN is set (skipped otherwise, e.g. locally
      # without a server).
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync workspace (kernel + dev group)
        run: uv sync --frozen

      - name: Install ripgrep
        # Grep/Glob shell out to `rg` (0.6.9 made it a hard requirement, not a
        # fallback), so a runner without the binary fails ~44 fs-tool tests on
        # "ripgrep is required" rather than on anything the change did.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: Ruff
        run: uv run ruff check packages tests scripts

      - name: Smoke import
        run: uv run python -c "from noeta.core.engine import Engine; print('import OK')"

      - name: Run pytest with coverage
        # Repo-wide coverage gate: the run fails under 85% so a broad
        # regression cannot sneak in. NOETA_TEST_POSTGRES_DSN enables the
        # Postgres parameter of the storage contract suites against the
        # service above.
        env:
          NOETA_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/postgres
        run: uv run pytest -n auto --cov=noeta --cov-report=term --cov-fail-under=85

      - name: mypy strict on both packages
        # Settings and targets live in [tool.mypy] in the root pyproject.toml.
        run: uv run mypy

      - name: Forbidden naming lint
        run: uv run python scripts/lint-naming.py

      - name: Import topology lint (L0..L3)
        run: uv run lint-imports --config .importlinter

  install-smoke:
    # One Python version: the smoke checks what the wheels contain and that a
    # fresh venv can import them; the version matrix above covers the code.
    name: Fresh-venv install smoke (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Run install_smoke pytest (fresh venv two-wheel install + wheel contents)
        run: uv run pytest -v -m install_smoke tests/test_install_smoke.py
