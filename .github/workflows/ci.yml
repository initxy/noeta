name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# One run per ref; a newer push to a PR cancels the stale run. Runs on main
# are never cancelled so every merged commit gets a verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: make check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    services:
      # The store contract tests run their Postgres parameter when
      # NOETA_TEST_POSTGRES_DSN is set (skipped otherwise).
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install ripgrep
        # No tool shells out to `rg` any more (search runs through Bash, and the suite does not
        # need it); installed so a `Bash` search in a test finds what a developer machine has.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: make check
        env:
          NOETA_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/postgres
        run: make check

  docker:
    # deploy/Dockerfile builds and its noeta starts; the image is never pushed.
    name: docker image (build only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build deploy/Dockerfile
        run: docker build -f deploy/Dockerfile -t noeta:ci .

      - name: Smoke test
        run: |
          docker run --rm noeta:ci --version
          docker run --rm noeta:ci worker --help
          docker run --rm noeta:ci serve --help

      - name: Compose file is valid
        run: |
          cp deploy/.env.example deploy/.env
          sed -i 's/^NOETA_SERVER_TOKEN=$/NOETA_SERVER_TOKEN=ci/; s/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/' deploy/.env
          docker compose -f deploy/compose.yaml config --quiet

  cluster:
    name: make cluster (workers on Postgres under faults)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Raise max_connections
        # Every worker process keeps its own pool; the default 100 runs out
        # (the harness's own container starts with 400). A service container
        # takes no server flags, so set it and restart.
        run: |
          pg=${{ job.services.postgres.id }}
          docker exec "$pg" psql -U postgres -c "ALTER SYSTEM SET max_connections = 400"
          docker restart "$pg"
          for _ in $(seq 60); do
            docker exec "$pg" pg_isready -U postgres -h 127.0.0.1 && break
            sleep 1
          done
          docker exec "$pg" psql -U postgres -tAc "SHOW max_connections"

      - name: make cluster
        env:
          NOETA_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/postgres
        run: make cluster

  macos:
    name: tests (macOS, Python 3.12)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install ripgrep
        # Grep and Glob run it (as the Linux jobs install it).
        run: brew install ripgrep

      - name: Install
        run: uv sync --all-extras

      - name: pytest
        # The core suite (pyproject's addopts leave out live and cluster tests). The bubblewrap,
        # Docker and Postgres tests skip themselves here; lint, coverage and the docs checks run
        # in the Linux job.
        run: uv run pytest -n auto -q

      - name: pytest (terminal UI)
        working-directory: tui
        run: uv run pytest -n auto -q
