# Publish the two noeta libraries (noeta-runtime / noeta-sdk) to PyPI when a
# ``v*`` tag is pushed.
#
# Auth is PyPI Trusted Publishing (OIDC) — NO API token is stored anywhere.
#
# WHY TWO PUBLISH JOBS: PyPI refuses to register the same
# repo+workflow+environment combo as a *pending* publisher for more than one
# not-yet-created project. So each package gets its own GitHub Actions
# ``environment``, which makes its trusted-publisher config unique. The build
# runs once; the two jobs only upload their own files.
#
# One-time PyPI setup — pypi.org -> Publishing -> "Add a pending publisher",
# once per package, all with Owner=initxy, Repository=noeta, Workflow=release.yml:
#   Project noeta-runtime : Environment = (leave blank)
#   Project noeta-sdk     : Environment = pypi-sdk
# (The environment name here must match the ``environment:`` key below exactly.)
#
# Release procedure: docs/releasing.md (changelog, lockstep versions +
# lower bounds, tag). The build job gates on a dated CHANGELOG section.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}   # manual re-run from the Actions tab

jobs:
  # Build once: wheels + sdists for both pure-Python libraries.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Changelog gate — the tagged version must have a dated section
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -Eq "^## \[${VERSION}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no dated '## [${VERSION}] - YYYY-MM-DD' section; see docs/releasing.md"
            exit 1
          fi
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          rm -f dist/*.whl dist/*.tar.gz
          uv build --all-packages --wheel
          uv build --package noeta-runtime --sdist
          uv build --package noeta-sdk --sdist
          ls -l dist/
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Each publish job runs only when the build produced a wheel whose version
  # equals the tag — so a partial release (e.g. a runtime-only cut while
  # noeta-sdk stays behind) publishes exactly the bumped package and the
  # unbumped one skips cleanly instead of failing on a duplicate upload. A
  # full lockstep release bumps both, so both gates open. The
  # ``dist/<name>-*`` upload globs still carry the wheel + sdist together.
  publish-runtime:
    needs: build
    runs-on: ubuntu-latest
    # No environment: matches the pending publisher registered with a blank one.
    permissions:
      id-token: write   # required: mint the short-lived PyPI OIDC token
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - name: Gate on the tag version
        id: gate
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ls dist/noeta_runtime-"${VERSION}"-*.whl >/dev/null 2>&1; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no noeta_runtime-${VERSION} wheel — not part of this release; skipping"
          fi
      - uses: astral-sh/setup-uv@v6
        if: steps.gate.outputs.publish == 'true'
      - if: steps.gate.outputs.publish == 'true'
        run: uv publish --trusted-publishing always dist/noeta_runtime-*

  publish-sdk:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi-sdk
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - name: Gate on the tag version
        id: gate
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ls dist/noeta_sdk-"${VERSION}"-*.whl >/dev/null 2>&1; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no noeta_sdk-${VERSION} wheel — not part of this release; skipping"
          fi
      - uses: astral-sh/setup-uv@v6
        if: steps.gate.outputs.publish == 'true'
      - if: steps.gate.outputs.publish == 'true'
        run: uv publish --trusted-publishing always dist/noeta_sdk-*
