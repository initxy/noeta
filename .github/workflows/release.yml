# Publish `noeta` and `noeta-tui` to PyPI, and `@initxy/noeta-web-sdk` and `@initxy/noeta-ui` to npm
# (all one version), when a `v*` tag is pushed. Procedure: docs/releasing.md.
# Auth is PyPI's and npm's Trusted Publishing (OIDC); no token is stored anywhere.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The suite on the exact commit being published: a tag can point anywhere.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - run: make check

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Changelog gate — the tagged version must have a dated section
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -Eq "^## \[${VERSION}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no dated '## [${VERSION}] - YYYY-MM-DD' section; see docs/releasing.md"
            exit 1
          fi
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The wheel carries the built web app (noeta serve and noeta web serve it).
      - name: Build the web app into the package
        run: make web-bundle
      - name: Build both packages
        run: |
          uv build --all-packages
          ls -l dist/
      - name: The noeta wheel carries the web app
        run: |
          python3 -m zipfile -l dist/noeta-*-py3-none-any.whl | grep -q 'noeta/host/web_dist/index.html' \
            || { echo "::error::the noeta wheel has no noeta/host/web_dist/index.html"; exit 1; }
      - name: Both wheels' versions are the tag's
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ls dist/noeta-"${VERSION}"-*.whl dist/noeta_tui-"${VERSION}"-*.whl
      - name: The two wheels install together
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/noeta --version
          /tmp/smoke/bin/python -c "import noeta_tui"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write   # mint the short-lived PyPI OIDC token
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: astral-sh/setup-uv@v6
      - run: uv publish --trusted-publishing always dist/*

  # The web packages a plugin's web part builds against. Also run by hand (workflow_dispatch on
  # main) to publish a version no tag published; a version already on npm is skipped.
  npm:
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write   # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11
      - name: The packages' version is the tag's
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          for p in sdk ui; do
            test "$(node -p "require('./web/$p/package.json').version")" = "${GITHUB_REF_NAME#v}" \
              || { echo "::error::web/$p/package.json is not at ${GITHUB_REF_NAME#v}"; exit 1; }
          done
      - name: Build
        run: |
          npm ci --prefix web
          npm run build --prefix web/sdk
          npm run build --prefix web/ui
      - name: Publish (the SDK first; the UI package depends on it)
        run: |
          for p in sdk ui; do
            name=$(node -p "require('./web/$p/package.json').name")
            version=$(node -p "require('./web/$p/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is on npm"; continue
            fi
            (cd "web/$p" && npm publish --access public)
          done

  # The GitHub Release, its notes the tagged version's CHANGELOG section. Skipped when it exists
  # (a re-run after a hang).
  github-release:
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME exists"; exit 0
          fi
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "noeta $VERSION" --notes-file notes.md --latest

  # The desktop installers, unsigned, attached to that release (a re-run replaces them).
  desktop:
    needs: [github-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            files: desktop/release/*.dmg
          - os: ubuntu-latest
            files: desktop/release/*.AppImage desktop/release/*.deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the web app's and the desktop app's packages
        run: |
          npm ci --prefix web
          npm ci --prefix desktop
      - name: Build the installers
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist -- --publish never -c.extraMetadata.version="${GITHUB_REF_NAME#v}"
      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l desktop/release/
          gh release upload "$GITHUB_REF_NAME" ${{ matrix.files }} --clobber
