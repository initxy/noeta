[project]
name = "noeta-sdk"
version = "0.4.0"
description = "Noeta SDK: build AI agents that run on the server. Import noeta.sdk, define your tools and policy — durable event-sourced execution, multi-worker scheduling, provider-neutral, no vendor lock-in."
license = "Apache-2.0"
authors = [{ name = "The Noeta Authors" }]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    # Microkernel M4: httpx lives here — the HTTP-speaking capability impls
    # (providers, web, mcp, sandbox backends, otlp export) all ship in this
    # wheel; noeta-runtime is transport-free.
    "httpx>=0.28.1",
    # [binary] bundles libpq so the Postgres storage adapters work out of
    # the box (the langchain-postgres / dbt pattern; the maintainer chose
    # zero-setup over the psycopg "libraries depend on bare psycopg" advice).
    # The durable backends live in the ``storage`` built-in
    # (``noeta.builtins.storage.impl``) and load lazily through
    # ``noeta.sdk.storage``, so only a host that chose Postgres imports this.
    "psycopg[binary]>=3.2",
    # Upper-bounded on purpose. Since phase 2b the built-ins band consumes the
    # kernel ACROSS the wheel boundary (the react built-in imports the control
    # band; skills / memory / providers import the kernel's seams), so version
    # skew that used to be impossible — one wheel, one release — is now
    # installable. Under 0.x a minor bump is the breaking one, so the SDK
    # tracks the kernel minor-for-minor rather than failing at first build.
    "noeta-runtime>=0.4.0,<0.5.0",
]

[project.urls]
Homepage = "https://github.com/initxy/noeta"
Repository = "https://github.com/initxy/noeta"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["noeta"]

[tool.uv.sources]
noeta-runtime = { workspace = true }
