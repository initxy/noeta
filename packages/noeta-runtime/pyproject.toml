[project]
name = "noeta-runtime"
version = "0.6.30"
description = "The kernel under noeta-sdk: an event-sourced, dependency-free runtime that records, schedules and replays AI agent tasks. Install noeta-sdk to build agents."
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "The Noeta Authors" }]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["ai-agents", "agent-framework", "llm", "llm-agents", "agentic-ai", "durable-execution", "event-sourcing", "human-in-the-loop", "anthropic", "claude", "openai", "mcp", "self-hosted"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]
# The kernel wheel is dependency-free (stdlib only). It is transport-free:
# every HTTP-speaking impl (providers, web, mcp, sandbox, otlp) ships in
# noeta-sdk, as do the durable storage backends — they live in the ``storage``
# built-in, and the kernel keeps only the InMemory reference backend.
dependencies = []

[project.urls]
Homepage = "https://initxy.github.io/noeta/"
Documentation = "https://initxy.github.io/noeta/"
Changelog = "https://github.com/initxy/noeta/blob/main/CHANGELOG.md"
Repository = "https://github.com/initxy/noeta"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Namespace-package distribution (PEP 420): ``noeta/`` has no ``__init__.py``;
# this wheel contributes the kernel subpackages to the shared ``noeta`` namespace.
[tool.hatch.build.targets.wheel]
packages = ["noeta"]
