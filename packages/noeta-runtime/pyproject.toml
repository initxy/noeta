[project]
name = "noeta-runtime"
version = "0.6.16"
description = "Noeta runtime engine: the event-sourced kernel that hosts, records, and schedules agent execution server-side. Durable, multi-worker, crash-safe — the substrate underneath the SDK and the coding agent app."
license = "Apache-2.0"
authors = [{ name = "The Noeta Authors" }]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
# The kernel wheel is dependency-free (stdlib only). It is transport-free:
# every HTTP-speaking impl (providers, web, mcp, sandbox, otlp) ships in
# noeta-sdk, as do the durable storage backends — they live in the ``storage``
# built-in, and the kernel keeps only the InMemory reference backend.
dependencies = []

[project.urls]
Homepage = "https://github.com/initxy/noeta"
Repository = "https://github.com/initxy/noeta"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Namespace-package distribution (PEP 420): ``noeta/`` has no ``__init__.py``;
# this wheel contributes the kernel subpackages to the shared ``noeta`` namespace.
[tool.hatch.build.targets.wheel]
packages = ["noeta"]
