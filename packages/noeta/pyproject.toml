[project]
name = "noeta"
version = "1.0.0.dev0"
description = "Durable AI agents for Python: one writer per task, crash-safe tool calls, approvals that cost nothing while waiting, from one process to many machines."
license = "Apache-2.0"
authors = [{ name = "The Noeta Authors" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "msgspec>=0.19",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
server = ["starlette>=0.40", "uvicorn>=0.30"]
tui = ["textual>=8.0"]

[project.scripts]
noeta = "noeta.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.8",
    "mypy>=1.10",
    "respx>=0.23.1",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["noeta"]

[tool.mypy]
strict = true
files = ["noeta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -m 'not live' --import-mode=importlib"
markers = ["live: needs a real model backend; opt in with -m live"]

[tool.coverage.run]
source = ["noeta"]
branch = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "BLE"]
# RUF012: msgspec Struct defaults are copied per instance.
# UP007: module-level union aliases read better as Union[...] when long.
ignore = ["RUF012", "UP007"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["noeta.store.base.Patch", "Patch"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B008"]
