[project]
name = "noeta"
version = "1.0.0.dev0"
description = "An open-source Claude Code for servers: the same model-visible behavior on durable event-log tasks that survive crashes and run on many machines."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "The Noeta Authors", email = "initxy0@gmail.com" }]
keywords = ["agent", "llm", "claude-code", "coding-agent", "event-sourcing", "durable-execution", "mcp", "acp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "mini-racer>=0.14,<0.15",
    "msgspec>=0.19",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary,pool]>=3.2"]
server = ["starlette>=0.40", "uvicorn>=0.30", "websockets>=12"]
tui = ["textual>=8.0"]
acp = ["agent-client-protocol>=0.12,<0.13"]
images = ["pillow>=10.4"]
keyring = ["keyring>=24"]

[project.urls]
Homepage = "https://github.com/initxy/noeta"
Documentation = "https://github.com/initxy/noeta/tree/main/docs"
Source = "https://github.com/initxy/noeta"
Issues = "https://github.com/initxy/noeta/issues"
Changelog = "https://github.com/initxy/noeta/blob/main/CHANGELOG.md"

[project.scripts]
noeta = "noeta.cli.main:main"

# Built-in plugins and backends register exactly as a third-party package
# would (noeta/core/registry.py).
[project.entry-points."noeta.plugins"]
ask_user = "noeta.plugins.ask_user:AskUser"
checkpoints = "noeta.plugins.checkpoints:Checkpoints"
compaction = "noeta.plugins.compaction:Compaction"
empty_reply = "noeta.plugins.empty_reply:EmptyReply"
environment = "noeta.plugins.environment:Environment"
findings = "noeta.plugins.findings:Findings"
fs = "noeta.plugins.fs:FileTools"
hooks = "noeta.plugins.hooks:Hooks"
instructions = "noeta.plugins.instructions:Instructions"
markdown_commands = "noeta.plugins.markdown_commands:MarkdownCommands"
mcp = "noeta.plugins.mcp:Mcp"
memory = "noeta.plugins.memory:Memory"
permissions = "noeta.plugins.permissions:Permissions"
plan_mode = "noeta.plugins.plan_mode:PlanMode"
budget = "noeta.plugins.budget:BudgetCaps"
repetition_guard = "noeta.plugins.repetition_guard:RepetitionGuard"
quiet_nudge = "noeta.plugins.quiet_nudge:QuietNudge"
schedule = "noeta.plugins.schedule:Schedule"
shell = "noeta.plugins.shell:Shell"
skills = "noeta.plugins.skills:Skills"
structured_output = "noeta.plugins.structured_output:StructuredOutput"
title = "noeta.plugins.title:Title"
todos = "noeta.plugins.todos:Todos"
tool_search = "noeta.plugins.tool_search:ToolSearch"
subtasks = "noeta.plugins.subtasks:Subtasks"
web = "noeta.plugins.web:Web"
workflow = "noeta.plugins.workflow:Orchestration"

[project.entry-points."noeta.providers"]
anthropic = "noeta.backends.providers:anthropic_provider"
openai_compat = "noeta.backends.providers:openai_compat_provider"
openai_responses = "noeta.backends.providers:openai_responses_provider"

[project.entry-points."noeta.execenvs"]
local = "noeta.backends.execenvs.local:LocalExecEnv"
container = "noeta.backends.execenvs.container:open_env"

[project.entry-points."noeta.stores"]
sqlite = "noeta.backends.stores.sqlite:open_url"
postgres = "noeta.backends.stores.postgres:open_url"
postgresql = "noeta.backends.stores.postgres:open_url"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.8",
    "mypy>=1.10",
    "respx>=0.23.1",
    "ruff>=0.6",
    "import-linter>=2.0",
    "types-pyyaml>=6.0",
    "pytest-timeout>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["noeta"]

# A local coding tool's settings are not part of the source distribution.
[tool.hatch.build.targets.sdist]
exclude = ["/.claude"]

[tool.mypy]
strict = true
files = ["noeta", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -m 'not live and not cluster' --import-mode=importlib"
# A hung test fails with every thread's stack instead of stalling the run:
# faulthandler dumps the stacks at 120 s, pytest-timeout ends the test at 300 s.
faulthandler_timeout = 120
timeout = 300
timeout_method = "thread"
markers = [
    "live: needs a real model backend; opt in with -m live",
    "cluster: worker processes on Postgres under faults; run with make cluster",
]

[tool.coverage.run]
source = ["noeta"]
branch = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "BLE"]
# RUF012: msgspec Struct defaults are copied per instance.
# UP007: module-level union aliases read better as Union[...] when long.
ignore = ["RUF012", "UP007"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["noeta.core.store.Patch", "Patch"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B008", "E501"]
# Dev tooling, not shipped: long table lines and prose are fine.
"{evals,bench,scripts}/**" = ["E501", "RUF002", "RUF003", "B905"]

[tool.importlinter]
root_package = "noeta"

# The layers, top to bottom; a module may import only from layers below it.
[[tool.importlinter.contracts]]
name = "layers: cli > agents > plugins | backends | host > toolkit > core"
type = "layers"
layers = [
    "noeta.cli",
    "noeta.agents",
    "noeta.plugins | noeta.backends | noeta.host",
    "noeta.toolkit",
    "noeta.core",
]

# A plugin is written against the kernel only, so any one can be removed.
[[tool.importlinter.contracts]]
name = "plugins do not import each other"
type = "independence"
modules = ["noeta.plugins.*"]

# Front ends and protocol adapters reach plugins only through the kernel (settings by name, the
# question form, commands), so any plugin can be removed or replaced.
[[tool.importlinter.contracts]]
name = "front ends do not import plugins"
type = "forbidden"
source_modules = ["noeta.cli", "noeta.host"]
forbidden_modules = ["noeta.plugins"]

[[tool.importlinter.contracts]]
name = "backends do not import each other"
type = "independence"
modules = ["noeta.backends.*"]

[[tool.importlinter.contracts]]
name = "the loop is pure: no runner, store or provider"
type = "forbidden"
source_modules = ["noeta.core.loop"]
forbidden_modules = ["noeta.core.runner", "noeta.core.store", "noeta.core.provider"]
