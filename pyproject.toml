[tool.uv.workspace]
# Libraries live in packages/ (noeta-runtime / noeta-sdk); the test suite lives
# at the repo root in tests/.
members = ["packages/noeta-runtime", "packages/noeta-sdk"]

# The workspace-root pyproject is pytest's rootdir when running from the repo
# root, so it owns the test config: ``testpaths`` pins collection to ``tests/``
# instead of letting a root ``pytest`` walk the whole tree. The dev toolchain
# lives here at the workspace virtual root.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.8",
    "mypy>=1.10",
    "import-linter>=2.0",
    "respx>=0.23.1",
    "ruff>=0.6",
]

[tool.ruff]
respect-gitignore = false

[tool.ruff.lint.per-file-ignores]
# PEP 562 lazy re-export modules: names in __all__ are served by a module
# __getattr__ (the plugin loader's dynamic-import doorway — no static builtins
# edge), which F822 cannot see.
"packages/noeta-sdk/noeta/sdk/providers.py" = ["F822"]
"packages/noeta-sdk/noeta/sdk/storage.py" = ["F822"]
"packages/noeta-sdk/noeta/client/parts.py" = ["F822"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not install_smoke and not live'"
markers = [
    "live: requires live LLM backend; never collected by default (a local .env would otherwise make it run) — opt in with `pytest -m live`",
    "install_smoke: spawns a fresh venv + pip install; slow (~30-60 s), opt-in via -m install_smoke",
]

# CI runs ``pytest --cov=noeta`` from the repo root, so the coverage config
# lives here at the workspace virtual root alongside the test suite.
[tool.coverage.run]
source = ["noeta"]
branch = true
