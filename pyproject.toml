[project]
name = "noeta"
version = "1.0.0.dev0"
description = "Durable AI agents for Python: one writer per task, crash-safe tool calls, approvals that cost nothing while waiting, from one process to many machines."
license = "Apache-2.0"
authors = [{ name = "The Noeta Authors" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "msgspec>=0.19",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary,pool]>=3.2"]
server = ["starlette>=0.40", "uvicorn>=0.30"]
tui = ["textual>=8.0"]
acp = ["agent-client-protocol>=0.12,<0.13"]

[project.scripts]
noeta = "noeta.apps.cli:main"

# Built-in plugins and backends register exactly as a third-party package
# would (noeta/core/registry.py).
[project.entry-points."noeta.plugins"]
ask_user = "noeta.plugins.ask_user:AskUser"
compaction = "noeta.plugins.compaction:Compaction"
environment = "noeta.plugins.environment:Environment"
fs = "noeta.plugins.fs:FileTools"
hooks = "noeta.plugins.hooks:Hooks"
instructions = "noeta.plugins.instructions:Instructions"
mcp = "noeta.plugins.mcp:Mcp"
memory = "noeta.plugins.memory:Memory"
permissions = "noeta.plugins.permissions:Permissions"
shell = "noeta.plugins.shell:Shell"
skills = "noeta.plugins.skills:Skills"
structured_output = "noeta.plugins.structured:StructuredOutput"
subtasks = "noeta.plugins.subtasks:Subtasks"
todo = "noeta.plugins.todo:Todo"
web = "noeta.plugins.web:Web"

[project.entry-points."noeta.providers"]
anthropic = "noeta.backends.providers:anthropic_provider"
openai_compat = "noeta.backends.providers:openai_compat_provider"
openai_responses = "noeta.backends.providers:openai_responses_provider"

[project.entry-points."noeta.execenvs"]
local = "noeta.backends.execenvs.local:LocalExecEnv"
container = "noeta.backends.execenvs.container:open_env"

[project.entry-points."noeta.stores"]
sqlite = "noeta.backends.stores.sqlite:open_url"
postgres = "noeta.backends.stores.postgres:open_url"
postgresql = "noeta.backends.stores.postgres:open_url"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.8",
    "mypy>=1.10",
    "respx>=0.23.1",
    "ruff>=0.6",
    "import-linter>=2.0",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["noeta"]

[tool.mypy]
strict = true
files = ["noeta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -m 'not live' --import-mode=importlib"
markers = ["live: needs a real model backend; opt in with -m live"]

[tool.coverage.run]
source = ["noeta"]
branch = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "BLE"]
# RUF012: msgspec Struct defaults are copied per instance.
# UP007: module-level union aliases read better as Union[...] when long.
ignore = ["RUF012", "UP007"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["noeta.core.store.Patch", "Patch"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B008", "E501"]
# Dev tooling, not shipped: long table lines and prose are fine.
"{evals,bench,scripts}/**" = ["E501", "RUF002", "RUF003", "B905"]

[tool.importlinter]
root_package = "noeta"

# The layers, top to bottom; a module may import only from layers below it.
[[tool.importlinter.contracts]]
name = "layers: apps > agents > plugins | backends | host > toolkit > core"
type = "layers"
layers = [
    "noeta.apps",
    "noeta.agents",
    "noeta.plugins | noeta.backends | noeta.host",
    "noeta.toolkit",
    "noeta.core",
]

# A plugin is written against the kernel only, so any one can be removed.
[[tool.importlinter.contracts]]
name = "plugins do not import each other"
type = "independence"
modules = ["noeta.plugins.*"]

# Front ends reach plugins only through the kernel (settings by name, the
# question form, commands), so any plugin can be removed or replaced.
[[tool.importlinter.contracts]]
name = "front ends do not import plugins"
type = "forbidden"
source_modules = ["noeta.apps"]
forbidden_modules = ["noeta.plugins"]

[[tool.importlinter.contracts]]
name = "backends do not import each other"
type = "independence"
modules = ["noeta.backends.*"]

[[tool.importlinter.contracts]]
name = "the loop is pure: no runner, store or provider"
type = "forbidden"
source_modules = ["noeta.core.loop"]
forbidden_modules = ["noeta.core.runner", "noeta.core.store", "noeta.core.provider"]
