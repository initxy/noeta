# Illustrative packaging for the ``approval-modes`` plugin. Not built here — the
# tests load ``plugin.py`` by explicit path — so this file exists to show the two
# things that make a distribution discoverable: the ``[tool.noeta]`` manifest
# (mirrored into the wheel as ``noeta-plugin.toml`` package data, which is what
# lets the loader read identity and contributions without importing plugin code)
# and an entry point in the SDK-owned ``noeta.plugins`` group.
#
# Packaged for real, this directory becomes the importable ``approval_modes``
# package — dashes are illegal in a Python module name — which is why the ``ref``
# below reads ``approval_modes:GUARD`` and not ``plugin:GUARD``.

[project]
name = "noeta-plugin-approval-modes"
version = "0.1.0"
description = "Operator-chosen tool-approval modes (chat / approve / smart_approve / auto) for Noeta agents."
requires-python = ">=3.10"
dependencies = ["noeta-sdk"]

[tool.noeta]
name = "approval-modes"
requires-noeta = ">=0.4"

[tool.noeta.config-schema.env]
NOETA_APPROVAL_MODE = "one of ('chat', 'approve', 'smart_approve', 'auto') (default: approve)"

[[tool.noeta.contributions]]
surface = "guard"
name = "approval_modes"
ref = "approval_modes:GUARD"

# Discovery only. The value is not a factory — the manifest is read from package
# data — so the entry point exists purely to make the distribution visible to
# ``load_plugins(entry_points=True)``.
[project.entry-points."noeta.plugins"]
approval-modes = "approval_modes"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
