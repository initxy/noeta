# Illustrative packaging for the ``approval-modes`` manifest plugin.
#
# This file shows the *real* distribution shape (spec D1): the ``[tool.noeta]``
# static manifest (mirrored to ``noeta-plugin.toml`` package data, read WITHOUT
# importing plugin code) plus an entry point in the SDK-owned ``noeta.plugins``
# group so a host started with ``load_plugins(entry_points=True)`` discovers the
# distribution.
#
# In THIS repository the plugin is NOT installed; the tests load it by explicit
# path via ``load_plugin_set(modules=[".../plugin.py"])``. When packaged for
# real, the ``approval-modes`` directory becomes the importable
# ``approval_modes`` package (dashes are not valid in a Python module name), so
# ``ref`` resolves to ``approval_modes:GUARD``.

[project]
name = "noeta-plugin-approval-modes"
version = "0.1.0"
description = "Goose-style tool-approval modes (chat / approve / smart_approve / auto) for Noeta agents."
requires-python = ">=3.10"
dependencies = ["noeta-sdk"]

[tool.noeta]
name = "approval-modes"
requires-noeta = ">=0.4"

[tool.noeta.config-schema.env]
NOETA_APPROVAL_MODE = "one of ('chat', 'approve', 'smart_approve', 'auto') (default: approve)"

[[tool.noeta.contributions]]
surface = "guard"
name = "approval_modes"
ref = "approval_modes:GUARD"

# The discovery hook (its VALUE is not a factory in the manifest mechanism — the
# manifest is read from package data; the entry point only makes the dist
# discoverable).
[project.entry-points."noeta.plugins"]
approval-modes = "approval_modes"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
