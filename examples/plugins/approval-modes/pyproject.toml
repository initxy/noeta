# Packaging for the ``approval-modes`` example plugin.
#
# This file exists to show the *real* distribution shape: a pip package that
# declares one entry point in the SDK-owned ``noeta.plugins`` group, so a host
# started with ``load_plugins(entry_points=True)`` discovers it after install.
#
# In THIS repository the plugin is NOT installed; the tests load it by explicit
# path via ``load_plugins(modules=[".../plugin.py"])``. When packaged for real,
# the ``approval-modes`` directory becomes the importable ``approval_modes``
# package (dashes are not valid in a Python module name) and the entry-point
# target below resolves to ``approval_modes.plugin:noeta_plugin``.

[project]
name = "noeta-plugin-approval-modes"
version = "0.1.0"
description = "Goose-style tool-approval modes (chat / approve / smart_approve / auto) for Noeta agents."
requires-python = ">=3.10"
dependencies = ["noeta-sdk"]

# The SDK-owned runtime-plane plugin group (ADR D2). ``load_plugins`` reads
# ``noeta_plugin_name`` from the loaded module for the effective plugin name, so
# the entry-point key here is documentation; the module names itself
# "approval-modes".
[project.entry-points."noeta.plugins"]
approval-modes = "approval_modes.plugin:noeta_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
