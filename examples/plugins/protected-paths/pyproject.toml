# Illustrative packaging for the ``protected-paths`` plugin. Not built here — the
# tests load ``plugin.py`` by explicit path — so this file exists to show the two
# things that make a distribution discoverable:
#
#   1. ``[tool.noeta]`` — the static manifest, mirrored into the wheel as
#      ``noeta-plugin.toml`` package data, which is what lets the loader read
#      identity and contributions without importing any plugin code.
#   2. an entry point in the SDK-owned ``noeta.plugins`` group, so a host running
#      ``load_plugins(entry_points=True)`` discovers the distribution.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "noeta-plugin-protected-paths"
version = "0.1.0"
description = "A path-containment Guard for Noeta, packaged as a manifest plugin."
requires-python = ">=3.11"
dependencies = ["noeta-sdk>=0.4.0"]

# Packaged for real, this directory becomes the importable ``protected_paths``
# package — dashes are illegal in a Python module name — which is why the ``ref``
# below reads ``protected_paths:GUARD`` and not ``plugin:GUARD``.
[tool.noeta]
name = "protected-paths"
requires-noeta = ">=0.4"

[tool.noeta.config-schema.env]
NOETA_PROTECTED_PATHS_ROOTS = "os.pathsep-separated writable roots (default: cwd)"
NOETA_PROTECTED_PATHS_DENY_GLOBS = "comma-separated fnmatch deny globs (default: none)"

[[tool.noeta.contributions]]
surface = "guard"
name = "protected_paths"
ref = "protected_paths:GUARD"

# Discovery only. The value is not a factory — the manifest is read from package
# data — so the entry point exists purely to make the distribution visible to
# ``load_plugins(entry_points=True)``.
[project.entry-points."noeta.plugins"]
protected-paths = "protected_paths"

[tool.hatch.build.targets.wheel]
only-include = ["plugin.py", "noeta-plugin.toml"]
