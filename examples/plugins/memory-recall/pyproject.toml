# Illustrative packaging for the ``memory-recall`` manifest plugin.
#
# This file shows the *real* distribution shape (spec D1): the ``[tool.noeta]``
# static manifest (mirrored to ``noeta-plugin.toml`` package data, read WITHOUT
# importing plugin code) plus an entry point in the SDK-owned ``noeta.plugins``
# group so a host started with ``load_plugins(entry_points=True)`` discovers the
# distribution.
#
# In THIS repository the plugin is NOT installed; the tests load it by explicit
# path via ``load_plugins(modules=[".../plugin.py"])``. When packaged for
# real, the ``memory-recall`` directory becomes the importable ``memory_recall``
# package (dashes are not valid in a Python module name), so ``ref`` resolves to
# ``memory_recall:rag_recall``.

[project]
name = "noeta-plugin-memory-recall"
version = "0.1.0"
description = "A RAG-style (track A) reminder_provider on the turn_intake seam, with a stub retriever."
requires-python = ">=3.10"
dependencies = ["noeta-sdk"]

[tool.noeta]
name = "memory-recall"
requires-noeta = ">=0.4"

[[tool.noeta.contributions]]
surface = "reminder_provider"
name = "rag-recall"
ref = "memory_recall:rag_recall"
seams = ["turn_intake"]

# The discovery hook (its VALUE is not a factory in the manifest mechanism — the
# manifest is read from package data; the entry point only makes the dist
# discoverable).
[project.entry-points."noeta.plugins"]
memory-recall = "memory_recall"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
