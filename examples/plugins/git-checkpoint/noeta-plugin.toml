# The shipped static manifest, mirrored from ``[tool.noeta]`` into wheel package
# data. Reading identity and contributions from here is what lets a host list and
# collision-check plugins without executing any of their code.
# ``python -m noeta.sdk.plugin_check`` verifies this file against what
# ``plugin.py``'s builder declares — edit both or neither.
name = "git-checkpoint"
requires-noeta = ">=0.4"

# Descriptive only: nothing in the loader reads this, so it must be kept true by
# hand. Configuration reaches the plugin through the environment.
[config-schema.env]
NOETA_GIT_CHECKPOINT_REPO = "workspace git repo to checkpoint (default: cwd)"
NOETA_GIT_CHECKPOINT_REF = "checkpoint ref (default: refs/noeta/checkpoints)"

[[contributions]]
surface = "observer"
name = "git_checkpoint"
ref = "git_checkpoint:OBSERVER"
