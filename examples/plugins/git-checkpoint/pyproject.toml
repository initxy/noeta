# Illustrative packaging for the ``git-checkpoint`` plugin. Not built here — the
# tests load ``plugin.py`` by explicit path — so this file exists to show the two
# things that make a distribution discoverable: the ``[tool.noeta]`` manifest
# (mirrored into the wheel as ``noeta-plugin.toml`` package data, which is what
# lets the loader read identity and contributions without importing plugin code)
# and an entry point in the SDK-owned ``noeta.plugins`` group.

[project]
name = "noeta-plugin-git-checkpoint"
version = "0.1.0"
description = "Noeta plugin: snapshot the workspace around mutating tool calls onto a dedicated git ref, with a restore path."
license = "Apache-2.0"
authors = [{ name = "The Noeta Authors" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "noeta-sdk>=0.4.0",
]

# Packaged for real, this directory becomes the importable ``git_checkpoint``
# package — dashes are illegal in a Python module name — which is why the ``ref``
# below reads ``git_checkpoint:OBSERVER`` and not ``plugin:OBSERVER``.
[tool.noeta]
name = "git-checkpoint"
requires-noeta = ">=0.4"

[tool.noeta.config-schema.env]
NOETA_GIT_CHECKPOINT_REPO = "workspace git repo to checkpoint (default: cwd)"
NOETA_GIT_CHECKPOINT_REF = "checkpoint ref (default: refs/noeta/checkpoints)"

[[tool.noeta.contributions]]
surface = "observer"
name = "git_checkpoint"
ref = "git_checkpoint:OBSERVER"

# Discovery only. The value is not a factory — the manifest is read from package
# data — so the entry point exists purely to make the distribution visible to
# ``load_plugins(entry_points=True)``.
[project.entry-points."noeta.plugins"]
git-checkpoint = "git_checkpoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["plugin.py", "noeta-plugin.toml"]
