# Illustrative packaging for the ``git-checkpoint`` manifest plugin.
#
# In THIS repository the plugin is loaded by explicit path (it is an in-tree
# example, see README.md), so this file is not built. A real, pip-installable
# plugin ships the ``[tool.noeta]`` manifest (mirrored to ``noeta-plugin.toml``
# package data) plus an entry point in the SDK-owned ``noeta.plugins`` group so
# ``load_plugins(entry_points=True)`` discovers the distribution.

[project]
name = "noeta-plugin-git-checkpoint"
version = "0.1.0"
description = "Noeta plugin: snapshot the workspace around mutating tool calls onto a dedicated git ref, with a restore path."
license = "Apache-2.0"
authors = [{ name = "The Noeta Authors" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "noeta-sdk>=0.4.0",
]

# The static manifest (D1). A real distribution ships ``plugin.py`` inside an
# importable package (``git_checkpoint/``), so ``ref`` reads
# ``git_checkpoint:OBSERVER``.
[tool.noeta]
name = "git-checkpoint"
requires-noeta = ">=0.4"

[tool.noeta.config-schema.env]
NOETA_GIT_CHECKPOINT_REPO = "workspace git repo to checkpoint (default: cwd)"
NOETA_GIT_CHECKPOINT_REF = "checkpoint ref (default: refs/noeta/checkpoints)"

[[tool.noeta.contributions]]
surface = "observer"
name = "git_checkpoint"
ref = "git_checkpoint:OBSERVER"

# The discovery hook (its VALUE is not a factory in the manifest mechanism — the
# manifest is read from package data; the entry point only makes the dist
# discoverable).
[project.entry-points."noeta.plugins"]
git-checkpoint = "git_checkpoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["plugin.py", "noeta-plugin.toml"]
