# Illustration of the packaging convention for a distributed Noeta plugin.
#
# In THIS repository the plugin is loaded by explicit path (it is an in-tree
# example, see README.md), so this file is not built. A real, pip-installable
# plugin declares its factory under the ``noeta.plugins`` entry-point group;
# ``load_plugins(entry_points=True)`` then discovers it by that group. The
# entry-point *key* becomes the plugin's identity name (here ``git-checkpoint``,
# matching ``noeta_plugin_name`` in plugin.py).

[project]
name = "noeta-plugin-git-checkpoint"
version = "0.1.0"
description = "Noeta plugin: snapshot the workspace around mutating tool calls onto a dedicated git ref, with a restore path."
license = "Apache-2.0"
authors = [{ name = "The Noeta Authors" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "noeta-sdk>=0.4.0",
]

# The SDK owns the ``noeta.plugins`` entry-point group (ADR D2). The key is the
# plugin's identity name; the value points at the ``noeta_plugin`` factory.
[project.entry-points."noeta.plugins"]
git-checkpoint = "plugin:noeta_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["plugin.py"]
