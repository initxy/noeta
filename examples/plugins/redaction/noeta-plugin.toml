# The shipped static manifest, mirrored from ``[tool.noeta]`` into wheel package
# data. Reading identity and contributions from here is what lets a host list and
# collision-check plugins without executing any of their code.
# ``python -m noeta.sdk.plugin_check`` verifies this file matches what
# ``plugin.py``'s decorators declare — edit both or neither.
name = "redaction"
requires-noeta = ">=0.4"

[[contributions]]
surface = "tool_result_transform"
name = "scrub-secrets"
ref = "redaction:scrub_secrets"
priority = 50
