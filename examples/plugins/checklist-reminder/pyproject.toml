# Illustrative packaging for the ``checklist-reminder`` manifest plugin.
#
# This file shows the *real* distribution shape (spec D1): the ``[tool.noeta]``
# static manifest (mirrored to ``noeta-plugin.toml`` package data, read WITHOUT
# importing plugin code) plus an entry point in the SDK-owned ``noeta.plugins``
# group so a host started with ``load_plugins(entry_points=True)`` discovers the
# distribution.
#
# In THIS repository the plugin is NOT installed; the tests load it by explicit
# path via ``load_plugin_set(modules=[".../plugin.py"])``. When packaged for
# real, the ``checklist-reminder`` directory becomes the importable
# ``checklist_reminder`` package (dashes are not valid in a Python module name),
# so ``ref`` resolves to ``checklist_reminder:long_checklist_reminder``.

[project]
name = "noeta-plugin-checklist-reminder"
version = "0.1.0"
description = "A compose-time (track B) reminder that nags when the todo checklist grows long."
requires-python = ">=3.10"
dependencies = ["noeta-sdk"]

[tool.noeta]
name = "checklist-reminder"
requires-noeta = ">=0.4"

[[tool.noeta.contributions]]
surface = "reminder"
name = "long-checklist"
ref = "checklist_reminder:long_checklist_reminder"
priority = 400

# The discovery hook (its VALUE is not a factory in the manifest mechanism — the
# manifest is read from package data; the entry point only makes the dist
# discoverable).
[project.entry-points."noeta.plugins"]
checklist-reminder = "checklist_reminder"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
