# Illustrative packaging for the ``checklist-reminder`` plugin. Not built here —
# the tests load ``plugin.py`` by explicit path — so this file exists to show the
# two things that make a distribution discoverable: the ``[tool.noeta]`` manifest
# (mirrored into the wheel as ``noeta-plugin.toml`` package data, which is what
# lets the loader read identity and contributions without importing plugin code)
# and an entry point in the SDK-owned ``noeta.plugins`` group.
#
# Packaged for real, this directory becomes the importable ``checklist_reminder``
# package — dashes are illegal in a Python module name — which is why the ``ref``
# below reads ``checklist_reminder:long_checklist_reminder``.

[project]
name = "noeta-plugin-checklist-reminder"
version = "0.1.0"
description = "A compose-time reminder that nudges when the todo checklist grows long."
requires-python = ">=3.10"
dependencies = ["noeta-sdk"]

[tool.noeta]
name = "checklist-reminder"
requires-noeta = ">=0.4"

[[tool.noeta.contributions]]
surface = "reminder"
name = "long-checklist"
ref = "checklist_reminder:long_checklist_reminder"
priority = 400

# Discovery only. The value is not a factory — the manifest is read from package
# data — so the entry point exists purely to make the distribution visible to
# ``load_plugins(entry_points=True)``.
[project.entry-points."noeta.plugins"]
checklist-reminder = "checklist_reminder"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
