[project]
name = "noeta-tui"
version = "1.0.0.dev0"
description = "noeta's terminal UI, in Claude Code's shape: `noeta` with no arguments opens it."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["noeta", "textual>=8.0"]

# `noeta` (no arguments) finds the terminal UI by this name.
[project.entry-points."noeta.frontends"]
tui = "noeta_tui:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noeta_tui"]

[tool.uv.sources]
noeta = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --import-mode=importlib"
pythonpath = ["tests"]
faulthandler_timeout = 120
timeout = 300
timeout_method = "thread"

[tool.coverage.run]
source = ["noeta_tui"]
branch = true
