[project]
name = "noeta-tui"
version = "1.1.3"
description = "Terminal UI for noeta, the open-source Claude Code-compatible coding agent: `noeta` with no arguments opens it."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "The Noeta Authors", email = "initxy0@gmail.com" }]
keywords = ["ai-agent", "coding-agent", "ai-coding", "claude-code", "llm", "tui", "terminal", "textual", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
requires-python = ">=3.11"
# Released together with noeta, at the same version (docs/releasing.md).
dependencies = ["noeta==1.1.3", "textual>=8.0"]

[project.urls]
Homepage = "https://github.com/initxy/noeta"
Documentation = "https://initxy.github.io/noeta/guides/terminal"
Source = "https://github.com/initxy/noeta/tree/main/tui"
Issues = "https://github.com/initxy/noeta/issues"

# `noeta` (no arguments) finds the terminal UI by this name.
[project.entry-points."noeta.frontends"]
tui = "noeta_tui:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noeta_tui"]

[tool.uv.sources]
noeta = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --import-mode=importlib"
pythonpath = ["tests"]
faulthandler_timeout = 120
timeout = 300
timeout_method = "thread"

[tool.coverage.run]
source = ["noeta_tui"]
branch = true
