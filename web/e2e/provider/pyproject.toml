[project]
name = "noeta-web-e2e"
version = "0.1.0"
description = "Test-only: the offline scripted provider the web app's end-to-end test runs noeta serve on."
requires-python = ">=3.11"
dependencies = ["noeta"]

# Registered as a third-party provider would be, so `noeta serve` finds it by name.
[project.entry-points."noeta.providers"]
web_e2e = "noeta_web_e2e:provider"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noeta_web_e2e"]

[tool.uv.sources]
noeta = { path = "../../..", editable = true }
