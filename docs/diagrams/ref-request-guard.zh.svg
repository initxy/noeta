<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" role="img" aria-label="每个 noeta serve 请求先查 Host 和来源，再查 bearer token，然后交给一个会拒绝越权配置项、信号、bypassPermissions 和目录的客户端"><style data-ntd>svg{--ntd-bg:#ffffff;--ntd-panel:#f6f6f7;--ntd-border:#c2c2c4;--ntd-text1:#3c3c43;--ntd-text2:#67676c;--ntd-text3:#929295;--ntd-brand:#059669;--ntd-green:#10b981;--ntd-violet:#8b5cf6;--ntd-amber:#f59e0b;--ntd-cyan:#0891b2;--ntd-red:#e11d48;--ntd-green-soft:rgba(16,185,129,.14);--ntd-violet-soft:rgba(139,92,246,.13);--ntd-amber-soft:rgba(245,158,11,.14);--ntd-cyan-soft:rgba(8,145,178,.12);--ntd-red-soft:rgba(225,29,72,.10);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif}@media (prefers-color-scheme:dark){svg{--ntd-bg:#1b1b1f;--ntd-panel:#202127;--ntd-border:#3c3f44;--ntd-text1:#dfdfd6;--ntd-text2:#98989f;--ntd-text3:#6a6a71;--ntd-brand:#34d399;--ntd-green:#10b981;--ntd-violet:#a78bfa;--ntd-amber:#fbbf24;--ntd-cyan:#22d3ee;--ntd-red:#fb7185;--ntd-green-soft:rgba(16,185,129,.18);--ntd-violet-soft:rgba(139,92,246,.20);--ntd-amber-soft:rgba(245,158,11,.18);--ntd-cyan-soft:rgba(34,211,238,.14);--ntd-red-soft:rgba(251,113,133,.14)}}.ntd-bg{fill:var(--ntd-panel)}.ntd-box{fill:var(--ntd-bg);stroke:var(--ntd-border);stroke-width:1.2}.ntd-frame{fill:none;stroke:var(--ntd-green);stroke-width:1.4;stroke-dasharray:6 5}.ntd-dash{stroke-dasharray:5 4}.ntd-chip{fill:var(--ntd-bg);stroke:var(--ntd-border);stroke-width:1.2}.ntd-chip-green{fill:var(--ntd-green-soft);stroke:var(--ntd-green)}.ntd-chip-violet{fill:var(--ntd-violet-soft);stroke:var(--ntd-violet)}.ntd-chip-amber{fill:var(--ntd-amber-soft);stroke:var(--ntd-amber)}.ntd-chip-cyan{fill:var(--ntd-cyan-soft);stroke:var(--ntd-cyan)}.ntd-chip-red{fill:var(--ntd-red-soft);stroke:var(--ntd-red)}.ntd-title{fill:var(--ntd-text1);font-size:15px;font-weight:600}.ntd-label{fill:var(--ntd-brand);font-size:13px;font-weight:600}.ntd-sub{fill:var(--ntd-text2);font-size:12.5px}.ntd-mini{fill:var(--ntd-text2);font-size:11.5px}.ntd-strong{fill:var(--ntd-text1);font-weight:600}.ntd-em{font-style:italic}.ntd-chiptext{fill:var(--ntd-text1);font-size:13px;font-weight:500}.ntd-code{fill:var(--ntd-brand);font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.ntd-red{fill:var(--ntd-red)}.ntd-line{stroke:var(--ntd-text3);stroke-width:1.4;fill:none}.ntd-dashed{stroke-dasharray:5 4}.ntd-line-green{stroke:var(--ntd-green);stroke-width:1.6;fill:none}.ntd-line-violet{stroke:var(--ntd-violet);stroke-width:1.6;fill:none}.ntd-line-amber{stroke:var(--ntd-amber);stroke-width:1.8;fill:none}.ntd-line-red{stroke:var(--ntd-red);stroke-width:1.6;fill:none}.ntd-arrowhead{fill:var(--ntd-text3)}.ntd-arrowhead-green{fill:var(--ntd-green)}.ntd-arrowhead-violet{fill:var(--ntd-violet)}.ntd-arrowhead-amber{fill:var(--ntd-amber)}.ntd-arrowhead-red{fill:var(--ntd-red)}</style>
<defs><marker id="ref-request-guard-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead"/></marker><marker id="ref-request-guard-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead-green"/></marker><marker id="ref-request-guard-arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead-violet"/></marker><marker id="ref-request-guard-arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead-amber"/></marker><marker id="ref-request-guard-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead-red"/></marker></defs>
<rect x="10" y="60" width="132" height="80" rx="10" class="ntd-chip ntd-chip-amber"/>
<text x="76.0" y="95.0" class="ntd-title" text-anchor="middle">请求</text>
<text x="76.0" y="115.0" class="ntd-mini" text-anchor="middle">HTTP 或 WebSocket</text>
<rect x="166" y="50" width="196" height="100" rx="10" class="ntd-chip"/>
<text x="264.0" y="86.0" class="ntd-chiptext" text-anchor="middle">Host 和来源</text>
<text x="264.0" y="105.0" class="ntd-mini" text-anchor="middle">回环地址名或 --allow-host</text>
<text x="264.0" y="124.0" class="ntd-mini" text-anchor="middle">本服务的页面或 --allow-origin</text>
<rect x="392" y="50" width="196" height="100" rx="10" class="ntd-chip"/>
<text x="490.0" y="86.0" class="ntd-chiptext" text-anchor="middle">Bearer token</text>
<text x="490.0" y="105.0" class="ntd-mini" text-anchor="middle">Authorization: Bearer …</text>
<text x="490.0" y="124.0" class="ntd-mini" text-anchor="middle">?token= 只用于 WebSocket</text>
<path d="M 142 100 L 164 100" class="ntd-line" marker-end="url(#ref-request-guard-arrow)"/>
<path d="M 362 100 L 390 100" class="ntd-line" marker-end="url(#ref-request-guard-arrow)"/>
<rect x="166" y="196" width="196" height="40" rx="10" class="ntd-chip ntd-chip-red"/>
<text x="264.0" y="221.0" class="ntd-chiptext" text-anchor="middle">403 跨站请求</text>
<rect x="392" y="196" width="196" height="40" rx="10" class="ntd-chip ntd-chip-red"/>
<text x="490.0" y="221.0" class="ntd-chiptext" text-anchor="middle">401 未授权</text>
<path d="M 264 150 L 264 194" class="ntd-line-red" marker-end="url(#ref-request-guard-arrow-red)"/>
<path d="M 490 150 L 490 194" class="ntd-line-red" marker-end="url(#ref-request-guard-arrow-red)"/>
<rect x="618" y="20" width="306" height="230" rx="14" class="ntd-frame"/>
<text x="634" y="44" class="ntd-label" text-anchor="start">处理函数，用带检查的客户端</text>
<rect x="634" y="58" width="274" height="36" rx="10" class="ntd-chip"/>
<text x="771.0" y="81.0" class="ntd-mini" text-anchor="middle">配置项：model、effort、cwd 等</text>
<rect x="634" y="102" width="274" height="36" rx="10" class="ntd-chip"/>
<text x="771.0" y="125.0" class="ntd-mini" text-anchor="middle">信号：前端会发的六种</text>
<rect x="634" y="146" width="274" height="36" rx="10" class="ntd-chip"/>
<text x="771.0" y="169.0" class="ntd-mini" text-anchor="middle">bypassPermissions：服务端允许才行</text>
<rect x="634" y="190" width="274" height="36" rx="10" class="ntd-chip"/>
<text x="771.0" y="213.0" class="ntd-mini" text-anchor="middle">cwd：服务端目录或 --allow-root 之下</text>
<path d="M 588 100 L 616 100" class="ntd-line" marker-end="url(#ref-request-guard-arrow)"/>
<rect x="618" y="290" width="150" height="40" rx="10" class="ntd-chip ntd-chip-red"/>
<text x="693.0" y="315.0" class="ntd-chiptext" text-anchor="middle">403 拒绝</text>
<rect x="784" y="290" width="140" height="40" rx="10" class="ntd-chip ntd-chip-violet"/>
<text x="854.0" y="315.0" class="ntd-chiptext" text-anchor="middle">200 · 201 → 存储</text>
<rect x="618" y="346" width="306" height="40" rx="10" class="ntd-chip ntd-chip-red"/>
<text x="771.0" y="371.0" class="ntd-chiptext" text-anchor="middle">404 任务不存在 · 400 请求体有误</text>
<path d="M 693 250 L 693 288" class="ntd-line-red" marker-end="url(#ref-request-guard-arrow-red)"/>
<path d="M 854 250 L 854 288" class="ntd-line" marker-end="url(#ref-request-guard-arrow)"/>
<rect x="166" y="290" width="422" height="40" rx="10" class="ntd-box ntd-dash"/>
<text x="377.0" y="315.0" class="ntd-mini" text-anchor="middle">被拒的 WebSocket：握手直接回 403</text>
</svg>
