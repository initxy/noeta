<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-label="自动压缩前后的对话：较早的轮次换成摘要，最新的回复原样保留"><style data-ntd>svg{--ntd-bg:#ffffff;--ntd-panel:#f6f6f7;--ntd-border:#c2c2c4;--ntd-text1:#3c3c43;--ntd-text2:#67676c;--ntd-text3:#929295;--ntd-brand:#059669;--ntd-green:#10b981;--ntd-violet:#8b5cf6;--ntd-amber:#f59e0b;--ntd-cyan:#0891b2;--ntd-red:#e11d48;--ntd-green-soft:rgba(16,185,129,.14);--ntd-violet-soft:rgba(139,92,246,.13);--ntd-amber-soft:rgba(245,158,11,.14);--ntd-cyan-soft:rgba(8,145,178,.12);--ntd-red-soft:rgba(225,29,72,.10);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif}@media (prefers-color-scheme:dark){svg{--ntd-bg:#1b1b1f;--ntd-panel:#202127;--ntd-border:#3c3f44;--ntd-text1:#dfdfd6;--ntd-text2:#98989f;--ntd-text3:#6a6a71;--ntd-brand:#34d399;--ntd-green:#10b981;--ntd-violet:#a78bfa;--ntd-amber:#fbbf24;--ntd-cyan:#22d3ee;--ntd-red:#fb7185;--ntd-green-soft:rgba(16,185,129,.18);--ntd-violet-soft:rgba(139,92,246,.20);--ntd-amber-soft:rgba(245,158,11,.18);--ntd-cyan-soft:rgba(34,211,238,.14);--ntd-red-soft:rgba(251,113,133,.14)}}.ntd-bg{fill:var(--ntd-panel)}.ntd-box{fill:var(--ntd-bg);stroke:var(--ntd-border);stroke-width:1.2}.ntd-frame{fill:none;stroke:var(--ntd-green);stroke-width:1.4;stroke-dasharray:6 5}.ntd-dash{stroke-dasharray:5 4}.ntd-chip{fill:var(--ntd-bg);stroke:var(--ntd-border);stroke-width:1.2}.ntd-chip-green{fill:var(--ntd-green-soft);stroke:var(--ntd-green)}.ntd-chip-violet{fill:var(--ntd-violet-soft);stroke:var(--ntd-violet)}.ntd-chip-amber{fill:var(--ntd-amber-soft);stroke:var(--ntd-amber)}.ntd-chip-cyan{fill:var(--ntd-cyan-soft);stroke:var(--ntd-cyan)}.ntd-chip-red{fill:var(--ntd-red-soft);stroke:var(--ntd-red)}.ntd-title{fill:var(--ntd-text1);font-size:15px;font-weight:600}.ntd-label{fill:var(--ntd-brand);font-size:13px;font-weight:600}.ntd-sub{fill:var(--ntd-text2);font-size:12.5px}.ntd-mini{fill:var(--ntd-text2);font-size:11.5px}.ntd-strong{fill:var(--ntd-text1);font-weight:600}.ntd-em{font-style:italic}.ntd-chiptext{fill:var(--ntd-text1);font-size:13px;font-weight:500}.ntd-code{fill:var(--ntd-brand);font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.ntd-red{fill:var(--ntd-red)}.ntd-line{stroke:var(--ntd-text3);stroke-width:1.4;fill:none}.ntd-dashed{stroke-dasharray:5 4}.ntd-line-green{stroke:var(--ntd-green);stroke-width:1.6;fill:none}.ntd-line-violet{stroke:var(--ntd-violet);stroke-width:1.6;fill:none}.ntd-line-amber{stroke:var(--ntd-amber);stroke-width:1.8;fill:none}.ntd-line-red{stroke:var(--ntd-red);stroke-width:1.6;fill:none}.ntd-arrowhead{fill:var(--ntd-text3)}.ntd-arrowhead-green{fill:var(--ntd-green)}.ntd-arrowhead-violet{fill:var(--ntd-violet)}.ntd-arrowhead-amber{fill:var(--ntd-amber)}.ntd-arrowhead-red{fill:var(--ntd-red)}</style>
<defs><marker id="ctx-compaction-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead"/></marker></defs>
<text x="40" y="40" class="ntd-label">压缩前（折叠出的消息）</text>
<text x="560" y="40" class="ntd-label">压缩后（Compacted 事件）</text>
<rect x="40" y="56" width="300" height="44" rx="10" class="ntd-chip ntd-chip-violet"/>
<text x="190" y="74.5" class="ntd-chiptext" text-anchor="middle">开头的背景</text>
<text x="190" y="92.5" class="ntd-mini" text-anchor="middle">项目说明、记忆索引</text>
<rect x="40" y="112" width="300" height="96" rx="10" class="ntd-chip ntd-chip-violet"/>
<text x="190" y="156.5" class="ntd-chiptext" text-anchor="middle">较早的轮次</text>
<text x="190" y="174.5" class="ntd-mini" text-anchor="middle">提问、回复、工具结果</text>
<rect x="40" y="220" width="300" height="44" rx="10" class="ntd-chip ntd-chip-violet"/>
<text x="190" y="238.5" class="ntd-chiptext" text-anchor="middle">最新一条回复</text>
<text x="190" y="256.5" class="ntd-mini" text-anchor="middle">和它之后的工具结果</text>
<rect x="40" y="276" width="300" height="36" rx="10" class="ntd-chip ntd-dash"/>
<text x="190" y="298" class="ntd-chiptext" text-anchor="middle">这一步的系统轮</text>
<rect x="560" y="56" width="310" height="44" rx="10" class="ntd-chip ntd-chip-violet"/>
<text x="715" y="74.5" class="ntd-chiptext" text-anchor="middle">lead</text>
<text x="715" y="92.5" class="ntd-mini" text-anchor="middle">重新读一遍的项目说明和记忆索引</text>
<rect x="560" y="112" width="310" height="60" rx="10" class="ntd-chip ntd-chip-cyan"/>
<text x="715" y="131" class="ntd-chiptext" text-anchor="middle">摘要</text>
<text x="715" y="149" class="ntd-mini" text-anchor="middle">说明它代替了什么、之前用过的工具、</text>
<text x="715" y="164" class="ntd-mini" text-anchor="middle">完整记录的路径、接着干活</text>
<rect x="560" y="184" width="310" height="44" rx="10" class="ntd-chip ntd-chip-violet"/>
<text x="715" y="202.5" class="ntd-chiptext" text-anchor="middle">最新回复和它之后的内容</text>
<text x="715" y="220.5" class="ntd-mini" text-anchor="middle">原样保留（seq &gt; through）</text>
<rect x="560" y="240" width="310" height="44" rx="10" class="ntd-chip ntd-chip-violet ntd-dash"/>
<text x="715" y="258.5" class="ntd-chiptext" text-anchor="middle">重新挂上的内容（resident）</text>
<text x="715" y="276.5" class="ntd-mini" text-anchor="middle">用过的技能、MCP 说明、计划、后台任务</text>
<rect x="560" y="296" width="310" height="44" rx="10" class="ntd-chip ntd-dash"/>
<text x="715" y="314.5" class="ntd-chiptext" text-anchor="middle">下一次请求的系统轮</text>
<text x="715" y="332.5" class="ntd-mini" text-anchor="middle">重读的文件、环境、工具清单</text>
<rect x="380" y="150" width="140" height="92" rx="10" class="ntd-chip ntd-chip-cyan"/>
<text x="450" y="177.5" class="ntd-chiptext" text-anchor="middle">总结调用</text>
<text x="450" y="195.5" class="ntd-mini" text-anchor="middle">主请求 + 总结提示词</text>
<text x="450" y="210.5" class="ntd-mini" text-anchor="middle">（或已在后台写好</text>
<text x="450" y="225.5" class="ntd-mini" text-anchor="middle">的摘要）</text>
<path d="M 340 160 L 378 160" class="ntd-line" marker-end="url(#ctx-compaction-arrow)"/>
<path d="M 520 162 L 540 162 L 540 142 L 558 142" class="ntd-line" marker-end="url(#ctx-compaction-arrow)"/>
<path d="M 340 78 L 558 78" class="ntd-line ntd-dashed" marker-end="url(#ctx-compaction-arrow)"/>
<text x="449" y="72" class="ntd-mini" text-anchor="middle">重读</text>
<path d="M 340 242 L 360 242 L 360 270 L 540 270 L 540 206 L 558 206" class="ntd-line" marker-end="url(#ctx-compaction-arrow)"/>
<text x="450" y="264" class="ntd-mini" text-anchor="middle">原样</text>
<text x="450" y="428" class="ntd-mini" text-anchor="middle">日志保留每一条消息；Compacted.through 只说明折叠时从哪个 seq 往前换成摘要，下一次请求按折叠结果重新拼出来。</text>
</svg>
