<text x="340.0" y="133.0" class="ntd-chiptext" text-anchor="middle">无界面协议</text>
<text x="340.0" y="151.0" class="ntd-code" text-anchor="middle">stream_json.py</text>
<rect x="240" y="180" width="200" height="54" rx="10" class="ntd-chip ntd-chip-green"/>
<text x="340.0" y="203.0" class="ntd-chiptext" text-anchor="middle">ACP 适配层</text>
<text x="340.0" y="221.0" class="ntd-code" text-anchor="middle">acp.py</text>
<rect x="480" y="40" width="190" height="194" rx="10" class="ntd-box"/>
<text x="575" y="64" class="ntd-title" text-anchor="middle">AppAPI</text>
<rect x="495" y="78" width="160" height="50" rx="10" class="ntd-chip ntd-chip-green"/>
<text x="575.0" y="99.5" class="ntd-chiptext" text-anchor="middle">LocalApp</text>
<text x="575.0" y="116.5" class="ntd-mini" text-anchor="middle">存储和工人都在本地</text>
<rect x="495" y="168" width="160" height="50" rx="10" class="ntd-chip ntd-chip-green"/>
<text x="575.0" y="189.5" class="ntd-chiptext" text-anchor="middle">RemoteApp</text>
<text x="575.0" y="206.5" class="ntd-mini" text-anchor="middle">同样的调用走 HTTP</text>
<rect x="480" y="320" width="190" height="64" rx="10" class="ntd-chip ntd-chip-green"/>
<text x="575.0" y="347.5" class="ntd-chiptext" text-anchor="middle">noeta serve</text>
<text x="575.0" y="366.5" class="ntd-mini" text-anchor="middle">HTTP · SSE · WebSocket</text>
<rect x="720" y="40" width="180" height="116" rx="10" class="ntd-box"/>
<text x="810.0" y="73.0" class="ntd-title" text-anchor="middle">客户端接口</text>
<text x="810.0" y="93.0" class="ntd-code" text-anchor="middle">create · send · answer</text>
<text x="810.0" y="113.0" class="ntd-code" text-anchor="middle">cancel · read · watch</text>
