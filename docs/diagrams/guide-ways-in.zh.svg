<path d="M575 218 L575 318" class="ntd-line ntd-dashed" marker-end="url(#guide-ways-in-arrow)"/>
<text x="583" y="274" class="ntd-code" text-anchor="start">--server</text>
<path d="M200 327 L478 341" class="ntd-line" marker-end="url(#guide-ways-in-arrow)"/>
<path d="M200 407 L440 407 L440 372 L478 372" class="ntd-line" marker-end="url(#guide-ways-in-arrow)"/>
<text x="320" y="428" class="ntd-mini" text-anchor="middle">桌面版自己启动一个</text>
<path d="M670 352 L696 352 L696 140 L718 140" class="ntd-line" marker-end="url(#guide-ways-in-arrow)"/>
<path d="M810 156 L810 204" class="ntd-line" marker-end="url(#guide-ways-in-arrow)"/>
<path d="M810 262 L810 310" class="ntd-line" marker-end="url(#guide-ways-in-arrow)"/>
<text x="818" y="290" class="ntd-mini" text-anchor="start">认领 · 追加</text>
<text x="460" y="456" class="ntd-mini" text-anchor="middle">前端不保存任务状态：都从任务日志读，所以哪个前端都能打开任意任务。</text>
</svg>
