<rect x="650" y="126" width="250" height="66" rx="10" class="ntd-box"/>
<text x="775.0" y="152" class="ntd-title" text-anchor="middle">plugin-sources.json</text>
<text x="775.0" y="173" class="ntd-sub" text-anchor="middle">从哪来、哪个提交</text>
<rect x="650" y="222" width="250" height="88" rx="10" class="ntd-box ntd-dash"/>
<text x="775.0" y="248" class="ntd-title" text-anchor="middle">userConfig 的值</text>
<text x="775.0" y="269" class="ntd-sub" text-anchor="middle">settings.json pluginConfigs</text>
<text x="775.0" y="290" class="ntd-sub" text-anchor="middle">敏感值存系统钥匙串</text>
