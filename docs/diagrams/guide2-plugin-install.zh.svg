<text x="130.0" y="248" class="ntd-title" text-anchor="middle">marketplace</text>
<text x="130.0" y="269" class="ntd-code" text-anchor="middle">--marketplace src name</text>
<text x="130.0" y="290" class="ntd-sub" text-anchor="middle">只读，用来找到来源</text>
<rect x="300" y="58" width="290" height="190" rx="10" class="ntd-chip ntd-chip-green"/>
<text x="445.0" y="84" class="ntd-title" text-anchor="middle">noeta plugin add</text>
<text x="445.0" y="105" class="ntd-sub" text-anchor="middle">必须是完整提交号，只走 https / ssh / file</text>
<text x="445.0" y="126" class="ntd-sub" text-anchor="middle">git clone：不跑 hooks、不拉子模块</text>
<text x="445.0" y="147" class="ntd-sub" text-anchor="middle">检出后删掉 .git</text>
<text x="445.0" y="168" class="ntd-sub" text-anchor="middle">不跑安装脚本、不装依赖</text>
<text x="445.0" y="189" class="ntd-sub" text-anchor="middle">插件里的东西一行都不执行</text>
<rect x="650" y="30" width="250" height="66" rx="10" class="ntd-box"/>
<text x="775.0" y="56" class="ntd-title" text-anchor="middle">~/.noeta/plugins/&lt;name&gt;</text>
