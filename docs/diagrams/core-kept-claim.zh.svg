<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 382" role="img" aria-label="后台任务只活在一个工人里时，任务在等待期间保留自己的认领；那个工人死了，租约过期，下一个认领者告诉模型这个后台任务丢了"><style data-ntd>svg{--ntd-bg:#ffffff;--ntd-panel:#f6f6f7;--ntd-border:#c2c2c4;--ntd-text1:#3c3c43;--ntd-text2:#67676c;--ntd-text3:#929295;--ntd-brand:#059669;--ntd-green:#10b981;--ntd-violet:#8b5cf6;--ntd-amber:#f59e0b;--ntd-cyan:#0891b2;--ntd-red:#e11d48;--ntd-green-soft:rgba(16,185,129,.14);--ntd-violet-soft:rgba(139,92,246,.13);--ntd-amber-soft:rgba(245,158,11,.14);--ntd-cyan-soft:rgba(8,145,178,.12);--ntd-red-soft:rgba(225,29,72,.10);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif}@media (prefers-color-scheme:dark){svg{--ntd-bg:#1b1b1f;--ntd-panel:#202127;--ntd-border:#3c3f44;--ntd-text1:#dfdfd6;--ntd-text2:#98989f;--ntd-text3:#6a6a71;--ntd-brand:#34d399;--ntd-green:#10b981;--ntd-violet:#a78bfa;--ntd-amber:#fbbf24;--ntd-cyan:#22d3ee;--ntd-red:#fb7185;--ntd-green-soft:rgba(16,185,129,.18);--ntd-violet-soft:rgba(139,92,246,.20);--ntd-amber-soft:rgba(245,158,11,.18);--ntd-cyan-soft:rgba(34,211,238,.14);--ntd-red-soft:rgba(251,113,133,.14)}}.ntd-bg{fill:var(--ntd-panel)}.ntd-box{fill:var(--ntd-bg);stroke:var(--ntd-border);stroke-width:1.2}.ntd-frame{fill:none;stroke:var(--ntd-green);stroke-width:1.4;stroke-dasharray:6 5}.ntd-dash{stroke-dasharray:5 4}.ntd-chip{fill:var(--ntd-bg);stroke:var(--ntd-border);stroke-width:1.2}.ntd-chip-green{fill:var(--ntd-green-soft);stroke:var(--ntd-green)}.ntd-chip-violet{fill:var(--ntd-violet-soft);stroke:var(--ntd-violet)}.ntd-chip-amber{fill:var(--ntd-amber-soft);stroke:var(--ntd-amber)}.ntd-chip-cyan{fill:var(--ntd-cyan-soft);stroke:var(--ntd-cyan)}.ntd-chip-red{fill:var(--ntd-red-soft);stroke:var(--ntd-red)}.ntd-title{fill:var(--ntd-text1);font-size:15px;font-weight:600}.ntd-label{fill:var(--ntd-brand);font-size:13px;font-weight:600}.ntd-sub{fill:var(--ntd-text2);font-size:12.5px}.ntd-mini{fill:var(--ntd-text2);font-size:11.5px}.ntd-strong{fill:var(--ntd-text1);font-weight:600}.ntd-em{font-style:italic}.ntd-chiptext{fill:var(--ntd-text1);font-size:13px;font-weight:500}.ntd-code{fill:var(--ntd-brand);font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.ntd-red{fill:var(--ntd-red)}.ntd-line{stroke:var(--ntd-text3);stroke-width:1.4;fill:none}.ntd-dashed{stroke-dasharray:5 4}.ntd-line-green{stroke:var(--ntd-green);stroke-width:1.6;fill:none}.ntd-line-violet{stroke:var(--ntd-violet);stroke-width:1.6;fill:none}.ntd-line-amber{stroke:var(--ntd-amber);stroke-width:1.8;fill:none}.ntd-line-red{stroke:var(--ntd-red);stroke-width:1.6;fill:none}.ntd-arrowhead{fill:var(--ntd-text3)}.ntd-arrowhead-green{fill:var(--ntd-green)}.ntd-arrowhead-violet{fill:var(--ntd-violet)}.ntd-arrowhead-amber{fill:var(--ntd-amber)}.ntd-arrowhead-red{fill:var(--ntd-red)}</style>
<defs><marker id="core-kept-claim-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead"/></marker><marker id="core-kept-claim-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead-green"/></marker><marker id="core-kept-claim-arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead-violet"/></marker><marker id="core-kept-claim-arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead-amber"/></marker><marker id="core-kept-claim-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead-red"/></marker></defs>
<text x="20" y="49" class="ntd-title">工人 A</text>
<text x="20" y="121" class="ntd-title">任务行</text>
<path d="M 20 80 L 906 80" class="ntd-line ntd-dashed"/>
<rect x="120" y="20" width="170" height="48" rx="8" class="ntd-chip ntd-chip-green"/>
<text x="205.0" y="40.0" class="ntd-mini" text-anchor="middle">Bash 后台运行</text>
<text x="205.0" y="57.0" class="ntd-code" text-anchor="middle">ctx.keep()</text>
<rect x="296" y="20" width="120" height="48" rx="8" class="ntd-chip ntd-chip-green"/>
<text x="356.0" y="48.5" class="ntd-mini" text-anchor="middle">Waiting + 保留</text>
<rect x="422" y="20" width="250" height="48" rx="8" class="ntd-chip ntd-chip-green ntd-dash"/>
<text x="547.0" y="40.0" class="ntd-mini" text-anchor="middle">每 1/3 租期续租一次</text>
<text x="547.0" y="57.0" class="ntd-mini" text-anchor="middle">自己取这个任务的收件箱</text>
<rect x="678" y="20" width="110" height="48" rx="8" class="ntd-chip ntd-chip-amber"/>
<text x="733.0" y="40.0" class="ntd-mini" text-anchor="middle">后台任务结束：</text>
<text x="733.0" y="57.0" class="ntd-mini" text-anchor="middle">投递到收件箱</text>
<rect x="794" y="20" width="110" height="48" rx="8" class="ntd-chip ntd-chip-green"/>
<text x="849.0" y="40.0" class="ntd-mini" text-anchor="middle">接着在</text>
<text x="849.0" y="57.0" class="ntd-mini" text-anchor="middle">工人 A 上跑</text>
<rect x="120" y="92" width="170" height="40" rx="8" class="ntd-chip ntd-chip-green"/>
<text x="205.0" y="116.5" class="ntd-code" text-anchor="middle">running · A</text>
<rect x="296" y="92" width="486" height="40" rx="8" class="ntd-chip ntd-chip-amber ntd-dash"/>
<text x="539.0" y="116.5" class="ntd-sub" text-anchor="middle">waiting · 持有者 A · 租约保留</text>
<rect x="788" y="92" width="114" height="40" rx="8" class="ntd-chip ntd-chip-green"/>
<text x="845.0" y="116.5" class="ntd-code" text-anchor="middle">running · A</text>
<rect x="12" y="166" width="900" height="204" rx="12" class="ntd-chip ntd-chip-red ntd-dash"/>
<text x="28" y="192" class="ntd-label">如果工人 A 中途死掉</text>
<text x="28" y="231" class="ntd-title">工人 A</text>
<text x="28" y="287" class="ntd-title">任务行</text>
<text x="28" y="343" class="ntd-title">工人 B</text>
<rect x="120" y="206" width="216" height="40" rx="8" class="ntd-chip ntd-chip-green"/>
<text x="228.0" y="230.5" class="ntd-mini" text-anchor="middle">Bash 后台运行 · keep</text>
<path d="M 343 217 L 361 235 M 361 217 L 343 235" class="ntd-line-red"/>
<text x="368" y="231" class="ntd-sub ntd-red">被杀掉</text>
<rect x="120" y="262" width="216" height="40" rx="8" class="ntd-chip ntd-chip-amber ntd-dash"/>
<text x="228.0" y="286.5" class="ntd-mini" text-anchor="middle">waiting · 持有者 A · 租约保留</text>
<rect x="344" y="262" width="230" height="40" rx="8" class="ntd-chip ntd-chip-red"/>
<text x="459.0" y="286.5" class="ntd-mini" text-anchor="middle">租约过期：立刻可被认领</text>
<path d="M 459 302 L 459 316" class="ntd-line" marker-end="url(#core-kept-claim-arrow)"/>
<rect x="344" y="318" width="140" height="40" rx="8" class="ntd-chip ntd-chip-green"/>
<text x="414.0" y="342.5" class="ntd-mini" text-anchor="middle">认领（epoch + 1）</text>
<rect x="492" y="318" width="140" height="40" rx="8" class="ntd-chip ntd-chip-green"/>
<text x="562.0" y="342.5" class="ntd-mini" text-anchor="middle">这里没有那个后台任务</text>
<rect x="640" y="318" width="128" height="40" rx="8" class="ntd-chip ntd-chip-green"/>
<text x="704.0" y="342.5" class="ntd-code" text-anchor="middle">投递 JOBS_LOST</text>
<rect x="776" y="318" width="130" height="40" rx="8" class="ntd-chip ntd-chip-amber"/>
<text x="841.0" y="342.5" class="ntd-mini" text-anchor="middle">告诉模型：后台任务丢了</text>
<path d="M 484 338 L 491 338" class="ntd-line" marker-end="url(#core-kept-claim-arrow)"/>
<path d="M 632 338 L 639 338" class="ntd-line" marker-end="url(#core-kept-claim-arrow)"/>
<path d="M 768 338 L 775 338" class="ntd-line" marker-end="url(#core-kept-claim-arrow)"/>
</svg>
