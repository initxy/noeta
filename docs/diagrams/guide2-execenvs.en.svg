ar(--ntd-text2);font-size:11.5px}.ntd-strong{fill:var(--ntd-text1);font-weight:600}.ntd-em{font-style:italic}.ntd-chiptext{fill:var(--ntd-text1);font-size:13px;font-weight:500}.ntd-code{fill:var(--ntd-brand);font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.ntd-red{fill:var(--ntd-red)}.ntd-line{stroke:var(--ntd-text3);stroke-width:1.4;fill:none}.ntd-dashed{stroke-dasharray:5 4}.ntd-line-green{stroke:var(--ntd-green);stroke-width:1.6;fill:none}.ntd-line-violet{stroke:var(--ntd-violet);stroke-width:1.6;fill:none}.ntd-line-amber{stroke:var(--ntd-amber);stroke-width:1.8;fill:none}.ntd-line-red{stroke:var(--ntd-red);stroke-width:1.6;fill:none}.ntd-arrowhead{fill:var(--ntd-text3)}.ntd-arrowhead-green{fill:var(--ntd-green)}.ntd-arrowhead-violet{fill:var(--ntd-violet)}.ntd-arrowhead-amber{fill:var(--ntd-amber)}.ntd-arrowhead-red{fill:var(--ntd-red)}</style>
<defs><marker id="guide2-execenvs-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead"/></marker><marker id="guide2-execenvs-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead-green"/></marker><marker id="guide2-execenvs-arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead-violet"/></marker><marker id="guide2-execenvs-arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead-amber"/></marker><marker id="guide2-execenvs-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead-red"/></marker></defs>
<rect x="24" y="150" width="200" height="96" rx="10" class="ntd-chip ntd-chip-green"/>
<text x="124" y="180" class="ntd-title" text-anchor="middle">Tools</text>
<text x="124" y="204" class="ntd-mini" text-anchor="middle">Read · Write · Edit · Grep</text>
<text x="124" y="224" class="ntd-mini" text-anchor="middle">Glob · Bash · Monitor</text>
<rect x="290" y="24" width="240" height="60" rx="10" class="ntd-chip ntd-dash"/>
<text x="410.0" y="49.0" class="ntd-chiptext" text-anchor="middle">per task: env_for(state)</text>
<text x="410.0" y="69.0" class="ntd-mini" text-anchor="middle">a Runtime argument</text>
<rect x="290" y="130" width="240" height="136" rx="10" class="ntd-box"/>
<text x="410" y="158" class="ntd-code" text-anchor="middle">ExecEnv</text>
<text x="410" y="186" class="ntd-code" text-anchor="middle">run(argv, cwd, env, timeout)</text>
<text x="410" y="210" class="ntd-code" text-anchor="middle">read_bytes · read_range</text>
<text x="410" y="234" class="ntd-code" text-anchor="middle">write_bytes · stat · realpath</text>
<path d="M 224 198 H 288" class="ntd-line" marker-end="url(#guide2-execenvs-arrow)"/>
<path d="M 410 84 V 128" class="ntd-line ntd-dashed" marker-end="url(#guide2-execenvs-arrow)"/>
<rect x="590" y="24" width="286" height="96" rx="10" class="ntd-chip ntd-chip-green"/>
<text x="733" y="56.0" class="ntd-code" text-anchor="middle">LocalExecEnv</text>
<text x="733" y="78.0" class="ntd-mini" text-anchor="middle">subprocesses here, one process group each</text>
<text x="733" y="98.0" class="ntd-mini" text-anchor="middle">the default; what the noeta command uses</text>
<path d="M 530 198 C 560 198, 560 72.0, 588 72.0" class="ntd-line" marker-end="url(#guide2-execenvs-arrow)"/>
<rect x="590" y="150" width="286" height="110" rx="10" class="ntd-chip ntd-chip-green"/>
<text x="733" y="189.0" class="ntd-code" text-anchor="middle">LocalExecEnv + LocalSandbox</text>
<text x="733" y="211.0" class="ntd-mini" text-anchor="middle">Bash runs inside bwrap / Seatbelt</text>
<text x="733" y="231.0" class="ntd-mini" text-anchor="middle">when settings say sandbox.enabled</text>
<path d="M 530 198 C 560 198, 560 205.0, 588 205.0" class="ntd-line" marker-end="url(#guide2-execenvs-arrow)"/>
<rect x="590" y="290" width="286" height="100" rx="10" class="ntd-chip ntd-chip-cyan"/>
<text x="733" y="324.0" class="ntd-code" text-anchor="middle">ContainerExecEnv</text>
<text x="733" y="346.0" class="ntd-mini" text-anchor="middle">one docker exec per operation</text>
<text x="733" y="366.0" class="ntd-mini" text-anchor="middle">host code starts it: start_container</text>
<path d="M 530 198 C 560 198, 560 340.0, 588 340.0" class="ntd-line" marker-end="url(#guide2-execenvs-arrow)"/>
<text x="24" y="330" class="ntd-mini" text-anchor="start">A task&#x27;s own files go through it too: spilled outputs, plans,</text>
<text x="24" y="352" class="ntd-mini" text-anchor="start">memory, agent transcripts: they live where its tools do</text>
</svg>
