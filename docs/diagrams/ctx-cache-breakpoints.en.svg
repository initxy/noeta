<text x="450" y="264.5" class="ntd-mini" text-anchor="middle">Every byte before a mark is rebuilt from the log the same way on any worker: sorted tools,</text>
<text x="450" y="279.5" class="ntd-mini" text-anchor="middle">prompt overrides recorded at start, reminders and the environment recorded when first sent.</text>
<text x="450" y="294.5" class="ntd-mini" text-anchor="middle">Marks ask for the 5-minute cache; an Anthropic provider&#x27;s prompt_cache_ttl = &quot;1h&quot; asks for an hour.</text>
