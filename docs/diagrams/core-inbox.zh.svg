<text x="110.0" y="67.5" class="ntd-sub" text-anchor="middle">人（经客户端）</text>
<rect x="212" y="42" width="188" height="42" rx="8" class="ntd-chip"/>
<text x="306.0" y="67.5" class="ntd-code" text-anchor="middle">Say · Answer · Cancel</text>
