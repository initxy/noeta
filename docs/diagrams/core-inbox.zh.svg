<rect x="212" y="146" width="188" height="42" rx="8" class="ntd-chip"/>
<text x="306.0" y="171.5" class="ntd-code" text-anchor="middle">ChildEnded</text>
<path d="M 200 167 L 210 167" class="ntd-line"/>
<path d="M 400 167 L 424 167 L 424 172 L 446 172" class="ntd-line" marker-end="url(#core-inbox-arrow)"/>
<rect x="20" y="198" width="180" height="42" rx="8" class="ntd-chip ntd-chip-amber"/>
<text x="110.0" y="223.5" class="ntd-sub" text-anchor="middle">到点的定时器</text>
<rect x="212" y="198" width="188" height="42" rx="8" class="ntd-chip"/>
<text x="306.0" y="223.5" class="ntd-code" text-anchor="middle">TimerFired</text>
<path d="M 200 219 L 210 219" class="ntd-line"/>
<path d="M 400 219 L 424 219 L 424 172 L 446 172" class="ntd-line"/>
<rect x="20" y="250" width="180" height="42" rx="8" class="ntd-chip ntd-chip-amber"/>
<text x="110.0" y="275.5" class="ntd-sub" text-anchor="middle">插件、外部渠道、信号</text>
<rect x="212" y="250" width="188" height="42" rx="8" class="ntd-chip"/>
<text x="306.0" y="275.5" class="ntd-code" text-anchor="middle">External</text>
<path d="M 200 271 L 210 271" class="ntd-line"/>
<path d="M 400 271 L 424 271 L 424 172 L 446 172" class="ntd-line"/>
<rect x="448" y="42" width="170" height="250" rx="10" class="ntd-chip ntd-chip-violet"/>
<text x="533" y="68" class="ntd-title" text-anchor="middle">收件箱</text>
<text x="533" y="88" class="ntd-mini" text-anchor="middle">按顺序，每个任务一个</text>
<rect x="464" y="104" width="138" height="26" rx="6" class="ntd-chip"/>
<text x="478" y="122" class="ntd-code">#1</text>
<rect x="464" y="138" width="138" height="26" rx="6" class="ntd-chip"/>
<text x="478" y="156" class="ntd-code">#2</text>
<rect x="464" y="172" width="138" height="26" rx="6" class="ntd-chip"/>
<text x="478" y="190" class="ntd-code">#3</text>
<rect x="464" y="206" width="138" height="26" rx="6" class="ntd-chip"/>
<text x="478" y="224" class="ntd-code">#4</text>
<text x="590" y="224" class="ntd-mini" text-anchor="end">未读</text>
<rect x="464" y="240" width="138" height="26" rx="6" class="ntd-chip"/>
<text x="478" y="258" class="ntd-code">#5</text>
<text x="590" y="258" class="ntd-mini" text-anchor="end">未读</text>
<path d="M 618 172 L 660 172" class="ntd-line" marker-end="url(#core-inbox-arrow)"/>
<rect x="662" y="140" width="238" height="64" rx="10" class="ntd-chip ntd-chip-green"/>
<text x="781.0" y="166.5" class="ntd-chiptext" text-anchor="middle">持有认领的工人</text>
<text x="781.0" y="186.5" class="ntd-mini" text-anchor="middle">别人只能投递，不能取件</text>
<path d="M 781 204 L 781 236" class="ntd-line" marker-end="url(#core-inbox-arrow)"/>
<rect x="662" y="238" width="238" height="54" rx="10" class="ntd-chip ntd-chip-violet"/>
<text x="781.0" y="260.5" class="ntd-code" text-anchor="middle">InputTaken(items, through)</text>
<text x="781.0" y="278.5" class="ntd-mini" text-anchor="middle">任务日志</text>
<rect x="20" y="314" width="284" height="54" rx="10" class="ntd-box"/>
<text x="162" y="336" class="ntd-sub" text-anchor="middle">dedupe_key：重复投递</text>
<text x="162" y="356" class="ntd-mini" text-anchor="middle">返回第一次的序号</text>
<rect x="316" y="314" width="284" height="54" rx="10" class="ntd-box"/>
<text x="458" y="336" class="ntd-sub" text-anchor="middle">投递会唤醒等待中的任务</text>
<text x="458" y="356" class="ntd-mini" text-anchor="middle">（wake=False 时不唤醒）</text>
<rect x="612" y="314" width="284" height="54" rx="10" class="ntd-box"/>
<text x="754" y="336" class="ntd-sub" text-anchor="middle">每一项恰好被取一次</text>
<text x="754" y="356" class="ntd-mini" text-anchor="middle">Cancel 还会打断正在进行的这一步</text>
</svg>
