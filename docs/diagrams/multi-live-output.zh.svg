<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-label="实时文字走 Postgres 通知，尽力送达、不存；记下的事件随事务提交通知，谁都能读到"><style data-ntd>svg{--ntd-bg:#ffffff;--ntd-panel:#f6f6f7;--ntd-border:#c2c2c4;--ntd-text1:#3c3c43;--ntd-text2:#67676c;--ntd-text3:#929295;--ntd-brand:#059669;--ntd-green:#10b981;--ntd-violet:#8b5cf6;--ntd-amber:#f59e0b;--ntd-cyan:#0891b2;--ntd-red:#e11d48;--ntd-green-soft:rgba(16,185,129,.14);--ntd-violet-soft:rgba(139,92,246,.13);--ntd-amber-soft:rgba(245,158,11,.14);--ntd-cyan-soft:rgba(8,145,178,.12);--ntd-red-soft:rgba(225,29,72,.10);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif}@media (prefers-color-scheme:dark){svg{--ntd-bg:#1b1b1f;--ntd-panel:#202127;--ntd-border:#3c3f44;--ntd-text1:#dfdfd6;--ntd-text2:#98989f;--ntd-text3:#6a6a71;--ntd-brand:#34d399;--ntd-green:#10b981;--ntd-violet:#a78bfa;--ntd-amber:#fbbf24;--ntd-cyan:#22d3ee;--ntd-red:#fb7185;--ntd-green-soft:rgba(16,185,129,.18);--ntd-violet-soft:rgba(139,92,246,.20);--ntd-amber-soft:rgba(245,158,11,.18);--ntd-cyan-soft:rgba(34,211,238,.14);--ntd-red-soft:rgba(251,113,133,.14)}}.ntd-bg{fill:var(--ntd-panel)}.ntd-box{fill:var(--ntd-bg);stroke:var(--ntd-border);stroke-width:1.2}.ntd-frame{fill:none;stroke:var(--ntd-green);stroke-width:1.4;stroke-dasharray:6 5}.ntd-dash{stroke-dasharray:5 4}.ntd-chip{fill:var(--ntd-bg);stroke:var(--ntd-border);stroke-width:1.2}.ntd-chip-green{fill:var(--ntd-green-soft);stroke:var(--ntd-green)}.ntd-chip-violet{fill:var(--ntd-violet-soft);stroke:var(--ntd-violet)}.ntd-chip-amber{fill:var(--ntd-amber-soft);stroke:var(--ntd-amber)}.ntd-chip-cyan{fill:var(--ntd-cyan-soft);stroke:var(--ntd-cyan)}.ntd-chip-red{fill:var(--ntd-red-soft);stroke:var(--ntd-red)}.ntd-title{fill:var(--ntd-text1);font-size:15px;font-weight:600}.ntd-label{fill:var(--ntd-brand);font-size:13px;font-weight:600}.ntd-sub{fill:var(--ntd-text2);font-size:12.5px}.ntd-mini{fill:var(--ntd-text2);font-size:11.5px}.ntd-strong{fill:var(--ntd-text1);font-weight:600}.ntd-em{font-style:italic}.ntd-chiptext{fill:var(--ntd-text1);font-size:13px;font-weight:500}.ntd-code{fill:var(--ntd-brand);font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.ntd-red{fill:var(--ntd-red)}.ntd-line{stroke:var(--ntd-text3);stroke-width:1.4;fill:none}.ntd-dashed{stroke-dasharray:5 4}.ntd-line-green{stroke:var(--ntd-green);stroke-width:1.6;fill:none}.ntd-line-violet{stroke:var(--ntd-violet);stroke-width:1.6;fill:none}.ntd-line-amber{stroke:var(--ntd-amber);stroke-width:1.8;fill:none}.ntd-line-red{stroke:var(--ntd-red);stroke-width:1.6;fill:none}.ntd-arrowhead{fill:var(--ntd-text3)}.ntd-arrowhead-green{fill:var(--ntd-green)}.ntd-arrowhead-violet{fill:var(--ntd-violet)}.ntd-arrowhead-amber{fill:var(--ntd-amber)}.ntd-arrowhead-red{fill:var(--ntd-red)}</style>
<defs><marker id="multi-live-output-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead"/></marker></defs>
<text x="24" y="70" class="ntd-label">实时文字</text>
<text x="24" y="86" class="ntd-mini">尽力送达，不存</text>
<text x="24" y="182" class="ntd-label">记下的事件</text>
<text x="24" y="198" class="ntd-mini">持久，所有人可见</text>
<rect x="150" y="40" width="180" height="70" rx="10" class="ntd-chip ntd-chip-green"/>
<text x="240" y="64" class="ntd-chiptext" text-anchor="middle">工人 A</text>
<text x="240" y="82" class="ntd-mini" text-anchor="middle">模型流式输出</text>
<text x="240" y="97" class="ntd-mini" text-anchor="middle">on_delta → publish_deltas</text>
<rect x="350" y="40" width="170" height="70" rx="10" class="ntd-chip ntd-chip-violet ntd-dash"/>
<text x="435" y="64" class="ntd-chiptext" text-anchor="middle">pg_notify</text>
<text x="435" y="82" class="ntd-mini" text-anchor="middle">&lt;schema&gt;_deltas</text>
<text x="435" y="97" class="ntd-mini" text-anchor="middle">每条 ≤ 7,000 字节</text>
<rect x="150" y="152" width="180" height="70" rx="10" class="ntd-chip ntd-chip-green"/>
<text x="240" y="176" class="ntd-chiptext" text-anchor="middle">工人 A</text>
<text x="240" y="194" class="ntd-mini" text-anchor="middle">append：事件行</text>
<text x="240" y="209" class="ntd-mini" text-anchor="middle">+ pg_notify，同一个事务</text>
<rect x="350" y="152" width="170" height="70" rx="10" class="ntd-chip ntd-chip-violet"/>
<text x="435" y="176" class="ntd-chiptext" text-anchor="middle">pg_notify</text>
<text x="435" y="194" class="ntd-mini" text-anchor="middle">&lt;schema&gt;_changes</text>
<text x="435" y="209" class="ntd-mini" text-anchor="middle">提交了才有通知</text>
<rect x="560" y="84" width="170" height="94" rx="10" class="ntd-chip ntd-chip-green"/>
<text x="645" y="112.5" class="ntd-chiptext" text-anchor="middle">noeta serve</text>
<text x="645" y="130.5" class="ntd-mini" text-anchor="middle">任何一台机器上</text>
<text x="645" y="145.5" class="ntd-mini" text-anchor="middle">LISTEN 两个频道</text>
<text x="645" y="160.5" class="ntd-mini" text-anchor="middle">on_delta · on_change</text>
<rect x="760" y="84" width="120" height="94" rx="10" class="ntd-chip ntd-chip-amber"/>
<text x="820" y="112.5" class="ntd-chiptext" text-anchor="middle">前端</text>
<text x="820" y="130.5" class="ntd-mini" text-anchor="middle">/watch 的</text>
<text x="820" y="145.5" class="ntd-mini" text-anchor="middle">事件流（SSE）</text>
<text x="820" y="160.5" class="ntd-mini" text-anchor="middle">边写边看到文字</text>
<path d="M 330 75 L 348 75" class="ntd-line ntd-dashed" marker-end="url(#multi-live-output-arrow)"/>
<path d="M 330 187 L 348 187" class="ntd-line" marker-end="url(#multi-live-output-arrow)"/>
<path d="M 520 75 L 540 75 L 540 112 L 558 112" class="ntd-line ntd-dashed" marker-end="url(#multi-live-output-arrow)"/>
<path d="M 520 187 L 540 187 L 540 150 L 558 150" class="ntd-line" marker-end="url(#multi-live-output-arrow)"/>
<path d="M 730 131 L 758 131" class="ntd-line" marker-end="url(#multi-live-output-arrow)"/>
<text x="450" y="268" class="ntd-mini" text-anchor="middle">监听连接断开重连期间的通知会丢：运行器每隔三分之一个租约看一眼自己任务的收件箱，补上这个空档。</text>
<text x="450" y="286" class="ntd-mini" text-anchor="middle">sqlite 上实时文字只留在跑任务的进程里。</text>
</svg>
