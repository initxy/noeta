<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="Plugins are found by name, set into agents by the settings, and pinned in the task&#x27;s log"><style data-ntd>svg{--ntd-bg:#ffffff;--ntd-panel:#f6f6f7;--ntd-border:#c2c2c4;--ntd-text1:#3c3c43;--ntd-text2:#67676c;--ntd-text3:#929295;--ntd-brand:#059669;--ntd-green:#10b981;--ntd-violet:#8b5cf6;--ntd-amber:#f59e0b;--ntd-cyan:#0891b2;--ntd-red:#e11d48;--ntd-green-soft:rgba(16,185,129,.14);--ntd-violet-soft:rgba(139,92,246,.13);--ntd-amber-soft:rgba(245,158,11,.14);--ntd-cyan-soft:rgba(8,145,178,.12);--ntd-red-soft:rgba(225,29,72,.10);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif}@media (prefers-color-scheme:dark){svg{--ntd-bg:#1b1b1f;--ntd-panel:#202127;--ntd-border:#3c3f44;--ntd-text1:#dfdfd6;--ntd-text2:#98989f;--ntd-text3:#6a6a71;--ntd-brand:#34d399;--ntd-green:#10b981;--ntd-violet:#a78bfa;--ntd-amber:#fbbf24;--ntd-cyan:#22d3ee;--ntd-red:#fb7185;--ntd-green-soft:rgba(16,185,129,.18);--ntd-violet-soft:rgba(139,92,246,.20);--ntd-amber-soft:rgba(245,158,11,.18);--ntd-cyan-soft:rgba(34,211,238,.14);--ntd-red-soft:rgba(251,113,133,.14)}}.ntd-bg{fill:var(--ntd-panel)}.ntd-box{fill:var(--ntd-bg);stroke:var(--ntd-border);stroke-width:1.2}.ntd-frame{fill:none;stroke:var(--ntd-green);stroke-width:1.4;stroke-dasharray:6 5}.ntd-dash{stroke-dasharray:5 4}.ntd-chip{fill:var(--ntd-bg);stroke:var(--ntd-border);stroke-width:1.2}.ntd-chip-green{fill:var(--ntd-green-soft);stroke:var(--ntd-green)}.ntd-chip-violet{fill:var(--ntd-violet-soft);stroke:var(--ntd-violet)}.ntd-chip-amber{fill:var(--ntd-amber-soft);stroke:var(--ntd-amber)}.ntd-chip-cyan{fill:var(--ntd-cyan-soft);stroke:var(--ntd-cyan)}.ntd-chip-red{fill:var(--ntd-red-soft);stroke:var(--ntd-red)}.ntd-title{fill:var(--ntd-text1);font-size:15px;font-weight:600}.ntd-label{fill:var(--ntd-brand);font-size:13px;font-weight:600}.ntd-sub{fill:var(--ntd-text2);font-size:12.5px}.ntd-mini{fill:var(--ntd-text2);font-size:11.5px}.ntd-strong{fill:var(--ntd-text1);font-weight:600}.ntd-em{font-style:italic}.ntd-chiptext{fill:var(--ntd-text1);font-size:13px;font-weight:500}.ntd-code{fill:var(--ntd-brand);font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.ntd-red{fill:var(--ntd-red)}.ntd-line{stroke:var(--ntd-text3);stroke-width:1.4;fill:none}.ntd-dashed{stroke-dasharray:5 4}.ntd-line-green{stroke:var(--ntd-green);stroke-width:1.6;fill:none}.ntd-line-violet{stroke:var(--ntd-violet);stroke-width:1.6;fill:none}.ntd-line-amber{stroke:var(--ntd-amber);stroke-width:1.8;fill:none}.ntd-line-red{stroke:var(--ntd-red);stroke-width:1.6;fill:none}.ntd-arrowhead{fill:var(--ntd-text3)}.ntd-arrowhead-green{fill:var(--ntd-green)}.ntd-arrowhead-violet{fill:var(--ntd-violet)}.ntd-arrowhead-amber{fill:var(--ntd-amber)}.ntd-arrowhead-red{fill:var(--ntd-red)}</style>
<defs><marker id="plug-registry-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead"/></marker><marker id="plug-registry-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead-red"/></marker></defs>
<rect x="30" y="40" width="240" height="84" rx="10" class="ntd-chip ntd-chip-green"/>
<text x="150" y="71" class="ntd-chiptext" text-anchor="middle">Installed packages</text>
<text x="150" y="89" class="ntd-mini" text-anchor="middle">entry points: noeta.plugins</text>
<text x="150" y="104" class="ntd-mini" text-anchor="middle">(the built-ins too: pyproject.toml)</text>
<rect x="30" y="144" width="240" height="84" rx="10" class="ntd-chip ntd-chip-green ntd-dash"/>
<text x="150" y="175" class="ntd-chiptext" text-anchor="middle">Plugin files</text>
<text x="150" y="193" class="ntd-mini" text-anchor="middle">~/.noeta/plugins, a trusted</text>
<text x="150" y="208" class="ntd-mini" text-anchor="middle">project&#x27;s .noeta/plugins, --plugin-dir</text>
<rect x="30" y="248" width="240" height="84" rx="10" class="ntd-chip ntd-dash"/>
<text x="150" y="279" class="ntd-chiptext" text-anchor="middle">Claude Code plugin dirs</text>
<text x="150" y="297" class="ntd-mini" text-anchor="middle">skills, agents, commands, hooks,</text>
<text x="150" y="312" class="ntd-mini" text-anchor="middle">.mcp.json: read by built-in plugins</text>
<rect x="310" y="142" width="170" height="76" rx="10" class="ntd-chip ntd-chip-green"/>
<text x="395" y="169" class="ntd-chiptext" text-anchor="middle">registry</text>
<text x="395" y="187" class="ntd-mini" text-anchor="middle">a name → an Extension class</text>
<text x="395" y="202" class="ntd-mini" text-anchor="middle">an installed one wins a clash</text>
<path d="M 270 82 L 290 82 L 290 180 L 308 180" class="ntd-line" marker-end="url(#plug-registry-arrow)"/>
<path d="M 270 186 L 290 186 L 290 180 L 308 180" class="ntd-line" marker-end="url(#plug-registry-arrow)"/>
<path d="M 270 290 L 290 290 L 290 180" class="ntd-line ntd-dashed"/>
<rect x="510" y="20" width="176" height="104" rx="10" class="ntd-chip ntd-chip-amber"/>
<text x="598" y="46" class="ntd-chiptext" text-anchor="middle">Plugin settings</text>
<text x="598" y="64" class="ntd-mini" text-anchor="middle">[plugins.&lt;name&gt;],</text>
<text x="598" y="79" class="ntd-mini" text-anchor="middle">agent files&#x27; plugins:,</text>
<text x="598" y="94" class="ntd-mini" text-anchor="middle">add_plugins,</text>
<text x="598" y="109" class="ntd-mini" text-anchor="middle">/etc/noeta [policy]</text>
<rect x="510" y="150" width="176" height="70" rx="10" class="ntd-chip ntd-chip-green"/>
<text x="598" y="174" class="ntd-chiptext" text-anchor="middle">Agent</text>
<text x="598" y="192" class="ntd-mini" text-anchor="middle">its extensions, in order</text>
<text x="598" y="207" class="ntd-mini" text-anchor="middle">one per name + arguments</text>
<path d="M 480 180 L 508 180" class="ntd-line" marker-end="url(#plug-registry-arrow)"/>
<path d="M 598 124 L 598 148" class="ntd-line" marker-end="url(#plug-registry-arrow)"/>
<rect x="712" y="140" width="176" height="86" rx="10" class="ntd-chip ntd-chip-violet"/>
<text x="800" y="164.5" class="ntd-chiptext" text-anchor="middle">The task&#x27;s log</text>
<text x="800" y="182.5" class="ntd-mini" text-anchor="middle">records.Plugins:</text>
<text x="800" y="197.5" class="ntd-mini" text-anchor="middle">name, source, version</text>
<text x="800" y="212.5" class="ntd-mini" text-anchor="middle">or file hash, args hash</text>
<path d="M 686 185 L 710 185" class="ntd-line" marker-end="url(#plug-registry-arrow)"/>
<text x="800" y="128" class="ntd-mini" text-anchor="middle">pinned at start</text>
<rect x="560" y="290" width="320" height="64" rx="10" class="ntd-chip ntd-chip-red ntd-dash"/>
<text x="720" y="311" class="ntd-chiptext" text-anchor="middle">A worker missing one</text>
<text x="720" y="329" class="ntd-mini" text-anchor="middle">never runs it: lets the lease lapse;</text>
<text x="720" y="344" class="ntd-mini" text-anchor="middle">3 claims in a row: plugin_missing</text>
<path d="M 800 226 L 800 288" class="ntd-line-red ntd-dashed" marker-end="url(#plug-registry-arrow-red)"/>
<text x="792" y="262" class="ntd-mini" text-anchor="end">checked at each pickup</text>
</svg>
