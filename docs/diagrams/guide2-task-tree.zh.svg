<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-label="任务树：主任务派出的每个子代理都是一个子任务，有自己的日志和收件箱"><style data-ntd>svg{--ntd-bg:#ffffff;--ntd-panel:#f6f6f7;--ntd-border:#c2c2c4;--ntd-text1:#3c3c43;--ntd-text2:#67676c;--ntd-text3:#929295;--ntd-brand:#059669;--ntd-green:#10b981;--ntd-violet:#8b5cf6;--ntd-amber:#f59e0b;--ntd-cyan:#0891b2;--ntd-red:#e11d48;--ntd-green-soft:rgba(16,185,129,.14);--ntd-violet-soft:rgba(139,92,246,.13);--ntd-amber-soft:rgba(245,158,11,.14);--ntd-cyan-soft:rgba(8,145,178,.12);--ntd-red-soft:rgba(225,29,72,.10);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif}@media (prefers-color-scheme:dark){svg{--ntd-bg:#1b1b1f;--ntd-panel:#202127;--ntd-border:#3c3f44;--ntd-text1:#dfdfd6;--ntd-text2:#98989f;--ntd-text3:#6a6a71;--ntd-brand:#34d399;--ntd-green:#10b981;--ntd-violet:#a78bfa;--ntd-amber:#fbbf24;--ntd-cyan:#22d3ee;--ntd-red:#fb7185;--ntd-green-soft:rgba(16,185,129,.18);--ntd-violet-soft:rgba(139,92,246,.20);--ntd-amber-soft:rgba(245,158,11,.18);--ntd-cyan-soft:rgba(34,211,238,.14);--ntd-red-soft:rgba(251,113,133,.14)}}.ntd-bg{fill:var(--ntd-panel)}.ntd-box{fill:var(--ntd-bg);stroke:var(--ntd-border);stroke-width:1.2}.ntd-frame{fill:none;stroke:var(--ntd-green);stroke-width:1.4;stroke-dasharray:6 5}.ntd-dash{stroke-dasharray:5 4}.ntd-chip{fill:var(--ntd-bg);stroke:var(--ntd-border);stroke-width:1.2}.ntd-chip-green{fill:var(--ntd-green-soft);stroke:var(--ntd-green)}.ntd-chip-violet{fill:var(--ntd-violet-soft);stroke:var(--ntd-violet)}.ntd-chip-amber{fill:var(--ntd-amber-soft);stroke:var(--ntd-amber)}.ntd-chip-cyan{fill:var(--ntd-cyan-soft);stroke:var(--ntd-cyan)}.ntd-chip-red{fill:var(--ntd-red-soft);stroke:var(--ntd-red)}.ntd-title{fill:var(--ntd-text1);font-size:15px;font-weight:600}.ntd-label{fill:var(--ntd-brand);font-size:13px;font-weight:600}.ntd-sub{fill:var(--ntd-text2);font-size:12.5px}.ntd-mini{fill:var(--ntd-text2);font-size:11.5px}.ntd-strong{fill:var(--ntd-text1);font-weight:600}.ntd-em{font-style:italic}.ntd-chiptext{fill:var(--ntd-text1);font-size:13px;font-weight:500}.ntd-code{fill:var(--ntd-brand);font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.ntd-red{fill:var(--ntd-red)}.ntd-line{stroke:var(--ntd-text3);stroke-width:1.4;fill:none}.ntd-dashed{stroke-dasharray:5 4}.ntd-line-green{stroke:var(--ntd-green);stroke-width:1.6;fill:none}.ntd-line-violet{stroke:var(--ntd-violet);stroke-width:1.6;fill:none}.ntd-line-amber{stroke:var(--ntd-amber);stroke-width:1.8;fill:none}.ntd-line-red{stroke:var(--ntd-red);stroke-width:1.6;fill:none}.ntd-arrowhead{fill:var(--ntd-text3)}.ntd-arrowhead-green{fill:var(--ntd-green)}.ntd-arrowhead-violet{fill:var(--ntd-violet)}.ntd-arrowhead-amber{fill:var(--ntd-amber)}.ntd-arrowhead-red{fill:var(--ntd-red)}</style>
<defs><marker id="guide2-task-tree-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead"/></marker><marker id="guide2-task-tree-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead-green"/></marker><marker id="guide2-task-tree-arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead-violet"/></marker><marker id="guide2-task-tree-arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead-amber"/></marker><marker id="guide2-task-tree-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead-red"/></marker></defs>
<rect x="330" y="24" width="240" height="70" rx="10" class="ntd-chip ntd-chip-green"/>
<text x="450" y="52" class="ntd-title" text-anchor="middle">main</text>
<text x="450" y="74" class="ntd-code" text-anchor="middle">t1 · root_id t1</text>
<path d="M 450 94 V 128" class="ntd-line"/>
<path d="M 122 128 H 770" class="ntd-line"/>
<path d="M 122 128 V 168" class="ntd-line" marker-end="url(#guide2-task-tree-arrow)"/>
<text x="128" y="154" class="ntd-mini" text-anchor="start">Agent</text>
<path d="M 338 128 V 168" class="ntd-line" marker-end="url(#guide2-task-tree-arrow)"/>
<text x="344" y="154" class="ntd-mini" text-anchor="start">SendMessage</text>
<path d="M 554 128 V 168" class="ntd-line" marker-end="url(#guide2-task-tree-arrow)"/>
<text x="560" y="154" class="ntd-mini" text-anchor="start">Agent</text>
<path d="M 770 128 V 168" class="ntd-line" marker-end="url(#guide2-task-tree-arrow)"/>
<text x="776" y="154" class="ntd-mini" text-anchor="start">Workflow</text>
<rect x="24" y="170" width="196" height="90" rx="10" class="ntd-chip"/>
<text x="122" y="198" class="ntd-title" text-anchor="middle">Explore</text>
<text x="122" y="220" class="ntd-code" text-anchor="middle">t1.toolu_a.1</text>
<text x="122" y="242" class="ntd-mini" text-anchor="middle">已结束</text>
<rect x="240" y="170" width="196" height="90" rx="10" class="ntd-chip ntd-chip-green ntd-dash"/>
<text x="338" y="198" class="ntd-title" text-anchor="middle">Explore（接着做）</text>
<text x="338" y="220" class="ntd-code" text-anchor="middle">history_from t1.toolu_a.1</text>
<text x="338" y="242" class="ntd-mini" text-anchor="middle">沿用同一个 agent id</text>
<rect x="456" y="170" width="196" height="90" rx="10" class="ntd-chip ntd-chip-green"/>
<text x="554" y="198" class="ntd-title" text-anchor="middle">general-purpose</text>
<text x="554" y="220" class="ntd-code" text-anchor="middle">t1.toolu_b.1</text>
<text x="554" y="242" class="ntd-mini" text-anchor="middle">自己也能派子代理</text>
<rect x="672" y="170" width="204" height="90" rx="10" class="ntd-chip ntd-chip-green"/>
<text x="774" y="198" class="ntd-title" text-anchor="middle">general-purpose</text>
<text x="774" y="220" class="ntd-code" text-anchor="middle">t1.wf_x7k2p9-1</text>
<text x="774" y="242" class="ntd-mini" text-anchor="middle">Workflow 脚本里的 agent()</text>
<path d="M 554 260 V 318" class="ntd-line" marker-end="url(#guide2-task-tree-arrow)"/>
<text x="560" y="294" class="ntd-mini" text-anchor="start">Agent</text>
<rect x="456" y="320" width="196" height="76" rx="10" class="ntd-chip ntd-chip-green"/>
<text x="554" y="346" class="ntd-title" text-anchor="middle">Explore</text>
<text x="554" y="368" class="ntd-code" text-anchor="middle">t1.toolu_b.1.toolu_d.1</text>
<text x="554" y="386" class="ntd-mini" text-anchor="middle">第 2 层</text>
<text x="24" y="338" class="ntd-mini" text-anchor="start">每个方框都是一个任务：自己的日志、收件箱和 tasks 表里的一行</text>
<text x="24" y="362" class="ntd-mini" text-anchor="start">子任务结束 → 给父任务的收件箱投一条 ChildEnded</text>
<text x="24" y="386" class="ntd-mini" text-anchor="start">父任务结束 → 给每个还在跑的子任务投 Cancel</text>
<text x="672" y="346" class="ntd-mini" text-anchor="start">max_depth 3：第 3 层不能再派</text>
<text x="672" y="370" class="ntd-mini" text-anchor="start">每个任务同时最多 20 个在跑</text>
<rect x="16" y="416" width="868" height="40" rx="10" class="ntd-chip ntd-chip-violet ntd-dash"/>
<text x="450" y="441" class="ntd-sub" text-anchor="middle">全部在同一个存储里：任何工人都能接着跑树上的任何一个任务</text>
</svg>
