<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-label="接手的工人怎么处理崩溃留下的半截工作：模型调用重新发一次；已开始的工具调用先查结果，安全的就重跑，否则答复“结果未知”"><style data-ntd>svg{--ntd-bg:#ffffff;--ntd-panel:#f6f6f7;--ntd-border:#c2c2c4;--ntd-text1:#3c3c43;--ntd-text2:#67676c;--ntd-text3:#929295;--ntd-brand:#059669;--ntd-green:#10b981;--ntd-violet:#8b5cf6;--ntd-amber:#f59e0b;--ntd-cyan:#0891b2;--ntd-red:#e11d48;--ntd-green-soft:rgba(16,185,129,.14);--ntd-violet-soft:rgba(139,92,246,.13);--ntd-amber-soft:rgba(245,158,11,.14);--ntd-cyan-soft:rgba(8,145,178,.12);--ntd-red-soft:rgba(225,29,72,.10);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif}@media (prefers-color-scheme:dark){svg{--ntd-bg:#1b1b1f;--ntd-panel:#202127;--ntd-border:#3c3f44;--ntd-text1:#dfdfd6;--ntd-text2:#98989f;--ntd-text3:#6a6a71;--ntd-brand:#34d399;--ntd-green:#10b981;--ntd-violet:#a78bfa;--ntd-amber:#fbbf24;--ntd-cyan:#22d3ee;--ntd-red:#fb7185;--ntd-green-soft:rgba(16,185,129,.18);--ntd-violet-soft:rgba(139,92,246,.20);--ntd-amber-soft:rgba(245,158,11,.18);--ntd-cyan-soft:rgba(34,211,238,.14);--ntd-red-soft:rgba(251,113,133,.14)}}.ntd-bg{fill:var(--ntd-panel)}.ntd-box{fill:var(--ntd-bg);stroke:var(--ntd-border);stroke-width:1.2}.ntd-frame{fill:none;stroke:var(--ntd-green);stroke-width:1.4;stroke-dasharray:6 5}.ntd-dash{stroke-dasharray:5 4}.ntd-chip{fill:var(--ntd-bg);stroke:var(--ntd-border);stroke-width:1.2}.ntd-chip-green{fill:var(--ntd-green-soft);stroke:var(--ntd-green)}.ntd-chip-violet{fill:var(--ntd-violet-soft);stroke:var(--ntd-violet)}.ntd-chip-amber{fill:var(--ntd-amber-soft);stroke:var(--ntd-amber)}.ntd-chip-cyan{fill:var(--ntd-cyan-soft);stroke:var(--ntd-cyan)}.ntd-chip-red{fill:var(--ntd-red-soft);stroke:var(--ntd-red)}.ntd-title{fill:var(--ntd-text1);font-size:15px;font-weight:600}.ntd-label{fill:var(--ntd-brand);font-size:13px;font-weight:600}.ntd-sub{fill:var(--ntd-text2);font-size:12.5px}.ntd-mini{fill:var(--ntd-text2);font-size:11.5px}.ntd-strong{fill:var(--ntd-text1);font-weight:600}.ntd-em{font-style:italic}.ntd-chiptext{fill:var(--ntd-text1);font-size:13px;font-weight:500}.ntd-code{fill:var(--ntd-brand);font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.ntd-red{fill:var(--ntd-red)}.ntd-line{stroke:var(--ntd-text3);stroke-width:1.4;fill:none}.ntd-dashed{stroke-dasharray:5 4}.ntd-line-green{stroke:var(--ntd-green);stroke-width:1.6;fill:none}.ntd-line-violet{stroke:var(--ntd-violet);stroke-width:1.6;fill:none}.ntd-line-amber{stroke:var(--ntd-amber);stroke-width:1.8;fill:none}.ntd-line-red{stroke:var(--ntd-red);stroke-width:1.6;fill:none}.ntd-arrowhead{fill:var(--ntd-text3)}.ntd-arrowhead-green{fill:var(--ntd-green)}.ntd-arrowhead-violet{fill:var(--ntd-violet)}.ntd-arrowhead-amber{fill:var(--ntd-amber)}.ntd-arrowhead-red{fill:var(--ntd-red)}</style>
<defs><marker id="core-tool-recovery-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead"/></marker><marker id="core-tool-recovery-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead-green"/></marker><marker id="core-tool-recovery-arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead-violet"/></marker><marker id="core-tool-recovery-arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead-amber"/></marker><marker id="core-tool-recovery-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead-red"/></marker></defs>
<text x="20" y="28" class="ntd-label">接手的工人折叠日志后发现</text>
<rect x="20" y="44" width="270" height="44" rx="8" class="ntd-chip ntd-chip-cyan"/>
<text x="155.0" y="70.5" class="ntd-code" text-anchor="middle">有 ModelCalled，没有 ModelReplied</text>
<path d="M 290 66 L 318 66" class="ntd-line" marker-end="url(#core-tool-recovery-arrow)"/>
<rect x="320" y="40" width="270" height="52" rx="10" class="ntd-chip ntd-chip-green"/>
<text x="455.0" y="61.5" class="ntd-chiptext" text-anchor="middle">再调用一次模型</text>
<text x="455.0" y="79.5" class="ntd-mini" text-anchor="middle">请求从日志重新组装</text>
<path d="M 590 66 L 618 66" class="ntd-line" marker-end="url(#core-tool-recovery-arrow)"/>
<rect x="620" y="40" width="284" height="52" rx="10" class="ntd-chip ntd-chip-red"/>
<text x="762.0" y="61.5" class="ntd-chiptext" text-anchor="middle">连续 3 次都没等到回复</text>
<text x="762.0" y="79.5" class="ntd-code" text-anchor="middle">本轮失败：llm_error</text>
<rect x="20" y="130" width="270" height="44" rx="8" class="ntd-chip ntd-chip-green"/>
<text x="155.0" y="156.5" class="ntd-code" text-anchor="middle">有 ToolStarted，没有 ToolFinished</text>
<path d="M 290 152 L 318 152" class="ntd-line" marker-end="url(#core-tool-recovery-arrow)"/>
<rect x="320" y="126" width="270" height="52" rx="10" class="ntd-chip"/>
<text x="455.0" y="147.5" class="ntd-chiptext" text-anchor="middle">Tool.recover 查到了结果？</text>
<text x="455.0" y="165.5" class="ntd-mini" text-anchor="middle">按 ctx.idempotency_key 去查</text>
<path d="M 590 152 L 618 152" class="ntd-line" marker-end="url(#core-tool-recovery-arrow)"/>
<text x="604" y="144" class="ntd-mini" text-anchor="middle">是</text>
<rect x="620" y="130" width="284" height="44" rx="8" class="ntd-chip ntd-chip-green"/>
<text x="762.0" y="156.5" class="ntd-sub" text-anchor="middle">记下这个结果</text>
<path d="M 455 178 L 455 210" class="ntd-line" marker-end="url(#core-tool-recovery-arrow)"/>
<text x="465" y="198" class="ntd-mini">否</text>
<rect x="320" y="212" width="270" height="52" rx="10" class="ntd-chip"/>
<text x="455.0" y="233.5" class="ntd-chiptext" text-anchor="middle">retry_safe，且启动不到 3 次？</text>
<text x="455.0" y="251.5" class="ntd-mini" text-anchor="middle">Read、WebFetch、ToolSearch……</text>
<path d="M 590 238 L 618 238" class="ntd-line" marker-end="url(#core-tool-recovery-arrow)"/>
<text x="604" y="230" class="ntd-mini" text-anchor="middle">是</text>
<rect x="620" y="216" width="284" height="44" rx="8" class="ntd-chip ntd-chip-green"/>
<text x="762.0" y="242.5" class="ntd-sub" text-anchor="middle">再写 ToolStarted，重跑一次</text>
<path d="M 455 264 L 455 296" class="ntd-line" marker-end="url(#core-tool-recovery-arrow)"/>
<text x="465" y="284" class="ntd-mini">否</text>
<rect x="320" y="298" width="584" height="52" rx="10" class="ntd-chip ntd-chip-amber"/>
<text x="612.0" y="319.5" class="ntd-chiptext" text-anchor="middle">“结果未知”的结果</text>
<text x="612.0" y="337.5" class="ntd-mini" text-anchor="middle">让模型自己去核实效果</text>
<text x="20" y="386" class="ntd-sub">• 不再过关卡：它当初运行时已经放行过</text>
<text x="20" y="408" class="ntd-sub">• 停下来等答复的调用不算半截：它还在等</text>
<text x="155" y="200" class="ntd-mini" text-anchor="middle"></text>
</svg>
