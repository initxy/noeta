<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="The log keeps every event; after a compaction the fold keeps only the summary and what follows it"><style data-ntd>svg{--ntd-bg:#ffffff;--ntd-panel:#f6f6f7;--ntd-border:#c2c2c4;--ntd-text1:#3c3c43;--ntd-text2:#67676c;--ntd-text3:#929295;--ntd-brand:#059669;--ntd-green:#10b981;--ntd-violet:#8b5cf6;--ntd-amber:#f59e0b;--ntd-cyan:#0891b2;--ntd-red:#e11d48;--ntd-green-soft:rgba(16,185,129,.14);--ntd-violet-soft:rgba(139,92,246,.13);--ntd-amber-soft:rgba(245,158,11,.14);--ntd-cyan-soft:rgba(8,145,178,.12);--ntd-red-soft:rgba(225,29,72,.10);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif}@media (prefers-color-scheme:dark){svg{--ntd-bg:#1b1b1f;--ntd-panel:#202127;--ntd-border:#3c3f44;--ntd-text1:#dfdfd6;--ntd-text2:#98989f;--ntd-text3:#6a6a71;--ntd-brand:#34d399;--ntd-green:#10b981;--ntd-violet:#a78bfa;--ntd-amber:#fbbf24;--ntd-cyan:#22d3ee;--ntd-red:#fb7185;--ntd-green-soft:rgba(16,185,129,.18);--ntd-violet-soft:rgba(139,92,246,.20);--ntd-amber-soft:rgba(245,158,11,.18);--ntd-cyan-soft:rgba(34,211,238,.14);--ntd-red-soft:rgba(251,113,133,.14)}}.ntd-bg{fill:var(--ntd-panel)}.ntd-box{fill:var(--ntd-bg);stroke:var(--ntd-border);stroke-width:1.2}.ntd-frame{fill:none;stroke:var(--ntd-green);stroke-width:1.4;stroke-dasharray:6 5}.ntd-dash{stroke-dasharray:5 4}.ntd-chip{fill:var(--ntd-bg);stroke:var(--ntd-border);stroke-width:1.2}.ntd-chip-green{fill:var(--ntd-green-soft);stroke:var(--ntd-green)}.ntd-chip-violet{fill:var(--ntd-violet-soft);stroke:var(--ntd-violet)}.ntd-chip-amber{fill:var(--ntd-amber-soft);stroke:var(--ntd-amber)}.ntd-chip-cyan{fill:var(--ntd-cyan-soft);stroke:var(--ntd-cyan)}.ntd-chip-red{fill:var(--ntd-red-soft);stroke:var(--ntd-red)}.ntd-title{fill:var(--ntd-text1);font-size:15px;font-weight:600}.ntd-label{fill:var(--ntd-brand);font-size:13px;font-weight:600}.ntd-sub{fill:var(--ntd-text2);font-size:12.5px}.ntd-mini{fill:var(--ntd-text2);font-size:11.5px}.ntd-strong{fill:var(--ntd-text1);font-weight:600}.ntd-em{font-style:italic}.ntd-chiptext{fill:var(--ntd-text1);font-size:13px;font-weight:500}.ntd-code{fill:var(--ntd-brand);font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.ntd-red{fill:var(--ntd-red)}.ntd-line{stroke:var(--ntd-text3);stroke-width:1.4;fill:none}.ntd-dashed{stroke-dasharray:5 4}.ntd-line-green{stroke:var(--ntd-green);stroke-width:1.6;fill:none}.ntd-line-violet{stroke:var(--ntd-violet);stroke-width:1.6;fill:none}.ntd-line-amber{stroke:var(--ntd-amber);stroke-width:1.8;fill:none}.ntd-line-red{stroke:var(--ntd-red);stroke-width:1.6;fill:none}.ntd-arrowhead{fill:var(--ntd-text3)}.ntd-arrowhead-green{fill:var(--ntd-green)}.ntd-arrowhead-violet{fill:var(--ntd-violet)}.ntd-arrowhead-amber{fill:var(--ntd-amber)}.ntd-arrowhead-red{fill:var(--ntd-red)}</style>
<defs><marker id="core-log-vs-fold-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead"/></marker><marker id="core-log-vs-fold-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead-green"/></marker><marker id="core-log-vs-fold-arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead-violet"/></marker><marker id="core-log-vs-fold-arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead-amber"/></marker><marker id="core-log-vs-fold-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead-red"/></marker></defs>
<text x="20" y="30" class="ntd-label">Task log: the only full transcript</text>
<rect x="20" y="42" width="330" height="40" rx="8" class="ntd-chip ntd-chip-violet"/>
<text x="185.0" y="66.5" class="ntd-sub" text-anchor="middle">every message up to seq k</text>
<rect x="356" y="42" width="200" height="40" rx="8" class="ntd-chip ntd-chip-violet"/>
<text x="456.0" y="66.5" class="ntd-code" text-anchor="middle">Compacted(through=k)</text>
<rect x="562" y="42" width="318" height="40" rx="8" class="ntd-chip ntd-chip-violet"/>
<text x="721.0" y="66.5" class="ntd-sub" text-anchor="middle">events after k</text>
<text x="20" y="173" class="ntd-label">TaskState.messages: the next request</text>
<rect x="356" y="148" width="60" height="40" rx="8" class="ntd-chip ntd-dash"/>
<text x="386.0" y="172.5" class="ntd-code" text-anchor="middle">lead</text>
<rect x="422" y="148" width="70" height="40" rx="8" class="ntd-chip ntd-chip-green"/>
<text x="457.0" y="172.5" class="ntd-sub" text-anchor="middle">summary</text>
<rect x="498" y="148" width="58" height="40" rx="8" class="ntd-chip ntd-dash"/>
<text x="527.0" y="172.5" class="ntd-code" text-anchor="middle">kept</text>
<rect x="562" y="148" width="318" height="40" rx="8" class="ntd-chip ntd-chip-green"/>
<text x="721.0" y="172.5" class="ntd-sub" text-anchor="middle">messages after k</text>
<path d="M 456 82 L 456 146" class="ntd-line" marker-end="url(#core-log-vs-fold-arrow)"/>
<path d="M 721 82 L 721 146" class="ntd-line" marker-end="url(#core-log-vs-fold-arrow)"/>
<text x="466" y="120" class="ntd-mini">fold</text>
<text x="731" y="120" class="ntd-mini">fold</text>
<path d="M 185 82 L 185 104" class="ntd-line ntd-dashed"/>
<path d="M 178 107 L 192 121 M 192 107 L 178 121" class="ntd-line-red"/>
<rect x="20" y="222" width="276" height="84" rx="10" class="ntd-box"/>
<text x="158" y="256" class="ntd-chiptext" text-anchor="middle">saved transcript, audit, rewind:</text>
<text x="158" y="280" class="ntd-sub" text-anchor="middle">read the log (compaction/transcript.py)</text>
<rect x="312" y="222" width="276" height="84" rx="10" class="ntd-box"/>
<text x="450" y="256" class="ntd-chiptext" text-anchor="middle">a plugin that needs an older fact</text>
<text x="450" y="280" class="ntd-sub" text-anchor="middle">keeps it in its own state as it happens</text>
<rect x="604" y="222" width="276" height="84" rx="10" class="ntd-box"/>
<text x="742" y="256" class="ntd-chiptext" text-anchor="middle">snapshot size follows the fold,</text>
<text x="742" y="280" class="ntd-sub" text-anchor="middle">not the task's age</text>
</svg>
