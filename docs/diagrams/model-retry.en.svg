<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="What happens after a model call fails, by kind of error: retry, switch, compact, or fail"><style data-ntd>svg{--ntd-bg:#ffffff;--ntd-panel:#f6f6f7;--ntd-border:#c2c2c4;--ntd-text1:#3c3c43;--ntd-text2:#67676c;--ntd-text3:#929295;--ntd-brand:#059669;--ntd-green:#10b981;--ntd-violet:#8b5cf6;--ntd-amber:#f59e0b;--ntd-cyan:#0891b2;--ntd-red:#e11d48;--ntd-green-soft:rgba(16,185,129,.14);--ntd-violet-soft:rgba(139,92,246,.13);--ntd-amber-soft:rgba(245,158,11,.14);--ntd-cyan-soft:rgba(8,145,178,.12);--ntd-red-soft:rgba(225,29,72,.10);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif}@media (prefers-color-scheme:dark){svg{--ntd-bg:#1b1b1f;--ntd-panel:#202127;--ntd-border:#3c3f44;--ntd-text1:#dfdfd6;--ntd-text2:#98989f;--ntd-text3:#6a6a71;--ntd-brand:#34d399;--ntd-green:#10b981;--ntd-violet:#a78bfa;--ntd-amber:#fbbf24;--ntd-cyan:#22d3ee;--ntd-red:#fb7185;--ntd-green-soft:rgba(16,185,129,.18);--ntd-violet-soft:rgba(139,92,246,.20);--ntd-amber-soft:rgba(245,158,11,.18);--ntd-cyan-soft:rgba(34,211,238,.14);--ntd-red-soft:rgba(251,113,133,.14)}}.ntd-bg{fill:var(--ntd-panel)}.ntd-box{fill:var(--ntd-bg);stroke:var(--ntd-border);stroke-width:1.2}.ntd-frame{fill:none;stroke:var(--ntd-green);stroke-width:1.4;stroke-dasharray:6 5}.ntd-dash{stroke-dasharray:5 4}.ntd-chip{fill:var(--ntd-bg);stroke:var(--ntd-border);stroke-width:1.2}.ntd-chip-green{fill:var(--ntd-green-soft);stroke:var(--ntd-green)}.ntd-chip-violet{fill:var(--ntd-violet-soft);stroke:var(--ntd-violet)}.ntd-chip-amber{fill:var(--ntd-amber-soft);stroke:var(--ntd-amber)}.ntd-chip-cyan{fill:var(--ntd-cyan-soft);stroke:var(--ntd-cyan)}.ntd-chip-red{fill:var(--ntd-red-soft);stroke:var(--ntd-red)}.ntd-title{fill:var(--ntd-text1);font-size:15px;font-weight:600}.ntd-label{fill:var(--ntd-brand);font-size:13px;font-weight:600}.ntd-sub{fill:var(--ntd-text2);font-size:12.5px}.ntd-mini{fill:var(--ntd-text2);font-size:11.5px}.ntd-strong{fill:var(--ntd-text1);font-weight:600}.ntd-em{font-style:italic}.ntd-chiptext{fill:var(--ntd-text1);font-size:13px;font-weight:500}.ntd-code{fill:var(--ntd-brand);font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.ntd-red{fill:var(--ntd-red)}.ntd-line{stroke:var(--ntd-text3);stroke-width:1.4;fill:none}.ntd-dashed{stroke-dasharray:5 4}.ntd-line-green{stroke:var(--ntd-green);stroke-width:1.6;fill:none}.ntd-line-violet{stroke:var(--ntd-violet);stroke-width:1.6;fill:none}.ntd-line-amber{stroke:var(--ntd-amber);stroke-width:1.8;fill:none}.ntd-line-red{stroke:var(--ntd-red);stroke-width:1.6;fill:none}.ntd-arrowhead{fill:var(--ntd-text3)}.ntd-arrowhead-green{fill:var(--ntd-green)}.ntd-arrowhead-violet{fill:var(--ntd-violet)}.ntd-arrowhead-amber{fill:var(--ntd-amber)}.ntd-arrowhead-red{fill:var(--ntd-red)}</style>
<defs><marker id="model-retry-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead"/></marker><marker id="model-retry-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead-red"/></marker></defs>
<rect x="300" y="24" width="300" height="44" rx="10" class="ntd-chip ntd-chip-cyan"/>
<text x="450" y="51" class="ntd-code" text-anchor="middle">Provider.complete(request)</text>
<rect x="24" y="92" width="852" height="344" rx="14" class="ntd-frame"/>
<text x="38" y="112" class="ntd-label">complete_with_retries (noeta/core/retry.py)</text>
<path d="M 450 68 L 450 90" class="ntd-line" marker-end="url(#model-retry-arrow)"/>
<rect x="44" y="126" width="230" height="40" rx="10" class="ntd-chip ntd-chip-cyan"/>
<text x="159" y="151" class="ntd-code" text-anchor="middle">Transient · RateLimited</text>
<rect x="304" y="126" width="552" height="40" rx="10" class="ntd-chip"/>
<text x="580" y="151" class="ntd-mini" text-anchor="middle">wait and try again: 1, 2, 4 … 30 s with jitter, or Retry-After; 9 attempts in all</text>
<path d="M 274 146 L 302 146" class="ntd-line" marker-end="url(#model-retry-arrow)"/>
<rect x="44" y="176" width="230" height="40" rx="10" class="ntd-chip ntd-chip-cyan"/>
<text x="159" y="201" class="ntd-code" text-anchor="middle">StreamBroken</text>
<rect x="304" y="176" width="552" height="40" rx="10" class="ntd-chip"/>
<text x="580" y="201" class="ntd-mini" text-anchor="middle">Anthropic: the same body in one piece (complete_whole, output ≤ 64,000, 300 s)</text>
<path d="M 274 196 L 302 196" class="ntd-line" marker-end="url(#model-retry-arrow)"/>
<rect x="44" y="226" width="230" height="40" rx="10" class="ntd-chip ntd-chip-cyan"/>
<text x="159" y="251" class="ntd-code" text-anchor="middle">MalformedToolArguments</text>
<rect x="304" y="226" width="552" height="40" rx="10" class="ntd-chip"/>
<text x="580" y="251" class="ntd-mini" text-anchor="middle">asked for again, once</text>
<path d="M 274 246 L 302 246" class="ntd-line" marker-end="url(#model-retry-arrow)"/>
<rect x="44" y="276" width="230" height="40" rx="10" class="ntd-chip ntd-chip-cyan"/>
<text x="159" y="301" class="ntd-code" text-anchor="middle">ContextOverflow + counts</text>
<rect x="304" y="276" width="552" height="40" rx="10" class="ntd-chip"/>
<text x="580" y="301" class="ntd-mini" text-anchor="middle">once more with max_tokens = limit − input − 1,000 (at least 3,000)</text>
<path d="M 274 296 L 302 296" class="ntd-line" marker-end="url(#model-retry-arrow)"/>
<rect x="44" y="326" width="230" height="40" rx="10" class="ntd-chip ntd-chip-red ntd-dash"/>
<text x="159" y="351" class="ntd-code" text-anchor="middle">ContextOverflow</text>
<rect x="304" y="326" width="552" height="40" rx="10" class="ntd-chip ntd-chip-red"/>
<text x="580" y="351" class="ntd-mini" text-anchor="middle">on_context_overflow: compact, then call again; else the turn fails (context_overflow)</text>
<path d="M 274 346 L 302 346" class="ntd-line-red" marker-end="url(#model-retry-arrow-red)"/>
<rect x="44" y="376" width="230" height="40" rx="10" class="ntd-chip ntd-chip-red ntd-dash"/>
<text x="159" y="401" class="ntd-code" text-anchor="middle">Fatal</text>
<rect x="304" y="376" width="552" height="40" rx="10" class="ntd-chip ntd-chip-red"/>
<text x="580" y="401" class="ntd-mini" text-anchor="middle">the turn fails: llm_error (auth, a bad request, a refusal)</text>
<path d="M 274 396 L 302 396" class="ntd-line-red" marker-end="url(#model-retry-arrow-red)"/>
<rect x="44" y="450" width="380" height="60" rx="10" class="ntd-chip ntd-chip-violet"/>
<text x="234" y="476.5" class="ntd-chiptext" text-anchor="middle">each retry is a retry record</text>
<text x="234" y="494.5" class="ntd-mini" text-anchor="middle">front ends show retrying</text>
<rect x="476" y="450" width="380" height="60" rx="10" class="ntd-chip"/>
<text x="666" y="469" class="ntd-chiptext" text-anchor="middle">Time limits</text>
<text x="666" y="487" class="ntd-mini" text-anchor="middle">600 s for the headers; silence on</text>
<text x="666" y="502" class="ntd-mini" text-anchor="middle">the stream: Anthropic 60 s, OpenAI 300 s</text>
</svg>
