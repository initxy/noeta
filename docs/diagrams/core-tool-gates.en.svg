<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-label="How one tool call is gated: every plugin's before_tool verdict is collected; any Deny wins, then a Rewrite, then Ask; otherwise the call runs"><style data-ntd>svg{--ntd-bg:#ffffff;--ntd-panel:#f6f6f7;--ntd-border:#c2c2c4;--ntd-text1:#3c3c43;--ntd-text2:#67676c;--ntd-text3:#929295;--ntd-brand:#059669;--ntd-green:#10b981;--ntd-violet:#8b5cf6;--ntd-amber:#f59e0b;--ntd-cyan:#0891b2;--ntd-red:#e11d48;--ntd-green-soft:rgba(16,185,129,.14);--ntd-violet-soft:rgba(139,92,246,.13);--ntd-amber-soft:rgba(245,158,11,.14);--ntd-cyan-soft:rgba(8,145,178,.12);--ntd-red-soft:rgba(225,29,72,.10);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif}@media (prefers-color-scheme:dark){svg{--ntd-bg:#1b1b1f;--ntd-panel:#202127;--ntd-border:#3c3f44;--ntd-text1:#dfdfd6;--ntd-text2:#98989f;--ntd-text3:#6a6a71;--ntd-brand:#34d399;--ntd-green:#10b981;--ntd-violet:#a78bfa;--ntd-amber:#fbbf24;--ntd-cyan:#22d3ee;--ntd-red:#fb7185;--ntd-green-soft:rgba(16,185,129,.18);--ntd-violet-soft:rgba(139,92,246,.20);--ntd-amber-soft:rgba(245,158,11,.18);--ntd-cyan-soft:rgba(34,211,238,.14);--ntd-red-soft:rgba(251,113,133,.14)}}.ntd-bg{fill:var(--ntd-panel)}.ntd-box{fill:var(--ntd-bg);stroke:var(--ntd-border);stroke-width:1.2}.ntd-frame{fill:none;stroke:var(--ntd-green);stroke-width:1.4;stroke-dasharray:6 5}.ntd-dash{stroke-dasharray:5 4}.ntd-chip{fill:var(--ntd-bg);stroke:var(--ntd-border);stroke-width:1.2}.ntd-chip-green{fill:var(--ntd-green-soft);stroke:var(--ntd-green)}.ntd-chip-violet{fill:var(--ntd-violet-soft);stroke:var(--ntd-violet)}.ntd-chip-amber{fill:var(--ntd-amber-soft);stroke:var(--ntd-amber)}.ntd-chip-cyan{fill:var(--ntd-cyan-soft);stroke:var(--ntd-cyan)}.ntd-chip-red{fill:var(--ntd-red-soft);stroke:var(--ntd-red)}.ntd-title{fill:var(--ntd-text1);font-size:15px;font-weight:600}.ntd-label{fill:var(--ntd-brand);font-size:13px;font-weight:600}.ntd-sub{fill:var(--ntd-text2);font-size:12.5px}.ntd-mini{fill:var(--ntd-text2);font-size:11.5px}.ntd-strong{fill:var(--ntd-text1);font-weight:600}.ntd-em{font-style:italic}.ntd-chiptext{fill:var(--ntd-text1);font-size:13px;font-weight:500}.ntd-code{fill:var(--ntd-brand);font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.ntd-red{fill:var(--ntd-red)}.ntd-line{stroke:var(--ntd-text3);stroke-width:1.4;fill:none}.ntd-dashed{stroke-dasharray:5 4}.ntd-line-green{stroke:var(--ntd-green);stroke-width:1.6;fill:none}.ntd-line-violet{stroke:var(--ntd-violet);stroke-width:1.6;fill:none}.ntd-line-amber{stroke:var(--ntd-amber);stroke-width:1.8;fill:none}.ntd-line-red{stroke:var(--ntd-red);stroke-width:1.6;fill:none}.ntd-arrowhead{fill:var(--ntd-text3)}.ntd-arrowhead-green{fill:var(--ntd-green)}.ntd-arrowhead-violet{fill:var(--ntd-violet)}.ntd-arrowhead-amber{fill:var(--ntd-amber)}.ntd-arrowhead-red{fill:var(--ntd-red)}</style>
<defs><marker id="core-tool-gates-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead"/></marker><marker id="core-tool-gates-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead-green"/></marker><marker id="core-tool-gates-arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead-violet"/></marker><marker id="core-tool-gates-arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead-amber"/></marker><marker id="core-tool-gates-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead-red"/></marker></defs>
<rect x="20" y="20" width="260" height="44" rx="10" class="ntd-chip"/>
<text x="150.0" y="46.5" class="ntd-chiptext" text-anchor="middle">one tool call of the reply</text>
<rect x="20" y="84" width="260" height="116" rx="10" class="ntd-box"/>
<text x="150" y="106" class="ntd-label" text-anchor="middle">checked before any gate</text>
<text x="34" y="132" class="ntd-sub">tool not loaded yet → error result</text>
<text x="34" y="156" class="ntd-sub">input fails its schema → error result</text>
<text x="34" y="180" class="ntd-sub">declined earlier → refused, turn stops</text>
<path d="M 150 64 L 150 82" class="ntd-line" marker-end="url(#core-tool-gates-arrow)"/>
<path d="M 150 200 L 150 218" class="ntd-line" marker-end="url(#core-tool-gates-arrow)"/>
<rect x="20" y="220" width="260" height="186" rx="10" class="ntd-box"/>
<text x="150" y="244" class="ntd-label" text-anchor="middle">every plugin's before_tool</text>
<rect x="34" y="258" width="232" height="28" rx="7" class="ntd-chip"/>
<text x="46" y="277" class="ntd-code">permissions</text>
<text x="254" y="277" class="ntd-code" text-anchor="end">Ask</text>
<rect x="34" y="292" width="232" height="28" rx="7" class="ntd-chip"/>
<text x="46" y="311" class="ntd-code">hooks</text>
<text x="254" y="311" class="ntd-code" text-anchor="end">Allow(approve)</text>
<rect x="34" y="326" width="232" height="28" rx="7" class="ntd-chip"/>
<text x="46" y="345" class="ntd-code">plan_mode</text>
<text x="254" y="345" class="ntd-code" text-anchor="end">—</text>
<rect x="34" y="360" width="232" height="28" rx="7" class="ntd-chip"/>
<text x="46" y="379" class="ntd-code">your_guard</text>
<text x="254" y="379" class="ntd-code" text-anchor="end">Rewrite</text>
<text x="150" y="418" class="ntd-mini" text-anchor="middle">a before_tool that raises counts as a Deny</text>
<rect x="326" y="30" width="250" height="48" rx="10" class="ntd-chip"/>
<text x="451.0" y="58.5" class="ntd-chiptext" text-anchor="middle">any Deny?</text>
<rect x="326" y="122" width="250" height="48" rx="10" class="ntd-chip"/>
<text x="451.0" y="150.5" class="ntd-chiptext" text-anchor="middle">any Rewrite?</text>
<rect x="326" y="214" width="250" height="48" rx="10" class="ntd-chip"/>
<text x="451.0" y="242.5" class="ntd-chiptext" text-anchor="middle">any Ask?</text>
<rect x="326" y="306" width="250" height="48" rx="10" class="ntd-chip ntd-chip-amber"/>
<text x="451.0" y="325.5" class="ntd-chiptext" text-anchor="middle">answered or vouched for?</text>
<text x="451.0" y="343.5" class="ntd-mini" text-anchor="middle">a yes · approving Allow · resolve_ask</text>
<path d="M 280 312 L 303 312 L 303 54 L 324 54" class="ntd-line" marker-end="url(#core-tool-gates-arrow)"/>
<path d="M 451.0 78 L 451.0 120" class="ntd-line" marker-end="url(#core-tool-gates-arrow)"/>
<text x="459.0" y="104" class="ntd-mini">no</text>
<path d="M 451.0 170 L 451.0 212" class="ntd-line" marker-end="url(#core-tool-gates-arrow)"/>
<text x="459.0" y="196" class="ntd-mini">no</text>
<path d="M 451.0 262 L 451.0 304" class="ntd-line" marker-end="url(#core-tool-gates-arrow)"/>
<text x="459.0" y="288" class="ntd-mini">yes</text>
<rect x="656" y="30" width="246" height="48" rx="10" class="ntd-chip ntd-chip-red"/>
<text x="779.0" y="49.5" class="ntd-chiptext" text-anchor="middle">error result</text>
<text x="779.0" y="67.5" class="ntd-mini" text-anchor="middle">the model reads the reason</text>
<rect x="656" y="122" width="246" height="48" rx="10" class="ntd-chip"/>
<text x="779.0" y="141.5" class="ntd-chiptext" text-anchor="middle">gate the new call again</text>
<text x="779.0" y="159.5" class="ntd-mini" text-anchor="middle">up to 3 rewrites, then denied</text>
<rect x="656" y="260" width="246" height="48" rx="10" class="ntd-chip ntd-chip-green"/>
<text x="779.0" y="279.5" class="ntd-chiptext" text-anchor="middle">run</text>
<text x="779.0" y="297.5" class="ntd-mini" text-anchor="middle">ToolStarted, then the tool</text>
<path d="M 576 54 L 654 54" class="ntd-line" marker-end="url(#core-tool-gates-arrow)"/>
<text x="616.0" y="47" class="ntd-mini" text-anchor="middle">yes</text>
<path d="M 576 146 L 654 146" class="ntd-line" marker-end="url(#core-tool-gates-arrow)"/>
<text x="616.0" y="139" class="ntd-mini" text-anchor="middle">yes</text>
<path d="M 576 238 L 616 238 L 616 278 L 654 278" class="ntd-line" marker-end="url(#core-tool-gates-arrow)"/>
<text x="596" y="231" class="ntd-mini" text-anchor="middle">no</text>
<path d="M 576 330 L 616 330 L 616 290 L 654 290" class="ntd-line" marker-end="url(#core-tool-gates-arrow)"/>
<text x="596" y="323" class="ntd-mini" text-anchor="middle">yes</text>
<path d="M 779.0 122 L 779.0 96 L 481.0 96 L 481.0 80" class="ntd-line ntd-dashed" marker-end="url(#core-tool-gates-arrow)"/>
<rect x="656" y="336" width="246" height="48" rx="10" class="ntd-chip ntd-chip-amber"/>
<text x="779.0" y="355.5" class="ntd-chiptext" text-anchor="middle">park on approval</text>
<text x="779.0" y="373.5" class="ntd-mini" text-anchor="middle">Waiting(approval); later calls wait</text>
<path d="M 451.0 354 L 451.0 400 L 636 400 L 636 360 L 654 360" class="ntd-line" marker-end="url(#core-tool-gates-arrow)"/>
<text x="459.0" y="392" class="ntd-mini">no</text>
</svg>
