<rect x="20" y="284" width="220" height="46" rx="10" class="ntd-chip ntd-chip-green ntd-dash"/>
<text x="130.0" y="311.5" class="ntd-sub" text-anchor="middle">从头折叠整条日志</text>
<text x="284" y="312" class="ntd-mini">慢一些，但不会错</text>
<rect x="560" y="160" width="324" height="256" rx="10" class="ntd-box"/>
<text x="574" y="186" class="ntd-sub">•</text>
<text x="586" y="186" class="ntd-sub">版本 = 折叠代码、代理、各插件版本记录一起算出的</text>
<text x="586" y="204" class="ntd-sub">哈希</text>
<text x="574" y="230" class="ntd-sub">•</text>
<text x="586" y="230" class="ntd-sub">在后台写，从已存储的事件折叠而来，读回来完全相</text>
<text x="586" y="248" class="ntd-sub">等才保存</text>
<text x="574" y="274" class="ntd-sub">•</text>
<text x="586" y="274" class="ntd-sub">新增事件 ≥ snapshot_every（100 条）且字节数 ≥ </text>
<text x="586" y="292" class="ntd-sub">快照的 10% 时写下一份</text>
<text x="574" y="318" class="ntd-sub">•</text>
<text x="586" y="318" class="ntd-sub">TaskEnded 在同一个事务里删掉这个任务的所有快照</text>
<text x="574" y="344" class="ntd-sub">•</text>
<text x="586" y="344" class="ntd-sub">每个任务最多 2 份（每个折叠版本一份，照顾滚动升</text>
<text x="586" y="362" class="ntd-sub">级）</text>
</svg>
