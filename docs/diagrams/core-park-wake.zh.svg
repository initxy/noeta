<path d="M 20 258 L 906 258" class="ntd-line ntd-dashed"/>
<rect x="130" y="30" width="120" height="40" rx="8" class="ntd-chip ntd-chip-green"/>
<text x="190.0" y="54.5" class="ntd-mini" text-anchor="middle">工具返回 park</text>
<rect x="258" y="30" width="120" height="40" rx="8" class="ntd-chip ntd-chip-green"/>
<text x="318.0" y="54.5" class="ntd-mini" text-anchor="middle">Parked 记录</text>
<rect x="386" y="30" width="120" height="40" rx="8" class="ntd-chip ntd-chip-green"/>
<text x="446.0" y="54.5" class="ntd-mini" text-anchor="middle">追加 Waiting</text>
<text x="524" y="55" class="ntd-mini">工人 A 去跑别的任务</text>
<rect x="130" y="110" width="208" height="40" rx="8" class="ntd-chip ntd-chip-green"/>
