<text x="473.0" y="134.5" class="ntd-mini" text-anchor="middle">waiting（等提问）· 无持有者 · 无租约</text>
<rect x="606" y="110" width="50" height="40" rx="8" class="ntd-chip"/>
<text x="631.0" y="134.5" class="ntd-code" text-anchor="middle">ready</text>
<rect x="662" y="110" width="244" height="40" rx="8" class="ntd-chip ntd-chip-green"/>
<text x="784.0" y="134.5" class="ntd-code" text-anchor="middle">running · B · epoch 5</text>
<path d="M 446 70 L 446 108" class="ntd-line" marker-end="url(#core-park-wake-arrow)"/>
<text x="473" y="166" class="ntd-mini" text-anchor="middle">几分钟或几天：不占任何资源</text>
<rect x="360" y="190" width="160" height="40" rx="8" class="ntd-chip ntd-chip-amber"/>
<text x="440.0" y="214.5" class="ntd-mini" text-anchor="middle">前端显示问题</text>
<rect x="528" y="190" width="128" height="40" rx="8" class="ntd-chip ntd-chip-amber"/>
<text x="592.0" y="214.5" class="ntd-code" text-anchor="middle">client.answer</text>
<path d="M 620 190 L 628 152" class="ntd-line" marker-end="url(#core-park-wake-arrow)"/>
<text x="704" y="215" class="ntd-mini">投递 Answer · 唤醒</text>
<rect x="662" y="270" width="64" height="40" rx="8" class="ntd-chip ntd-chip-green"/>
<text x="694.0" y="294.5" class="ntd-mini" text-anchor="middle">认领</text>
<rect x="734" y="270" width="172" height="40" rx="8" class="ntd-chip ntd-chip-green"/>
<text x="820.0" y="294.5" class="ntd-code" text-anchor="middle">InputTaken(Answer)</text>
<path d="M 694 150 L 694 268" class="ntd-line" marker-end="url(#core-park-wake-arrow)"/>
<text x="906" y="332" class="ntd-code" text-anchor="end">→ tool.resume → ToolFinished → …</text>
</svg>
