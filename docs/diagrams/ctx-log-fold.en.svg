<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="The log is the only full transcript; the fold keeps only what the next step needs"><style data-ntd>svg{--ntd-bg:#ffffff;--ntd-panel:#f6f6f7;--ntd-border:#c2c2c4;--ntd-text1:#3c3c43;--ntd-text2:#67676c;--ntd-text3:#929295;--ntd-brand:#059669;--ntd-green:#10b981;--ntd-violet:#8b5cf6;--ntd-amber:#f59e0b;--ntd-cyan:#0891b2;--ntd-red:#e11d48;--ntd-green-soft:rgba(16,185,129,.14);--ntd-violet-soft:rgba(139,92,246,.13);--ntd-amber-soft:rgba(245,158,11,.14);--ntd-cyan-soft:rgba(8,145,178,.12);--ntd-red-soft:rgba(225,29,72,.10);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif}@media (prefers-color-scheme:dark){svg{--ntd-bg:#1b1b1f;--ntd-panel:#202127;--ntd-border:#3c3f44;--ntd-text1:#dfdfd6;--ntd-text2:#98989f;--ntd-text3:#6a6a71;--ntd-brand:#34d399;--ntd-green:#10b981;--ntd-violet:#a78bfa;--ntd-amber:#fbbf24;--ntd-cyan:#22d3ee;--ntd-red:#fb7185;--ntd-green-soft:rgba(16,185,129,.18);--ntd-violet-soft:rgba(139,92,246,.20);--ntd-amber-soft:rgba(245,158,11,.18);--ntd-cyan-soft:rgba(34,211,238,.14);--ntd-red-soft:rgba(251,113,133,.14)}}.ntd-bg{fill:var(--ntd-panel)}.ntd-box{fill:var(--ntd-bg);stroke:var(--ntd-border);stroke-width:1.2}.ntd-frame{fill:none;stroke:var(--ntd-green);stroke-width:1.4;stroke-dasharray:6 5}.ntd-dash{stroke-dasharray:5 4}.ntd-chip{fill:var(--ntd-bg);stroke:var(--ntd-border);stroke-width:1.2}.ntd-chip-green{fill:var(--ntd-green-soft);stroke:var(--ntd-green)}.ntd-chip-violet{fill:var(--ntd-violet-soft);stroke:var(--ntd-violet)}.ntd-chip-amber{fill:var(--ntd-amber-soft);stroke:var(--ntd-amber)}.ntd-chip-cyan{fill:var(--ntd-cyan-soft);stroke:var(--ntd-cyan)}.ntd-chip-red{fill:var(--ntd-red-soft);stroke:var(--ntd-red)}.ntd-title{fill:var(--ntd-text1);font-size:15px;font-weight:600}.ntd-label{fill:var(--ntd-brand);font-size:13px;font-weight:600}.ntd-sub{fill:var(--ntd-text2);font-size:12.5px}.ntd-mini{fill:var(--ntd-text2);font-size:11.5px}.ntd-strong{fill:var(--ntd-text1);font-weight:600}.ntd-em{font-style:italic}.ntd-chiptext{fill:var(--ntd-text1);font-size:13px;font-weight:500}.ntd-code{fill:var(--ntd-brand);font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.ntd-red{fill:var(--ntd-red)}.ntd-line{stroke:var(--ntd-text3);stroke-width:1.4;fill:none}.ntd-dashed{stroke-dasharray:5 4}.ntd-line-green{stroke:var(--ntd-green);stroke-width:1.6;fill:none}.ntd-line-violet{stroke:var(--ntd-violet);stroke-width:1.6;fill:none}.ntd-line-amber{stroke:var(--ntd-amber);stroke-width:1.8;fill:none}.ntd-line-red{stroke:var(--ntd-red);stroke-width:1.6;fill:none}.ntd-arrowhead{fill:var(--ntd-text3)}.ntd-arrowhead-green{fill:var(--ntd-green)}.ntd-arrowhead-violet{fill:var(--ntd-violet)}.ntd-arrowhead-amber{fill:var(--ntd-amber)}.ntd-arrowhead-red{fill:var(--ntd-red)}</style>
<defs><marker id="ctx-log-fold-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead"/></marker></defs>
<rect x="30" y="40" width="270" height="360" rx="14" class="ntd-frame"/>
<text x="44" y="60" class="ntd-label">Event log: append-only, the full transcript</text>
<rect x="46" y="74" width="238" height="30" rx="10" class="ntd-chip ntd-chip-violet"/>
<text x="165" y="94" class="ntd-code" text-anchor="middle">TaskCreated</text>
<rect x="46" y="112" width="238" height="30" rx="10" class="ntd-chip ntd-chip-violet"/>
<text x="165" y="132" class="ntd-code" text-anchor="middle">InputTaken (Say)</text>
<rect x="46" y="150" width="238" height="30" rx="10" class="ntd-chip ntd-chip-violet"/>
<text x="165" y="170" class="ntd-code" text-anchor="middle">ModelCalled / ModelReplied</text>
<rect x="46" y="188" width="238" height="30" rx="10" class="ntd-chip ntd-chip-violet"/>
<text x="165" y="208" class="ntd-code" text-anchor="middle">ToolStarted / ToolFinished</text>
<rect x="46" y="226" width="238" height="30" rx="10" class="ntd-chip ntd-chip-violet"/>
<text x="165" y="246" class="ntd-code" text-anchor="middle">ExtensionRecorded</text>
<rect x="46" y="264" width="238" height="30" rx="10" class="ntd-chip ntd-dash"/>
<text x="165" y="284" class="ntd-mini" text-anchor="middle">…</text>
<rect x="46" y="302" width="238" height="30" rx="10" class="ntd-chip ntd-chip-violet"/>
<text x="165" y="322" class="ntd-code" text-anchor="middle">Compacted (through = 41)</text>
<rect x="46" y="340" width="238" height="30" rx="10" class="ntd-chip ntd-chip-violet"/>
<text x="165" y="360" class="ntd-code" text-anchor="middle">InputTaken / ModelReplied …</text>
<rect x="380" y="70" width="250" height="110" rx="10" class="ntd-chip"/>
<text x="505" y="91.5" class="ntd-chiptext" text-anchor="middle">TaskState (the fold)</text>
<text x="505" y="109.5" class="ntd-mini" text-anchor="middle">messages: the summary + what followed</text>
<text x="505" y="124.5" class="ntd-mini" text-anchor="middle">prompt_seq, usage, timers, calls</text>
<text x="505" y="139.5" class="ntd-mini" text-anchor="middle">ext: each plugin&#x27;s own state</text>
<text x="505" y="154.5" class="ntd-mini" text-anchor="middle">(tools tool_search loaded,</text>
<text x="505" y="169.5" class="ntd-mini" text-anchor="middle">memory pages read)</text>
<path d="M 302 125 L 378 125" class="ntd-line" marker-end="url(#ctx-log-fold-arrow)"/>
<text x="340" y="118" class="ntd-mini" text-anchor="middle">fold</text>
<rect x="380" y="214" width="250" height="56" rx="10" class="ntd-chip ntd-chip-violet ntd-dash"/>
<text x="505" y="231" class="ntd-chiptext" text-anchor="middle">Snapshot</text>
<text x="505" y="249" class="ntd-mini" text-anchor="middle">the fold at seq N,</text>
<text x="505" y="264" class="ntd-mini" text-anchor="middle">kept per fold version</text>
<path d="M 505 180 L 505 212" class="ntd-line ntd-dashed" marker-end="url(#ctx-log-fold-arrow)"/>
<rect x="670" y="90" width="200" height="70" rx="10" class="ntd-chip ntd-chip-cyan"/>
<text x="770" y="114" class="ntd-chiptext" text-anchor="middle">The next request</text>
<text x="770" y="132" class="ntd-mini" text-anchor="middle">build_request(state)</text>
<text x="770" y="147" class="ntd-mini" text-anchor="middle">a pure function</text>
<path d="M 630 125 L 668 125" class="ntd-line" marker-end="url(#ctx-log-fold-arrow)"/>
<rect x="380" y="316" width="250" height="56" rx="10" class="ntd-chip ntd-dash"/>
<text x="505" y="333" class="ntd-chiptext" text-anchor="middle">Transcript file</text>
<text x="505" y="351" class="ntd-mini" text-anchor="middle">a compaction refolds the whole log</text>
<text x="505" y="366" class="ntd-mini" text-anchor="middle">(transcript.py)</text>
<path d="M 302 344 L 378 344" class="ntd-line ntd-dashed" marker-end="url(#ctx-log-fold-arrow)"/>
<text x="340" y="336" class="ntd-mini" text-anchor="middle">when needed</text>
</svg>
