<rect x="280" y="104" width="422" height="44" rx="10" class="ntd-chip ntd-chip-cyan"/>
<text x="491.0" y="131.0" class="ntd-chiptext" text-anchor="middle">终端界面，跑在 RemoteApp 上：操作 noeta serve 的任务</text>
<rect x="16" y="160" width="232" height="44" rx="10" class="ntd-chip ntd-chip-amber"/>
<text x="132.0" y="187.0" class="ntd-code" text-anchor="middle">noeta -p</text>
