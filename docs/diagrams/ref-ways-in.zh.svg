<rect x="280" y="272" width="422" height="44" rx="10" class="ntd-chip ntd-chip-green"/>
<text x="491.0" y="299.0" class="ntd-chiptext" text-anchor="middle">HTTP / WebSocket 接口，默认也带 worker</text>
<path d="M 702 294 L 738 294" class="ntd-line" marker-end="url(#ref-ways-in-arrow)"/>
<rect x="16" y="328" width="232" height="44" rx="10" class="ntd-chip ntd-chip-amber"/>
<text x="132.0" y="355.0" class="ntd-code" text-anchor="middle">noeta worker</text>
<path d="M 248 350 L 276 350" class="ntd-line" marker-end="url(#ref-ways-in-arrow)"/>
<rect x="280" y="328" width="422" height="44" rx="10" class="ntd-chip ntd-chip-green"/>
<text x="491.0" y="355.0" class="ntd-chiptext" text-anchor="middle">Runtime.serve：认领队列里的任意任务，跑渠道</text>
<path d="M 702 350 L 738 350" class="ntd-line" marker-end="url(#ref-ways-in-arrow)"/>
<rect x="16" y="384" width="232" height="44" rx="10" class="ntd-chip ntd-chip-amber"/>
<text x="132.0" y="411.0" class="ntd-code" text-anchor="middle">noeta trust · plugin(s) · mcp</text>
<path d="M 248 406 L 276 406" class="ntd-line" marker-end="url(#ref-ways-in-arrow)"/>
<rect x="280" y="384" width="422" height="44" rx="10" class="ntd-chip"/>
<text x="491.0" y="411.0" class="ntd-chiptext" text-anchor="middle">只读写 ~/.noeta 和 .noeta/ 里的文件</text>
<rect x="740" y="48" width="184" height="324" rx="10" class="ntd-chip ntd-chip-violet"/>
