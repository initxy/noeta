<rect x="280" y="160" width="422" height="44" rx="10" class="ntd-chip ntd-chip-green"/>
<text x="491.0" y="187.0" class="ntd-chiptext" text-anchor="middle">Claude Code 的无界面模式，走标准输入输出</text>
<path d="M 702 182 L 738 182" class="ntd-line" marker-end="url(#ref-ways-in-arrow)"/>
<rect x="16" y="216" width="232" height="44" rx="10" class="ntd-chip ntd-chip-amber"/>
<text x="132.0" y="243.0" class="ntd-code" text-anchor="middle">noeta acp</text>
<path d="M 248 238 L 276 238" class="ntd-line" marker-end="url(#ref-ways-in-arrow)"/>
<rect x="280" y="216" width="422" height="44" rx="10" class="ntd-chip ntd-chip-green"/>
<text x="491.0" y="243.0" class="ntd-chiptext" text-anchor="middle">在标准输入输出上说 ACP 协议（给编辑器用）</text>
<path d="M 702 238 L 738 238" class="ntd-line" marker-end="url(#ref-ways-in-arrow)"/>
<rect x="16" y="272" width="232" height="44" rx="10" class="ntd-chip ntd-chip-amber"/>
<text x="132.0" y="299.0" class="ntd-code" text-anchor="middle">noeta serve</text>
