<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-label="Writing the summary ahead: the call runs beside the task and its result comes back through the inbox to the one writer"><style data-ntd>svg{--ntd-bg:#ffffff;--ntd-panel:#f6f6f7;--ntd-border:#c2c2c4;--ntd-text1:#3c3c43;--ntd-text2:#67676c;--ntd-text3:#929295;--ntd-brand:#059669;--ntd-green:#10b981;--ntd-violet:#8b5cf6;--ntd-amber:#f59e0b;--ntd-cyan:#0891b2;--ntd-red:#e11d48;--ntd-green-soft:rgba(16,185,129,.14);--ntd-violet-soft:rgba(139,92,246,.13);--ntd-amber-soft:rgba(245,158,11,.14);--ntd-cyan-soft:rgba(8,145,178,.12);--ntd-red-soft:rgba(225,29,72,.10);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif}@media (prefers-color-scheme:dark){svg{--ntd-bg:#1b1b1f;--ntd-panel:#202127;--ntd-border:#3c3f44;--ntd-text1:#dfdfd6;--ntd-text2:#98989f;--ntd-text3:#6a6a71;--ntd-brand:#34d399;--ntd-green:#10b981;--ntd-violet:#a78bfa;--ntd-amber:#fbbf24;--ntd-cyan:#22d3ee;--ntd-red:#fb7185;--ntd-green-soft:rgba(16,185,129,.18);--ntd-violet-soft:rgba(139,92,246,.20);--ntd-amber-soft:rgba(245,158,11,.18);--ntd-cyan-soft:rgba(34,211,238,.14);--ntd-red-soft:rgba(251,113,133,.14)}}.ntd-bg{fill:var(--ntd-panel)}.ntd-box{fill:var(--ntd-bg);stroke:var(--ntd-border);stroke-width:1.2}.ntd-frame{fill:none;stroke:var(--ntd-green);stroke-width:1.4;stroke-dasharray:6 5}.ntd-dash{stroke-dasharray:5 4}.ntd-chip{fill:var(--ntd-bg);stroke:var(--ntd-border);stroke-width:1.2}.ntd-chip-green{fill:var(--ntd-green-soft);stroke:var(--ntd-green)}.ntd-chip-violet{fill:var(--ntd-violet-soft);stroke:var(--ntd-violet)}.ntd-chip-amber{fill:var(--ntd-amber-soft);stroke:var(--ntd-amber)}.ntd-chip-cyan{fill:var(--ntd-cyan-soft);stroke:var(--ntd-cyan)}.ntd-chip-red{fill:var(--ntd-red-soft);stroke:var(--ntd-red)}.ntd-title{fill:var(--ntd-text1);font-size:15px;font-weight:600}.ntd-label{fill:var(--ntd-brand);font-size:13px;font-weight:600}.ntd-sub{fill:var(--ntd-text2);font-size:12.5px}.ntd-mini{fill:var(--ntd-text2);font-size:11.5px}.ntd-strong{fill:var(--ntd-text1);font-weight:600}.ntd-em{font-style:italic}.ntd-chiptext{fill:var(--ntd-text1);font-size:13px;font-weight:500}.ntd-code{fill:var(--ntd-brand);font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.ntd-red{fill:var(--ntd-red)}.ntd-line{stroke:var(--ntd-text3);stroke-width:1.4;fill:none}.ntd-dashed{stroke-dasharray:5 4}.ntd-line-green{stroke:var(--ntd-green);stroke-width:1.6;fill:none}.ntd-line-violet{stroke:var(--ntd-violet);stroke-width:1.6;fill:none}.ntd-line-amber{stroke:var(--ntd-amber);stroke-width:1.8;fill:none}.ntd-line-red{stroke:var(--ntd-red);stroke-width:1.6;fill:none}.ntd-arrowhead{fill:var(--ntd-text3)}.ntd-arrowhead-green{fill:var(--ntd-green)}.ntd-arrowhead-violet{fill:var(--ntd-violet)}.ntd-arrowhead-amber{fill:var(--ntd-amber)}.ntd-arrowhead-red{fill:var(--ntd-red)}</style>
<defs><marker id="ctx-precompute-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead"/></marker></defs>
<text x="24" y="88" class="ntd-label">Runner</text>
<text x="24" y="104" class="ntd-mini">the one writer</text>
<text x="24" y="196" class="ntd-label">Background</text>
<text x="24" y="212" class="ntd-mini">process memory only</text>
<text x="24" y="292" class="ntd-label">Inbox</text>
<text x="24" y="308" class="ntd-mini">in the store</text>
<path d="M 150 150 L 870 150" class="ntd-line ntd-dashed"/>
<path d="M 150 250 L 870 250" class="ntd-line ntd-dashed"/>
<rect x="150" y="56" width="180" height="76" rx="10" class="ntd-chip ntd-chip-green"/>
<text x="240" y="83" class="ntd-chiptext" text-anchor="middle">A step at 80%</text>
<text x="240" y="101" class="ntd-mini" text-anchor="middle">records precompute_started</text>
<text x="240" y="116" class="ntd-mini" text-anchor="middle">{job: a random id}</text>
<rect x="346" y="64" width="130" height="60" rx="10" class="ntd-chip ntd-chip-green"/>
<text x="411" y="90.5" class="ntd-chiptext" text-anchor="middle">Steps go on</text>
<text x="411" y="108.5" class="ntd-mini" text-anchor="middle">the task works on</text>
<rect x="492" y="56" width="180" height="76" rx="10" class="ntd-chip ntd-chip-green"/>
<text x="582" y="83" class="ntd-chiptext" text-anchor="middle">Takes the External</text>
<text x="582" y="101" class="ntd-mini" text-anchor="middle">on_event: job matches?</text>
<text x="582" y="116" class="ntd-mini" text-anchor="middle">then records precomputed</text>
<rect x="690" y="56" width="180" height="76" rx="10" class="ntd-chip ntd-chip-green"/>
<text x="780" y="83" class="ntd-chiptext" text-anchor="middle">At the threshold</text>
<text x="780" y="101" class="ntd-mini" text-anchor="middle">digest still matches:</text>
<text x="780" y="116" class="ntd-mini" text-anchor="middle">swapped in, no new call</text>
<path d="M 330 94 L 344 94" class="ntd-line" marker-end="url(#ctx-precompute-arrow)"/>
<path d="M 476 94 L 490 94" class="ntd-line" marker-end="url(#ctx-precompute-arrow)"/>
<path d="M 672 94 L 688 94" class="ntd-line" marker-end="url(#ctx-precompute-arrow)"/>
<rect x="150" y="172" width="430" height="52" rx="10" class="ntd-chip ntd-chip-cyan"/>
<text x="365" y="202" class="ntd-chiptext" text-anchor="middle">The summarize call with that step&#x27;s request, beside the task</text>
<rect x="600" y="266" width="220" height="62" rx="10" class="ntd-chip ntd-chip-violet"/>
<text x="710" y="286" class="ntd-chiptext" text-anchor="middle">External</text>
<text x="710" y="304" class="ntd-mini" text-anchor="middle">compaction.precomputed</text>
<text x="710" y="319" class="ntd-mini" text-anchor="middle">{job, cut, digest, note, spent}</text>
<path d="M 240 132 L 240 170" class="ntd-line" marker-end="url(#ctx-precompute-arrow)"/>
<text x="248" y="156" class="ntd-mini">starts</text>
<path d="M 540 224 L 540 297 L 598 297" class="ntd-line" marker-end="url(#ctx-precompute-arrow)"/>
<text x="548" y="266" class="ntd-mini">post</text>
<path d="M 820 297 L 850 297 L 850 200 L 600 200 L 600 134" class="ntd-line" marker-end="url(#ctx-precompute-arrow)"/>
<text x="608" y="192" class="ntd-mini">taken at the next boundary</text>
<rect x="150" y="346" width="600" height="76" rx="10" class="ntd-chip ntd-chip-red ntd-dash"/>
<text x="450" y="365.5" class="ntd-chiptext" text-anchor="middle">When it goes wrong</text>
<text x="450" y="383.5" class="ntd-mini" text-anchor="middle">the process died: the call is lost, a later step starts another</text>
<text x="450" y="398.5" class="ntd-mini" text-anchor="middle">a job that does not match (outdated, forged): only its cost is recorded</text>
<text x="450" y="413.5" class="ntd-mini" text-anchor="middle">3 failures: no more summaries written ahead for the task</text>
</svg>
