<line x1="150" y1="124" x2="150" y2="166" class="ntd-line" marker-end="url(#ops-plugin-missing-arrow)"/>
<rect x="24" y="202" width="140" height="60" rx="10" class="ntd-chip ntd-chip-green ntd-dash"/>
<text x="94.0" y="228.0" class="ntd-title" text-anchor="middle">第 1 次认领</text>
<text x="94.0" y="248.0" class="ntd-sub" text-anchor="middle">什么都不写</text>
<rect x="234" y="202" width="140" height="60" rx="10" class="ntd-chip ntd-chip-green ntd-dash"/>
<text x="304.0" y="228.0" class="ntd-title" text-anchor="middle">第 2 次认领</text>
<text x="304.0" y="248.0" class="ntd-sub" text-anchor="middle">什么都不写</text>
<rect x="444" y="202" width="140" height="60" rx="10" class="ntd-chip ntd-chip-green"/>
<text x="514.0" y="228.0" class="ntd-title" text-anchor="middle">第 3 次认领</text>
<text x="514.0" y="248.0" class="ntd-sub" text-anchor="middle">放弃</text>
<line x1="166" y1="232" x2="232" y2="232" class="ntd-line ntd-dashed" marker-end="url(#ops-plugin-missing-arrow)"/>
<text x="200" y="224" class="ntd-mini" text-anchor="middle">租约到期</text>
<line x1="376" y1="232" x2="442" y2="232" class="ntd-line ntd-dashed" marker-end="url(#ops-plugin-missing-arrow)"/>
<text x="410" y="224" class="ntd-mini" text-anchor="middle">租约到期</text>
<rect x="300" y="304" width="340" height="66" rx="10" class="ntd-chip ntd-chip-red"/>
<text x="470.0" y="333.0" class="ntd-title" text-anchor="middle">TaskEnded failed</text>
<text x="470.0" y="353.0" class="ntd-sub" text-anchor="middle">plugin_missing：去那台装上</text>
<line x1="514" y1="262" x2="514" y2="302" class="ntd-line-red" marker-end="url(#ops-plugin-missing-arrow-red)"/>
</svg>
