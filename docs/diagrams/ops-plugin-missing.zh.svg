<text x="305" y="79" class="ntd-mini" text-anchor="middle">认领</text>
<line x1="592" y1="87" x2="638" y2="87" class="ntd-line-green" marker-end="url(#ops-plugin-missing-arrow-green)"/>
<text x="615" y="79" class="ntd-mini" text-anchor="middle">认领</text>
<rect x="640" y="196" width="260" height="66" rx="10" class="ntd-chip ntd-chip-green"/>
<text x="770.0" y="225.0" class="ntd-title" text-anchor="middle">接着跑</text>
