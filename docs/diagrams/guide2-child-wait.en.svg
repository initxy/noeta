<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="How a parent and its sub-agent wait: the parent&#x27;s turn ends and holds no worker; the hand-back and the end notice wake it"><style data-ntd>svg{--ntd-bg:#ffffff;--ntd-panel:#f6f6f7;--ntd-border:#c2c2c4;--ntd-text1:#3c3c43;--ntd-text2:#67676c;--ntd-text3:#929295;--ntd-brand:#059669;--ntd-green:#10b981;--ntd-violet:#8b5cf6;--ntd-amber:#f59e0b;--ntd-cyan:#0891b2;--ntd-red:#e11d48;--ntd-green-soft:rgba(16,185,129,.14);--ntd-violet-soft:rgba(139,92,246,.13);--ntd-amber-soft:rgba(245,158,11,.14);--ntd-cyan-soft:rgba(8,145,178,.12);--ntd-red-soft:rgba(225,29,72,.10);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif}@media (prefers-color-scheme:dark){svg{--ntd-bg:#1b1b1f;--ntd-panel:#202127;--ntd-border:#3c3f44;--ntd-text1:#dfdfd6;--ntd-text2:#98989f;--ntd-text3:#6a6a71;--ntd-brand:#34d399;--ntd-green:#10b981;--ntd-violet:#a78bfa;--ntd-amber:#fbbf24;--ntd-cyan:#22d3ee;--ntd-red:#fb7185;--ntd-green-soft:rgba(16,185,129,.18);--ntd-violet-soft:rgba(139,92,246,.20);--ntd-amber-soft:rgba(245,158,11,.18);--ntd-cyan-soft:rgba(34,211,238,.14);--ntd-red-soft:rgba(251,113,133,.14)}}.ntd-bg{fill:var(--ntd-panel)}.ntd-box{fill:var(--ntd-bg);stroke:var(--ntd-border);stroke-width:1.2}.ntd-frame{fill:none;stroke:var(--ntd-green);stroke-width:1.4;stroke-dasharray:6 5}.ntd-dash{stroke-dasharray:5 4}.ntd-chip{fill:var(--ntd-bg);stroke:var(--ntd-border);stroke-width:1.2}.ntd-chip-green{fill:var(--ntd-green-soft);stroke:var(--ntd-green)}.ntd-chip-violet{fill:var(--ntd-violet-soft);stroke:var(--ntd-violet)}.ntd-chip-amber{fill:var(--ntd-amber-soft);stroke:var(--ntd-amber)}.ntd-chip-cyan{fill:var(--ntd-cyan-soft);stroke:var(--ntd-cyan)}.ntd-chip-red{fill:var(--ntd-red-soft);stroke:var(--ntd-red)}.ntd-title{fill:var(--ntd-text1);font-size:15px;font-weight:600}.ntd-label{fill:var(--ntd-brand);font-size:13px;font-weight:600}.ntd-sub{fill:var(--ntd-text2);font-size:12.5px}.ntd-mini{fill:var(--ntd-text2);font-size:11.5px}.ntd-strong{fill:var(--ntd-text1);font-weight:600}.ntd-em{font-style:italic}.ntd-chiptext{fill:var(--ntd-text1);font-size:13px;font-weight:500}.ntd-code{fill:var(--ntd-brand);font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.ntd-red{fill:var(--ntd-red)}.ntd-line{stroke:var(--ntd-text3);stroke-width:1.4;fill:none}.ntd-dashed{stroke-dasharray:5 4}.ntd-line-green{stroke:var(--ntd-green);stroke-width:1.6;fill:none}.ntd-line-violet{stroke:var(--ntd-violet);stroke-width:1.6;fill:none}.ntd-line-amber{stroke:var(--ntd-amber);stroke-width:1.8;fill:none}.ntd-line-red{stroke:var(--ntd-red);stroke-width:1.6;fill:none}.ntd-arrowhead{fill:var(--ntd-text3)}.ntd-arrowhead-green{fill:var(--ntd-green)}.ntd-arrowhead-violet{fill:var(--ntd-violet)}.ntd-arrowhead-amber{fill:var(--ntd-amber)}.ntd-arrowhead-red{fill:var(--ntd-red)}</style>
<defs><marker id="guide2-child-wait-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead"/></marker><marker id="guide2-child-wait-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead-green"/></marker><marker id="guide2-child-wait-arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead-violet"/></marker><marker id="guide2-child-wait-arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead-amber"/></marker><marker id="guide2-child-wait-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead-red"/></marker></defs>
<rect x="40" y="20" width="220" height="56" rx="10" class="ntd-chip ntd-chip-green"/>
<text x="150.0" y="43.0" class="ntd-title" text-anchor="middle">Parent task</text>
<text x="150.0" y="63.0" class="ntd-sub" text-anchor="middle">main</text>
<rect x="340" y="20" width="220" height="56" rx="10" class="ntd-chip ntd-chip-violet"/>
<text x="450.0" y="43.0" class="ntd-title" text-anchor="middle">Parent&#x27;s inbox</text>
<text x="450.0" y="63.0" class="ntd-sub" text-anchor="middle">store</text>
<rect x="640" y="20" width="220" height="56" rx="10" class="ntd-chip ntd-chip-green"/>
<text x="750.0" y="43.0" class="ntd-title" text-anchor="middle">Child task</text>
<text x="750.0" y="63.0" class="ntd-sub" text-anchor="middle">Explore</text>
<path d="M 150 76 V 96" class="ntd-line ntd-dashed"/>
<path d="M 150 150 V 170" class="ntd-line ntd-dashed"/>
<path d="M 150 224 V 250" class="ntd-line ntd-dashed"/>
<path d="M 150 304 V 350" class="ntd-line ntd-dashed"/>
<path d="M 150 404 V 440" class="ntd-line ntd-dashed"/>
<path d="M 450 76 V 440" class="ntd-line ntd-dashed"/>
<path d="M 750 76 V 96" class="ntd-line ntd-dashed"/>
<path d="M 750 150 V 214" class="ntd-line ntd-dashed"/>
<path d="M 750 268 V 300" class="ntd-line ntd-dashed"/>
<path d="M 750 354 V 440" class="ntd-line ntd-dashed"/>
<rect x="40" y="96" width="220" height="54" rx="10" class="ntd-box"/>
<text x="150.0" y="119.0" class="ntd-chiptext" text-anchor="middle">model calls Agent</text>
<text x="150.0" y="137.0" class="ntd-mini" text-anchor="middle">result at once: launched, agent id</text>
<path d="M 260 123 H 638" class="ntd-line" marker-end="url(#guide2-child-wait-arrow)"/>
<text x="450" y="115" class="ntd-code" text-anchor="middle">TaskCreated + Say(prompt)</text>
<rect x="640" y="96" width="220" height="54" rx="10" class="ntd-chip ntd-chip-green"/>
<text x="750.0" y="119.0" class="ntd-chiptext" text-anchor="middle">runs on any worker</text>
<text x="750.0" y="137.0" class="ntd-mini" text-anchor="middle">its own log and steps</text>
<rect x="40" y="170" width="220" height="54" rx="10" class="ntd-chip ntd-chip-amber"/>
<text x="150.0" y="193.0" class="ntd-chiptext" text-anchor="middle">turn ends → Waiting</text>
<text x="150.0" y="211.0" class="ntd-mini" text-anchor="middle">holds no worker</text>
<rect x="640" y="214" width="220" height="54" rx="10" class="ntd-box"/>
<text x="750.0" y="237.0" class="ntd-code" text-anchor="middle">SubagentHandback(message)</text>
<text x="750.0" y="255.0" class="ntd-mini" text-anchor="middle">Say(report, when=now)</text>
<path d="M 640 241 H 452" class="ntd-line-green" marker-end="url(#guide2-child-wait-arrow-green)"/>
<path d="M 448 262 H 262" class="ntd-line-green" marker-end="url(#guide2-child-wait-arrow-green)"/>
<text x="355" y="254" class="ntd-mini" text-anchor="middle">wakes it</text>
<rect x="40" y="250" width="220" height="54" rx="10" class="ntd-box"/>
<text x="150.0" y="273.0" class="ntd-chiptext" text-anchor="middle">model reads the report</text>
<text x="150.0" y="291.0" class="ntd-code" text-anchor="middle">origin = agent</text>
<rect x="640" y="300" width="220" height="54" rx="10" class="ntd-box"/>
<text x="750.0" y="323.0" class="ntd-chiptext" text-anchor="middle">turn ends → TaskEnded</text>
<text x="750.0" y="341.0" class="ntd-mini" text-anchor="middle">a sub-agent runs one turn</text>
<path d="M 640 327 H 452" class="ntd-line" marker-end="url(#guide2-child-wait-arrow)"/>
<text x="540" y="318" class="ntd-code" text-anchor="middle">ChildEnded(status, answer)</text>
<path d="M 448 372 H 262" class="ntd-line" marker-end="url(#guide2-child-wait-arrow)"/>
<rect x="40" y="350" width="220" height="54" rx="10" class="ntd-box"/>
<text x="150.0" y="373.0" class="ntd-code" text-anchor="middle">&lt;task-notification&gt;</text>
<text x="150.0" y="391.0" class="ntd-mini" text-anchor="middle">sent with the next request, after the report</text>
<text x="450" y="472" class="ntd-mini" text-anchor="middle">Outside auto mode there is no SubagentHandback: the child&#x27;s last reply is the notice&#x27;s &lt;result&gt;, and the notice wakes the parent</text>
<text x="450" y="496" class="ntd-mini" text-anchor="middle">A parent&#x27;s end cancels its live children; a child&#x27;s approvals wait for the person, and front ends find them across the tree</text>
</svg>
