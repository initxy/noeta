<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" role="img" aria-label="Where each plugin hook runs in a step"><style data-ntd>svg{--ntd-bg:#ffffff;--ntd-panel:#f6f6f7;--ntd-border:#c2c2c4;--ntd-text1:#3c3c43;--ntd-text2:#67676c;--ntd-text3:#929295;--ntd-brand:#059669;--ntd-green:#10b981;--ntd-violet:#8b5cf6;--ntd-amber:#f59e0b;--ntd-cyan:#0891b2;--ntd-red:#e11d48;--ntd-green-soft:rgba(16,185,129,.14);--ntd-violet-soft:rgba(139,92,246,.13);--ntd-amber-soft:rgba(245,158,11,.14);--ntd-cyan-soft:rgba(8,145,178,.12);--ntd-red-soft:rgba(225,29,72,.10);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif}@media (prefers-color-scheme:dark){svg{--ntd-bg:#1b1b1f;--ntd-panel:#202127;--ntd-border:#3c3f44;--ntd-text1:#dfdfd6;--ntd-text2:#98989f;--ntd-text3:#6a6a71;--ntd-brand:#34d399;--ntd-green:#10b981;--ntd-violet:#a78bfa;--ntd-amber:#fbbf24;--ntd-cyan:#22d3ee;--ntd-red:#fb7185;--ntd-green-soft:rgba(16,185,129,.18);--ntd-violet-soft:rgba(139,92,246,.20);--ntd-amber-soft:rgba(245,158,11,.18);--ntd-cyan-soft:rgba(34,211,238,.14);--ntd-red-soft:rgba(251,113,133,.14)}}.ntd-bg{fill:var(--ntd-panel)}.ntd-box{fill:var(--ntd-bg);stroke:var(--ntd-border);stroke-width:1.2}.ntd-frame{fill:none;stroke:var(--ntd-green);stroke-width:1.4;stroke-dasharray:6 5}.ntd-dash{stroke-dasharray:5 4}.ntd-chip{fill:var(--ntd-bg);stroke:var(--ntd-border);stroke-width:1.2}.ntd-chip-green{fill:var(--ntd-green-soft);stroke:var(--ntd-green)}.ntd-chip-violet{fill:var(--ntd-violet-soft);stroke:var(--ntd-violet)}.ntd-chip-amber{fill:var(--ntd-amber-soft);stroke:var(--ntd-amber)}.ntd-chip-cyan{fill:var(--ntd-cyan-soft);stroke:var(--ntd-cyan)}.ntd-chip-red{fill:var(--ntd-red-soft);stroke:var(--ntd-red)}.ntd-title{fill:var(--ntd-text1);font-size:15px;font-weight:600}.ntd-label{fill:var(--ntd-brand);font-size:13px;font-weight:600}.ntd-sub{fill:var(--ntd-text2);font-size:12.5px}.ntd-mini{fill:var(--ntd-text2);font-size:11.5px}.ntd-strong{fill:var(--ntd-text1);font-weight:600}.ntd-em{font-style:italic}.ntd-chiptext{fill:var(--ntd-text1);font-size:13px;font-weight:500}.ntd-code{fill:var(--ntd-brand);font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.ntd-red{fill:var(--ntd-red)}.ntd-line{stroke:var(--ntd-text3);stroke-width:1.4;fill:none}.ntd-dashed{stroke-dasharray:5 4}.ntd-line-green{stroke:var(--ntd-green);stroke-width:1.6;fill:none}.ntd-line-violet{stroke:var(--ntd-violet);stroke-width:1.6;fill:none}.ntd-line-amber{stroke:var(--ntd-amber);stroke-width:1.8;fill:none}.ntd-line-red{stroke:var(--ntd-red);stroke-width:1.6;fill:none}.ntd-arrowhead{fill:var(--ntd-text3)}.ntd-arrowhead-green{fill:var(--ntd-green)}.ntd-arrowhead-violet{fill:var(--ntd-violet)}.ntd-arrowhead-amber{fill:var(--ntd-amber)}.ntd-arrowhead-red{fill:var(--ntd-red)}</style>
<defs><marker id="plug-hooks-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead"/></marker></defs>
<text x="40" y="36" class="ntd-label">Every model call</text>
<rect x="40" y="50" width="340" height="50" rx="10" class="ntd-chip ntd-chip-green"/>
<text x="210" y="72" class="ntd-code" text-anchor="middle">on_start</text>
<text x="210" y="89" class="ntd-mini" text-anchor="middle">each time a runner picks the task up</text>
<rect x="40" y="116" width="340" height="50" rx="10" class="ntd-chip ntd-chip-green"/>
<text x="210" y="138" class="ntd-code" text-anchor="middle">tools · tool_changes · context</text>
<text x="210" y="155" class="ntd-mini" text-anchor="middle">this call&#x27;s tool list and system prompt</text>
<rect x="40" y="182" width="340" height="50" rx="10" class="ntd-chip ntd-chip-green"/>
<text x="210" y="204" class="ntd-code" text-anchor="middle">reminders</text>
<text x="210" y="221" class="ntd-mini" text-anchor="middle">notes recorded now, sent in this request</text>
<rect x="40" y="248" width="340" height="50" rx="10" class="ntd-chip ntd-chip-green"/>
<text x="210" y="270" class="ntd-code" text-anchor="middle">before_model</text>
<text x="210" y="287" class="ntd-mini" text-anchor="middle">change the request; raise TurnDone or RequestStale</text>
<rect x="40" y="314" width="340" height="50" rx="10" class="ntd-chip ntd-chip-cyan"/>
<text x="210" y="336" class="ntd-code" text-anchor="middle">Provider.complete</text>
<text x="210" y="353" class="ntd-mini" text-anchor="middle">the model call, with retries</text>
<rect x="40" y="380" width="340" height="50" rx="10" class="ntd-chip ntd-chip-green"/>
<text x="210" y="402" class="ntd-code" text-anchor="middle">before_tool → resolve_ask</text>
<text x="210" y="419" class="ntd-mini" text-anchor="middle">Deny &gt; Rewrite &gt; Ask &gt; Allow; answer an ask in code</text>
<rect x="40" y="446" width="340" height="50" rx="10" class="ntd-chip ntd-chip-green"/>
<text x="210" y="468" class="ntd-code" text-anchor="middle">Tool.run · resume · recover</text>
<text x="210" y="485" class="ntd-mini" text-anchor="middle">the call runs in the exec env</text>
<rect x="40" y="512" width="340" height="50" rx="10" class="ntd-chip ntd-chip-green"/>
<text x="210" y="534" class="ntd-code" text-anchor="middle">after_tool</text>
<text x="210" y="551" class="ntd-mini" text-anchor="middle">change the result before it is recorded</text>
<path d="M 210 100 L 210 114" class="ntd-line" marker-end="url(#plug-hooks-arrow)"/>
<path d="M 210 166 L 210 180" class="ntd-line" marker-end="url(#plug-hooks-arrow)"/>
<path d="M 210 232 L 210 246" class="ntd-line" marker-end="url(#plug-hooks-arrow)"/>
<path d="M 210 298 L 210 312" class="ntd-line" marker-end="url(#plug-hooks-arrow)"/>
<path d="M 210 364 L 210 378" class="ntd-line" marker-end="url(#plug-hooks-arrow)"/>
<path d="M 210 430 L 210 444" class="ntd-line" marker-end="url(#plug-hooks-arrow)"/>
<path d="M 210 496 L 210 510" class="ntd-line" marker-end="url(#plug-hooks-arrow)"/>
<path d="M 380 537 L 410 537 L 410 141 L 382 141" class="ntd-line ntd-dashed" marker-end="url(#plug-hooks-arrow)"/>
<text x="418" y="476" class="ntd-mini">next call</text>
<rect x="470" y="284" width="210" height="50" rx="10" class="ntd-chip ntd-chip-red ntd-dash"/>
<text x="575" y="306" class="ntd-code" text-anchor="middle">on_context_overflow</text>
<text x="575" y="323" class="ntd-mini" text-anchor="middle">the model refused it as too long</text>
<rect x="470" y="348" width="210" height="50" rx="10" class="ntd-chip ntd-dash"/>
<text x="575" y="370" class="ntd-code" text-anchor="middle">on_empty_reply</text>
<text x="575" y="387" class="ntd-mini" text-anchor="middle">no text and no tool call</text>
<path d="M 380 332 L 468 309" class="ntd-line ntd-dashed" marker-end="url(#plug-hooks-arrow)"/>
<path d="M 380 346 L 468 373" class="ntd-line ntd-dashed" marker-end="url(#plug-hooks-arrow)"/>
<text x="560" y="36" class="ntd-label">Around the steps</text>
<rect x="560" y="50" width="310" height="50" rx="10" class="ntd-chip"/>
<text x="715" y="72" class="ntd-code" text-anchor="middle">on_event · delivered_through</text>
<text x="715" y="89" class="ntd-mini" text-anchor="middle">after each append; at least once with a cursor</text>
<rect x="560" y="116" width="310" height="50" rx="10" class="ntd-chip"/>
<text x="715" y="138" class="ntd-code" text-anchor="middle">reduce · folds · continue_state</text>
<text x="715" y="155" class="ntd-mini" text-anchor="middle">fold own records; what a continuing task keeps</text>
<rect x="560" y="182" width="310" height="50" rx="10" class="ntd-chip"/>
<text x="715" y="204" class="ntd-code" text-anchor="middle">before_compact · resident · lead_resident</text>
<text x="715" y="221" class="ntd-mini" text-anchor="middle">asked by the compaction plugin</text>
<rect x="560" y="448" width="310" height="50" rx="10" class="ntd-chip"/>
<text x="715" y="470" class="ntd-code" text-anchor="middle">inherit</text>
<text x="715" y="487" class="ntd-mini" text-anchor="middle">config every child task starts with</text>
<rect x="560" y="514" width="310" height="50" rx="10" class="ntd-chip"/>
<text x="715" y="536" class="ntd-code" text-anchor="middle">commands · run_command</text>
<text x="715" y="553" class="ntd-mini" text-anchor="middle">slash commands front ends list and expand</text>
</svg>
