<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 466" role="img" aria-label="配置从哪里来、谁说了算：命令行参数高于环境变量，环境变量高于 config.toml；设置文件从用户级到机器管理级逐层覆盖，项目里的只在信任之后才读"><style data-ntd>svg{--ntd-bg:#ffffff;--ntd-panel:#f6f6f7;--ntd-border:#c2c2c4;--ntd-text1:#3c3c43;--ntd-text2:#67676c;--ntd-text3:#929295;--ntd-brand:#059669;--ntd-green:#10b981;--ntd-violet:#8b5cf6;--ntd-amber:#f59e0b;--ntd-cyan:#0891b2;--ntd-red:#e11d48;--ntd-green-soft:rgba(16,185,129,.14);--ntd-violet-soft:rgba(139,92,246,.13);--ntd-amber-soft:rgba(245,158,11,.14);--ntd-cyan-soft:rgba(8,145,178,.12);--ntd-red-soft:rgba(225,29,72,.10);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif}@media (prefers-color-scheme:dark){svg{--ntd-bg:#1b1b1f;--ntd-panel:#202127;--ntd-border:#3c3f44;--ntd-text1:#dfdfd6;--ntd-text2:#98989f;--ntd-text3:#6a6a71;--ntd-brand:#34d399;--ntd-green:#10b981;--ntd-violet:#a78bfa;--ntd-amber:#fbbf24;--ntd-cyan:#22d3ee;--ntd-red:#fb7185;--ntd-green-soft:rgba(16,185,129,.18);--ntd-violet-soft:rgba(139,92,246,.20);--ntd-amber-soft:rgba(245,158,11,.18);--ntd-cyan-soft:rgba(34,211,238,.14);--ntd-red-soft:rgba(251,113,133,.14)}}.ntd-bg{fill:var(--ntd-panel)}.ntd-box{fill:var(--ntd-bg);stroke:var(--ntd-border);stroke-width:1.2}.ntd-frame{fill:none;stroke:var(--ntd-green);stroke-width:1.4;stroke-dasharray:6 5}.ntd-dash{stroke-dasharray:5 4}.ntd-chip{fill:var(--ntd-bg);stroke:var(--ntd-border);stroke-width:1.2}.ntd-chip-green{fill:var(--ntd-green-soft);stroke:var(--ntd-green)}.ntd-chip-violet{fill:var(--ntd-violet-soft);stroke:var(--ntd-violet)}.ntd-chip-amber{fill:var(--ntd-amber-soft);stroke:var(--ntd-amber)}.ntd-chip-cyan{fill:var(--ntd-cyan-soft);stroke:var(--ntd-cyan)}.ntd-chip-red{fill:var(--ntd-red-soft);stroke:var(--ntd-red)}.ntd-title{fill:var(--ntd-text1);font-size:15px;font-weight:600}.ntd-label{fill:var(--ntd-brand);font-size:13px;font-weight:600}.ntd-sub{fill:var(--ntd-text2);font-size:12.5px}.ntd-mini{fill:var(--ntd-text2);font-size:11.5px}.ntd-strong{fill:var(--ntd-text1);font-weight:600}.ntd-em{font-style:italic}.ntd-chiptext{fill:var(--ntd-text1);font-size:13px;font-weight:500}.ntd-code{fill:var(--ntd-brand);font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.ntd-red{fill:var(--ntd-red)}.ntd-line{stroke:var(--ntd-text3);stroke-width:1.4;fill:none}.ntd-dashed{stroke-dasharray:5 4}.ntd-line-green{stroke:var(--ntd-green);stroke-width:1.6;fill:none}.ntd-line-violet{stroke:var(--ntd-violet);stroke-width:1.6;fill:none}.ntd-line-amber{stroke:var(--ntd-amber);stroke-width:1.8;fill:none}.ntd-line-red{stroke:var(--ntd-red);stroke-width:1.6;fill:none}.ntd-arrowhead{fill:var(--ntd-text3)}.ntd-arrowhead-green{fill:var(--ntd-green)}.ntd-arrowhead-violet{fill:var(--ntd-violet)}.ntd-arrowhead-amber{fill:var(--ntd-amber)}.ntd-arrowhead-red{fill:var(--ntd-red)}</style>
<defs><marker id="start-config-places-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead"/></marker><marker id="start-config-places-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead-green"/></marker><marker id="start-config-places-arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead-violet"/></marker><marker id="start-config-places-arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead-amber"/></marker><marker id="start-config-places-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead-red"/></marker></defs>
<text x="220" y="40" class="ntd-label" text-anchor="middle">模型、provider、存储、插件</text>
<text x="710" y="40" class="ntd-label" text-anchor="middle">设置文件（Claude Code 的格式）</text>
<rect x="40" y="60" width="360" height="72" rx="10" class="ntd-chip ntd-chip-amber"/>
<text x="220.0" y="83.0" class="ntd-chiptext" text-anchor="middle">命令行参数</text>
<text x="220.0" y="101.0" class="ntd-code" text-anchor="middle">--model · --provider · --base-url</text>
<text x="220.0" y="119.0" class="ntd-code" text-anchor="middle">--store · --effort</text>
<rect x="40" y="152" width="360" height="72" rx="10" class="ntd-chip"/>
<text x="220.0" y="175.0" class="ntd-chiptext" text-anchor="middle">环境变量</text>
<text x="220.0" y="193.0" class="ntd-code" text-anchor="middle">NOETA_MODEL · NOETA_PROVIDER · NOETA_STORE</text>
<text x="220.0" y="211.0" class="ntd-code" text-anchor="middle">NOETA_BASE_URL · NOETA_API_KEY · NOETA_EFFORT</text>
<rect x="40" y="244" width="360" height="72" rx="10" class="ntd-chip ntd-chip-violet"/>
<text x="220.0" y="267.0" class="ntd-chiptext" text-anchor="middle">~/.noeta/config.toml</text>
<text x="220.0" y="285.0" class="ntd-code" text-anchor="middle">model · provider · base_url · api_key · store</text>
<text x="220.0" y="303.0" class="ntd-code" text-anchor="middle">[providers.*] · [plugins.*] · [agents.*]</text>
<rect x="40" y="340" width="360" height="50" rx="10" class="ntd-box ntd-dash"/>
<text x="220.0" y="370.0" class="ntd-mini" text-anchor="middle">设置文件里的 model：上面都没指定时才用</text>
<path d="M 24 388 L 24 64" class="ntd-line" marker-end="url(#start-config-places-arrow)"/>
<text x="15" y="208" class="ntd-mini" text-anchor="middle" transform="rotate(-90 15 208)">优先</text>
<rect x="518" y="178" width="384" height="144" rx="12" class="ntd-box ntd-dash"/>
<text x="532" y="196" class="ntd-mini" text-anchor="start">执行 noeta trust 之后才读</text>
<rect x="530" y="60" width="360" height="50" rx="10" class="ntd-chip ntd-chip-violet"/>
<text x="710.0" y="81.5" class="ntd-code" text-anchor="middle">managed-settings.json</text>
<text x="710.0" y="98.5" class="ntd-mini" text-anchor="middle">本机管理员的：/etc/noeta，总会读</text>
<rect x="530" y="120" width="360" height="50" rx="10" class="ntd-chip ntd-chip-amber"/>
<text x="710.0" y="141.5" class="ntd-code" text-anchor="middle">--settings</text>
<text x="710.0" y="158.5" class="ntd-mini" text-anchor="middle">一个文件或 JSON 字符串（noeta -p）</text>
<rect x="530" y="206" width="360" height="50" rx="10" class="ntd-chip"/>
<text x="710.0" y="227.5" class="ntd-code" text-anchor="middle">.noeta/settings.local.json</text>
<text x="710.0" y="244.5" class="ntd-mini" text-anchor="middle">本项目，不进 git</text>
<rect x="530" y="264" width="360" height="50" rx="10" class="ntd-chip"/>
<text x="710.0" y="285.5" class="ntd-code" text-anchor="middle">.noeta/settings.json</text>
<text x="710.0" y="302.5" class="ntd-mini" text-anchor="middle">本项目，提交进仓库</text>
<rect x="530" y="340" width="360" height="50" rx="10" class="ntd-chip ntd-chip-violet"/>
<text x="710.0" y="361.5" class="ntd-code" text-anchor="middle">~/.noeta/settings.json</text>
<text x="710.0" y="378.5" class="ntd-mini" text-anchor="middle">你自己的，对所有项目生效</text>
<path d="M 914 388 L 914 64" class="ntd-line" marker-end="url(#start-config-places-arrow)"/>
<text x="924" y="208" class="ntd-mini" text-anchor="middle" transform="rotate(90 924 208)">优先</text>
<path d="M 516 262 L 460 262 L 460 180 L 402 180" class="ntd-line" marker-end="url(#start-config-places-arrow)"/>
<text x="460" y="286" class="ntd-mini" text-anchor="middle">其中 env 先生效</text>
<rect x="40" y="410" width="850" height="40" rx="10" class="ntd-chip ntd-chip-red"/>
<text x="465.0" y="435.0" class="ntd-chiptext" text-anchor="middle">从不读取：~/.claude/ · .claude/ · CLAUDE.md · .mcp.json · CLAUDE_* 变量</text>
