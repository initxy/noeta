<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-label="Where MCP servers come from, how a worker connects to them, and how their tools reach the model"><style data-ntd>svg{--ntd-bg:#ffffff;--ntd-panel:#f6f6f7;--ntd-border:#c2c2c4;--ntd-text1:#3c3c43;--ntd-text2:#67676c;--ntd-text3:#929295;--ntd-brand:#059669;--ntd-green:#10b981;--ntd-violet:#8b5cf6;--ntd-amber:#f59e0b;--ntd-cyan:#0891b2;--ntd-red:#e11d48;--ntd-green-soft:rgba(16,185,129,.14);--ntd-violet-soft:rgba(139,92,246,.13);--ntd-amber-soft:rgba(245,158,11,.14);--ntd-cyan-soft:rgba(8,145,178,.12);--ntd-red-soft:rgba(225,29,72,.10);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif}@media (prefers-color-scheme:dark){svg{--ntd-bg:#1b1b1f;--ntd-panel:#202127;--ntd-border:#3c3f44;--ntd-text1:#dfdfd6;--ntd-text2:#98989f;--ntd-text3:#6a6a71;--ntd-brand:#34d399;--ntd-green:#10b981;--ntd-violet:#a78bfa;--ntd-amber:#fbbf24;--ntd-cyan:#22d3ee;--ntd-red:#fb7185;--ntd-green-soft:rgba(16,185,129,.18);--ntd-violet-soft:rgba(139,92,246,.20);--ntd-amber-soft:rgba(245,158,11,.18);--ntd-cyan-soft:rgba(34,211,238,.14);--ntd-red-soft:rgba(251,113,133,.14)}}.ntd-bg{fill:var(--ntd-panel)}.ntd-box{fill:var(--ntd-bg);stroke:var(--ntd-border);stroke-width:1.2}.ntd-frame{fill:none;stroke:var(--ntd-green);stroke-width:1.4;stroke-dasharray:6 5}.ntd-dash{stroke-dasharray:5 4}.ntd-chip{fill:var(--ntd-bg);stroke:var(--ntd-border);stroke-width:1.2}.ntd-chip-green{fill:var(--ntd-green-soft);stroke:var(--ntd-green)}.ntd-chip-violet{fill:var(--ntd-violet-soft);stroke:var(--ntd-violet)}.ntd-chip-amber{fill:var(--ntd-amber-soft);stroke:var(--ntd-amber)}.ntd-chip-cyan{fill:var(--ntd-cyan-soft);stroke:var(--ntd-cyan)}.ntd-chip-red{fill:var(--ntd-red-soft);stroke:var(--ntd-red)}.ntd-title{fill:var(--ntd-text1);font-size:15px;font-weight:600}.ntd-label{fill:var(--ntd-brand);font-size:13px;font-weight:600}.ntd-sub{fill:var(--ntd-text2);font-size:12.5px}.ntd-mini{fill:var(--ntd-text2);font-size:11.5px}.ntd-strong{fill:var(--ntd-text1);font-weight:600}.ntd-em{font-style:italic}.ntd-chiptext{fill:var(--ntd-text1);font-size:13px;font-weight:500}.ntd-code{fill:var(--ntd-brand);font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.ntd-red{fill:var(--ntd-red)}.ntd-line{stroke:var(--ntd-text3);stroke-width:1.4;fill:none}.ntd-dashed{stroke-dasharray:5 4}.ntd-line-green{stroke:var(--ntd-green);stroke-width:1.6;fill:none}.ntd-line-violet{stroke:var(--ntd-violet);stroke-width:1.6;fill:none}.ntd-line-amber{stroke:var(--ntd-amber);stroke-width:1.8;fill:none}.ntd-line-red{stroke:var(--ntd-red);stroke-width:1.6;fill:none}.ntd-arrowhead{fill:var(--ntd-text3)}.ntd-arrowhead-green{fill:var(--ntd-green)}.ntd-arrowhead-violet{fill:var(--ntd-violet)}.ntd-arrowhead-amber{fill:var(--ntd-amber)}.ntd-arrowhead-red{fill:var(--ntd-red)}</style>
<defs><marker id="guide2-mcp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead"/></marker></defs>
<text x="130" y="42" class="ntd-label" text-anchor="middle">where servers come from</text>
<rect x="20" y="58" width="220" height="50" rx="10" class="ntd-box"/>
<text x="130" y="79" class="ntd-chiptext" text-anchor="middle">agent file</text>
<text x="130" y="97" class="ntd-mini" text-anchor="middle">its own mcpServers</text>
<path d="M240 83 C 270 83, 270 124, 302 124" class="ntd-line" marker-end="url(#guide2-mcp-arrow)"/>
<rect x="20" y="118" width="220" height="50" rx="10" class="ntd-box"/>
<text x="130" y="139" class="ntd-chiptext" text-anchor="middle">flags and plugins</text>
<text x="130" y="157" class="ntd-mini" text-anchor="middle">--mcp-config, .mcp.json</text>
<path d="M240 143 C 270 143, 270 140, 302 140" class="ntd-line" marker-end="url(#guide2-mcp-arrow)"/>
<rect x="20" y="178" width="220" height="50" rx="10" class="ntd-box ntd-dash"/>
<text x="130" y="199" class="ntd-chiptext" text-anchor="middle">.noeta/mcp.json</text>
<text x="130" y="217" class="ntd-mini" text-anchor="middle">trusted project + consent</text>
<path d="M240 203 C 270 203, 270 156, 302 156" class="ntd-line" marker-end="url(#guide2-mcp-arrow)"/>
<rect x="20" y="238" width="220" height="50" rx="10" class="ntd-box"/>
<text x="130" y="259" class="ntd-chiptext" text-anchor="middle">settings files</text>
<text x="130" y="277" class="ntd-mini" text-anchor="middle">mcpServers in settings</text>
<path d="M240 263 C 270 263, 270 172, 302 172" class="ntd-line" marker-end="url(#guide2-mcp-arrow)"/>
<text x="130" y="312" class="ntd-mini" text-anchor="middle">the first of a name wins</text>
<rect x="290" y="80" width="230" height="290" rx="12" class="ntd-frame"/>
<text x="406" y="98" class="ntd-mini" text-anchor="middle">on each worker</text>
<rect x="304" y="108" width="204" height="84" rx="10" class="ntd-chip ntd-chip-green"/>
<text x="406" y="136" class="ntd-title" text-anchor="middle">Mcp plugin</text>
<text x="406" y="157" class="ntd-sub" text-anchor="middle">resolves the servers</text>
<text x="406" y="175" class="ntd-sub" text-anchor="middle">each time a task is picked up</text>
<line x1="406" y1="192" x2="406" y2="266" class="ntd-line" marker-end="url(#guide2-mcp-arrow)"/>
<text x="414" y="234" class="ntd-code">use()</text>
<rect x="304" y="268" width="204" height="88" rx="10" class="ntd-chip ntd-chip-green"/>
<text x="406" y="296" class="ntd-title" text-anchor="middle">McpPool</text>
<text x="406" y="317" class="ntd-sub" text-anchor="middle">one connection per scope + server</text>
<text x="406" y="336" class="ntd-mini" text-anchor="middle">per process, closed after 30 min idle</text>
<rect x="590" y="14" width="310" height="96" rx="10" class="ntd-chip ntd-chip-violet"/>
<text x="745" y="38" class="ntd-title" text-anchor="middle">task log</text>
<text x="745" y="57" class="ntd-code" text-anchor="middle">mcp · listed</text>
<text x="745" y="77" class="ntd-mini" text-anchor="middle">aliases and tool schemas only,</text>
<text x="745" y="95" class="ntd-mini" text-anchor="middle">never commands, headers or tokens</text>
<path d="M508 130 H 548 V 62 H 588" class="ntd-line" marker-end="url(#guide2-mcp-arrow)"/>
<text x="556" y="126" class="ntd-code">tools/list</text>
<text x="556" y="142" class="ntd-mini">at turn start</text>
<line x1="745" y1="110" x2="745" y2="148" class="ntd-line" marker-end="url(#guide2-mcp-arrow)"/>
<text x="753" y="134" class="ntd-mini">offered</text>
<rect x="590" y="150" width="310" height="86" rx="10" class="ntd-chip ntd-chip-cyan"/>
<text x="745" y="176" class="ntd-title" text-anchor="middle">what the model gets</text>
<text x="745" y="197" class="ntd-sub" text-anchor="middle">names only, until ToolSearch loads one</text>
<text x="745" y="219" class="ntd-code" text-anchor="middle">mcp__github__create_issue</text>
<rect x="590" y="282" width="70" height="60" rx="10" class="ntd-chip ntd-chip-green"/>
<text x="625" y="306" class="ntd-chiptext" text-anchor="middle">stdio</text>
<text x="625" y="326" class="ntd-mini" text-anchor="middle">process</text>
<rect x="670" y="282" width="70" height="60" rx="10" class="ntd-chip ntd-chip-cyan"/>
<text x="705" y="306" class="ntd-chiptext" text-anchor="middle">http</text>
<text x="705" y="326" class="ntd-mini" text-anchor="middle">Streamable</text>
<rect x="750" y="282" width="70" height="60" rx="10" class="ntd-chip ntd-chip-cyan"/>
<text x="785" y="306" class="ntd-chiptext" text-anchor="middle">sse</text>
<text x="785" y="326" class="ntd-mini" text-anchor="middle">legacy</text>
<rect x="830" y="282" width="70" height="60" rx="10" class="ntd-chip ntd-chip-cyan"/>
<text x="865" y="306" class="ntd-chiptext" text-anchor="middle">ws</text>
<text x="865" y="326" class="ntd-mini" text-anchor="middle">WebSocket</text>
<line x1="508" y1="312" x2="586" y2="312" class="ntd-line" marker-end="url(#guide2-mcp-arrow)"/>
<text x="556" y="304" class="ntd-mini" text-anchor="middle">JSON-RPC</text>
<text x="460" y="402" class="ntd-mini" text-anchor="middle">A server that fails to list is left out for that turn and the model is told; the next turn lists it again.</text>
</svg>
