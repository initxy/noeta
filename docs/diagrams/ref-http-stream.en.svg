<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 936 456" role="img" aria-label="GET /tasks/{id}/watch: recorded events from the store become event messages, live output from workers becomes delta messages, a keep-alive comment every 15 seconds, and an end message when the task has ended"><style data-ntd>svg{--ntd-bg:#ffffff;--ntd-panel:#f6f6f7;--ntd-border:#c2c2c4;--ntd-text1:#3c3c43;--ntd-text2:#67676c;--ntd-text3:#929295;--ntd-brand:#059669;--ntd-green:#10b981;--ntd-violet:#8b5cf6;--ntd-amber:#f59e0b;--ntd-cyan:#0891b2;--ntd-red:#e11d48;--ntd-green-soft:rgba(16,185,129,.14);--ntd-violet-soft:rgba(139,92,246,.13);--ntd-amber-soft:rgba(245,158,11,.14);--ntd-cyan-soft:rgba(8,145,178,.12);--ntd-red-soft:rgba(225,29,72,.10);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif}@media (prefers-color-scheme:dark){svg{--ntd-bg:#1b1b1f;--ntd-panel:#202127;--ntd-border:#3c3f44;--ntd-text1:#dfdfd6;--ntd-text2:#98989f;--ntd-text3:#6a6a71;--ntd-brand:#34d399;--ntd-green:#10b981;--ntd-violet:#a78bfa;--ntd-amber:#fbbf24;--ntd-cyan:#22d3ee;--ntd-red:#fb7185;--ntd-green-soft:rgba(16,185,129,.18);--ntd-violet-soft:rgba(139,92,246,.20);--ntd-amber-soft:rgba(245,158,11,.18);--ntd-cyan-soft:rgba(34,211,238,.14);--ntd-red-soft:rgba(251,113,133,.14)}}.ntd-bg{fill:var(--ntd-panel)}.ntd-box{fill:var(--ntd-bg);stroke:var(--ntd-border);stroke-width:1.2}.ntd-frame{fill:none;stroke:var(--ntd-green);stroke-width:1.4;stroke-dasharray:6 5}.ntd-dash{stroke-dasharray:5 4}.ntd-chip{fill:var(--ntd-bg);stroke:var(--ntd-border);stroke-width:1.2}.ntd-chip-green{fill:var(--ntd-green-soft);stroke:var(--ntd-green)}.ntd-chip-violet{fill:var(--ntd-violet-soft);stroke:var(--ntd-violet)}.ntd-chip-amber{fill:var(--ntd-amber-soft);stroke:var(--ntd-amber)}.ntd-chip-cyan{fill:var(--ntd-cyan-soft);stroke:var(--ntd-cyan)}.ntd-chip-red{fill:var(--ntd-red-soft);stroke:var(--ntd-red)}.ntd-title{fill:var(--ntd-text1);font-size:15px;font-weight:600}.ntd-label{fill:var(--ntd-brand);font-size:13px;font-weight:600}.ntd-sub{fill:var(--ntd-text2);font-size:12.5px}.ntd-mini{fill:var(--ntd-text2);font-size:11.5px}.ntd-strong{fill:var(--ntd-text1);font-weight:600}.ntd-em{font-style:italic}.ntd-chiptext{fill:var(--ntd-text1);font-size:13px;font-weight:500}.ntd-code{fill:var(--ntd-brand);font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.ntd-red{fill:var(--ntd-red)}.ntd-line{stroke:var(--ntd-text3);stroke-width:1.4;fill:none}.ntd-dashed{stroke-dasharray:5 4}.ntd-line-green{stroke:var(--ntd-green);stroke-width:1.6;fill:none}.ntd-line-violet{stroke:var(--ntd-violet);stroke-width:1.6;fill:none}.ntd-line-amber{stroke:var(--ntd-amber);stroke-width:1.8;fill:none}.ntd-line-red{stroke:var(--ntd-red);stroke-width:1.6;fill:none}.ntd-arrowhead{fill:var(--ntd-text3)}.ntd-arrowhead-green{fill:var(--ntd-green)}.ntd-arrowhead-violet{fill:var(--ntd-violet)}.ntd-arrowhead-amber{fill:var(--ntd-amber)}.ntd-arrowhead-red{fill:var(--ntd-red)}</style>
<defs><marker id="ref-http-stream-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead"/></marker><marker id="ref-http-stream-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead-green"/></marker><marker id="ref-http-stream-arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead-violet"/></marker><marker id="ref-http-stream-arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead-amber"/></marker><marker id="ref-http-stream-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead-red"/></marker></defs>
<rect x="16" y="52" width="230" height="60" rx="10" class="ntd-chip ntd-chip-violet"/>
<text x="131.0" y="77.5" class="ntd-chiptext" text-anchor="middle">Store</text>
<text x="131.0" y="96.5" class="ntd-mini" text-anchor="middle">recorded events, seq &gt; after</text>
<rect x="16" y="124" width="230" height="60" rx="10" class="ntd-chip ntd-chip-green"/>
<text x="131.0" y="149.5" class="ntd-chiptext" text-anchor="middle">Worker in this process</text>
<text x="131.0" y="168.5" class="ntd-mini" text-anchor="middle">LocalApp.deltas</text>
<rect x="16" y="196" width="230" height="60" rx="10" class="ntd-chip ntd-chip-green ntd-dash"/>
<text x="131.0" y="221.5" class="ntd-chiptext" text-anchor="middle">Workers on other machines</text>
<text x="131.0" y="240.5" class="ntd-mini" text-anchor="middle">Postgres notifications, best effort</text>
<rect x="16" y="268" width="230" height="60" rx="10" class="ntd-box ntd-dash"/>
<text x="131.0" y="303.0" class="ntd-chiptext" text-anchor="middle">No message for 15 s</text>
<rect x="16" y="340" width="230" height="60" rx="10" class="ntd-chip ntd-chip-violet"/>
<text x="131.0" y="365.5" class="ntd-chiptext" text-anchor="middle">Task ended</text>
<text x="131.0" y="384.5" class="ntd-mini" text-anchor="middle">and every event sent</text>
<rect x="280" y="16" width="420" height="400" rx="14" class="ntd-frame"/>
<text x="296" y="38" class="ntd-code" text-anchor="start">noeta serve · GET /tasks/{id}/watch?after=N</text>
<rect x="300" y="52" width="380" height="60" rx="10" class="ntd-chip"/>
<text x="490.0" y="77.5" class="ntd-code" text-anchor="middle">event: event</text>
<text x="490.0" y="96.5" class="ntd-mini" text-anchor="middle">data: Recorded (seq, at, event)</text>
<rect x="300" y="124" width="380" height="132" rx="10" class="ntd-chip ntd-chip-green"/>
<text x="490.0" y="185.5" class="ntd-code" text-anchor="middle">event: delta</text>
<text x="490.0" y="204.5" class="ntd-mini" text-anchor="middle">data: Delta (kind, text, call_seq …)</text>
<rect x="300" y="268" width="380" height="60" rx="10" class="ntd-chip"/>
<text x="490.0" y="293.5" class="ntd-code" text-anchor="middle">: keep-alive</text>
<text x="490.0" y="312.5" class="ntd-mini" text-anchor="middle">a comment line</text>
<rect x="300" y="340" width="380" height="60" rx="10" class="ntd-chip"/>
<text x="490.0" y="365.5" class="ntd-code" text-anchor="middle">event: end</text>
<text x="490.0" y="384.5" class="ntd-mini" text-anchor="middle">data: {} or {"error": …}</text>
<path d="M 246 82 L 298 82" class="ntd-line" marker-end="url(#ref-http-stream-arrow)"/>
<path d="M 246 154 L 298 154" class="ntd-line" marker-end="url(#ref-http-stream-arrow)"/>
<path d="M 246 226 L 298 226" class="ntd-line" marker-end="url(#ref-http-stream-arrow)"/>
<path d="M 246 298 L 298 298" class="ntd-line ntd-dashed" marker-end="url(#ref-http-stream-arrow)"/>
<path d="M 246 370 L 298 370" class="ntd-line" marker-end="url(#ref-http-stream-arrow)"/>
<rect x="740" y="170" width="180" height="120" rx="10" class="ntd-chip ntd-chip-amber"/>
<text x="830.0" y="205.0" class="ntd-title" text-anchor="middle">Front end</text>
<text x="830.0" y="225.0" class="ntd-code" text-anchor="middle">RemoteClient.watch</text>
<text x="830.0" y="245.0" class="ntd-code" text-anchor="middle">terminal UI --server</text>
<text x="830.0" y="265.0" class="ntd-code" text-anchor="middle">web app</text>
<path d="M 680 82 L 716 82 L 716 370 L 680 370" class="ntd-line"/>
<path d="M 716 230 L 738 230" class="ntd-line" marker-end="url(#ref-http-stream-arrow)"/>
<text x="490" y="440" class="ntd-mini" text-anchor="middle">text/event-stream · reconnect with after = the last seq seen</text>
</svg>
