<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 450" role="img" aria-label="Where the skills plugin looks for skills, highest precedence first, and how they reach the model"><style data-ntd>svg{--ntd-bg:#ffffff;--ntd-panel:#f6f6f7;--ntd-border:#c2c2c4;--ntd-text1:#3c3c43;--ntd-text2:#67676c;--ntd-text3:#929295;--ntd-brand:#059669;--ntd-green:#10b981;--ntd-violet:#8b5cf6;--ntd-amber:#f59e0b;--ntd-cyan:#0891b2;--ntd-red:#e11d48;--ntd-green-soft:rgba(16,185,129,.14);--ntd-violet-soft:rgba(139,92,246,.13);--ntd-amber-soft:rgba(245,158,11,.14);--ntd-cyan-soft:rgba(8,145,178,.12);--ntd-red-soft:rgba(225,29,72,.10);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif}@media (prefers-color-scheme:dark){svg{--ntd-bg:#1b1b1f;--ntd-panel:#202127;--ntd-border:#3c3f44;--ntd-text1:#dfdfd6;--ntd-text2:#98989f;--ntd-text3:#6a6a71;--ntd-brand:#34d399;--ntd-green:#10b981;--ntd-violet:#a78bfa;--ntd-amber:#fbbf24;--ntd-cyan:#22d3ee;--ntd-red:#fb7185;--ntd-green-soft:rgba(16,185,129,.18);--ntd-violet-soft:rgba(139,92,246,.20);--ntd-amber-soft:rgba(245,158,11,.18);--ntd-cyan-soft:rgba(34,211,238,.14);--ntd-red-soft:rgba(251,113,133,.14)}}.ntd-bg{fill:var(--ntd-panel)}.ntd-box{fill:var(--ntd-bg);stroke:var(--ntd-border);stroke-width:1.2}.ntd-frame{fill:none;stroke:var(--ntd-green);stroke-width:1.4;stroke-dasharray:6 5}.ntd-dash{stroke-dasharray:5 4}.ntd-chip{fill:var(--ntd-bg);stroke:var(--ntd-border);stroke-width:1.2}.ntd-chip-green{fill:var(--ntd-green-soft);stroke:var(--ntd-green)}.ntd-chip-violet{fill:var(--ntd-violet-soft);stroke:var(--ntd-violet)}.ntd-chip-amber{fill:var(--ntd-amber-soft);stroke:var(--ntd-amber)}.ntd-chip-cyan{fill:var(--ntd-cyan-soft);stroke:var(--ntd-cyan)}.ntd-chip-red{fill:var(--ntd-red-soft);stroke:var(--ntd-red)}.ntd-title{fill:var(--ntd-text1);font-size:15px;font-weight:600}.ntd-label{fill:var(--ntd-brand);font-size:13px;font-weight:600}.ntd-sub{fill:var(--ntd-text2);font-size:12.5px}.ntd-mini{fill:var(--ntd-text2);font-size:11.5px}.ntd-strong{fill:var(--ntd-text1);font-weight:600}.ntd-em{font-style:italic}.ntd-chiptext{fill:var(--ntd-text1);font-size:13px;font-weight:500}.ntd-code{fill:var(--ntd-brand);font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.ntd-red{fill:var(--ntd-red)}.ntd-line{stroke:var(--ntd-text3);stroke-width:1.4;fill:none}.ntd-dashed{stroke-dasharray:5 4}.ntd-line-green{stroke:var(--ntd-green);stroke-width:1.6;fill:none}.ntd-line-violet{stroke:var(--ntd-violet);stroke-width:1.6;fill:none}.ntd-line-amber{stroke:var(--ntd-amber);stroke-width:1.8;fill:none}.ntd-line-red{stroke:var(--ntd-red);stroke-width:1.6;fill:none}.ntd-arrowhead{fill:var(--ntd-text3)}.ntd-arrowhead-green{fill:var(--ntd-green)}.ntd-arrowhead-violet{fill:var(--ntd-violet)}.ntd-arrowhead-amber{fill:var(--ntd-amber)}.ntd-arrowhead-red{fill:var(--ntd-red)}</style>
<defs><marker id="guide-skills-lookup-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead"/></marker><marker id="guide-skills-lookup-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead-red"/></marker><marker id="guide-skills-lookup-arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead-amber"/></marker><marker id="guide-skills-lookup-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead-green"/></marker><marker id="guide-skills-lookup-arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead-violet"/></marker></defs>
<rect x="70" y="50" width="500" height="46" rx="10" class="ntd-box"/>
<text x="86" y="70" class="ntd-chiptext" text-anchor="start">Managed</text>
<text x="86" y="87" class="ntd-code" text-anchor="start">/etc/noeta/.noeta/skills</text>
<text x="556" y="78" class="ntd-mini" text-anchor="end">always</text>
<rect x="70" y="106" width="500" height="46" rx="10" class="ntd-box"/>
<text x="86" y="126" class="ntd-chiptext" text-anchor="start">You</text>
<text x="86" y="143" class="ntd-code" text-anchor="start">~/.noeta/skills</text>
<text x="556" y="134" class="ntd-mini" text-anchor="end">always</text>
<rect x="70" y="162" width="500" height="46" rx="10" class="ntd-box"/>
<text x="86" y="182" class="ntd-chiptext" text-anchor="start">The project, nearest first</text>
<text x="86" y="199" class="ntd-code" text-anchor="start">.noeta/skills · .agents/skills</text>
<text x="556" y="190" class="ntd-mini" text-anchor="end">trusted only</text>
<rect x="70" y="218" width="500" height="46" rx="10" class="ntd-box"/>
<text x="86" y="238" class="ntd-chiptext" text-anchor="start">Additional directories</text>
<text x="86" y="255" class="ntd-code" text-anchor="start">--add-dir · additionalDirectories</text>
<text x="556" y="246" class="ntd-mini" text-anchor="end">trusted only</text>
<rect x="70" y="274" width="500" height="46" rx="10" class="ntd-box"/>
<text x="86" y="294" class="ntd-chiptext" text-anchor="start">Command files</text>
<text x="86" y="311" class="ntd-code" text-anchor="start">.noeta/commands/*.md</text>
<text x="556" y="302" class="ntd-mini" text-anchor="end">read as skills</text>
<rect x="70" y="330" width="500" height="46" rx="10" class="ntd-box"/>
<text x="86" y="350" class="ntd-chiptext" text-anchor="start">Claude Code plugins</text>
<text x="86" y="367" class="ntd-code" text-anchor="start">&lt;plugin&gt;:&lt;skill&gt;</text>
<text x="556" y="358" class="ntd-mini" text-anchor="end">plugin dirs</text>
<rect x="70" y="386" width="500" height="46" rx="10" class="ntd-box ntd-dash"/>
<text x="86" y="406" class="ntd-chiptext" text-anchor="start">Below the working directory</text>
<text x="86" y="423" class="ntd-code" text-anchor="start">apps/web:deploy</text>
<text x="556" y="414" class="ntd-mini" text-anchor="end">never shadow</text>
<path d="M40 54 L40 436" class="ntd-line-green" marker-end="url(#guide-skills-lookup-arrow-green)"/>
<text x="40" y="36" class="ntd-label" text-anchor="middle">first wins</text>
<text x="320" y="30" class="ntd-label" text-anchor="middle">looked for, highest precedence first</text>
<path d="M570 220 L628 160" class="ntd-line" marker-end="url(#guide-skills-lookup-arrow)"/>
<rect x="630" y="70" width="270" height="160" rx="10" class="ntd-chip ntd-chip-green"/>
<text x="765.0" y="98" class="ntd-title" text-anchor="middle">The listing</text>
<text x="765.0" y="120" class="ntd-mini" text-anchor="middle">recorded once per task</text>
<text x="765.0" y="142" class="ntd-mini" text-anchor="middle">1% of the context window</text>
<text x="765.0" y="164" class="ntd-mini" text-anchor="middle">each description ≤ 1,536 chars</text>
<text x="765.0" y="186" class="ntd-mini" text-anchor="middle">over budget: short forms first</text>
<text x="765.0" y="208" class="ntd-mini" text-anchor="middle">most used first</text>
<path d="M765 230 L765 278" class="ntd-line" marker-end="url(#guide-skills-lookup-arrow)"/>
<rect x="630" y="280" width="270" height="76" rx="10" class="ntd-box"/>
<text x="765.0" y="303.0" class="ntd-chiptext" text-anchor="middle">Loaded when needed</text>
<text x="765.0" y="323.0" class="ntd-code" text-anchor="middle">Skill(skill, args)</text>
<text x="765.0" y="343.0" class="ntd-mini" text-anchor="middle">or typed by you as /name</text>
<text x="765" y="392" class="ntd-mini" text-anchor="middle">Skills are looked for again on new input,</text>
<text x="765" y="410" class="ntd-mini" text-anchor="middle">so one added mid-task is found.</text>
</svg>
