<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" role="img" aria-label="Plugin state: a hook records an entry, the runner appends it as ExtensionRecorded, the plugin&#x27;s reduce folds it"><style data-ntd>svg{--ntd-bg:#ffffff;--ntd-panel:#f6f6f7;--ntd-border:#c2c2c4;--ntd-text1:#3c3c43;--ntd-text2:#67676c;--ntd-text3:#929295;--ntd-brand:#059669;--ntd-green:#10b981;--ntd-violet:#8b5cf6;--ntd-amber:#f59e0b;--ntd-cyan:#0891b2;--ntd-red:#e11d48;--ntd-green-soft:rgba(16,185,129,.14);--ntd-violet-soft:rgba(139,92,246,.13);--ntd-amber-soft:rgba(245,158,11,.14);--ntd-cyan-soft:rgba(8,145,178,.12);--ntd-red-soft:rgba(225,29,72,.10);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif}@media (prefers-color-scheme:dark){svg{--ntd-bg:#1b1b1f;--ntd-panel:#202127;--ntd-border:#3c3f44;--ntd-text1:#dfdfd6;--ntd-text2:#98989f;--ntd-text3:#6a6a71;--ntd-brand:#34d399;--ntd-green:#10b981;--ntd-violet:#a78bfa;--ntd-amber:#fbbf24;--ntd-cyan:#22d3ee;--ntd-red:#fb7185;--ntd-green-soft:rgba(16,185,129,.18);--ntd-violet-soft:rgba(139,92,246,.20);--ntd-amber-soft:rgba(245,158,11,.18);--ntd-cyan-soft:rgba(34,211,238,.14);--ntd-red-soft:rgba(251,113,133,.14)}}.ntd-bg{fill:var(--ntd-panel)}.ntd-box{fill:var(--ntd-bg);stroke:var(--ntd-border);stroke-width:1.2}.ntd-frame{fill:none;stroke:var(--ntd-green);stroke-width:1.4;stroke-dasharray:6 5}.ntd-dash{stroke-dasharray:5 4}.ntd-chip{fill:var(--ntd-bg);stroke:var(--ntd-border);stroke-width:1.2}.ntd-chip-green{fill:var(--ntd-green-soft);stroke:var(--ntd-green)}.ntd-chip-violet{fill:var(--ntd-violet-soft);stroke:var(--ntd-violet)}.ntd-chip-amber{fill:var(--ntd-amber-soft);stroke:var(--ntd-amber)}.ntd-chip-cyan{fill:var(--ntd-cyan-soft);stroke:var(--ntd-cyan)}.ntd-chip-red{fill:var(--ntd-red-soft);stroke:var(--ntd-red)}.ntd-title{fill:var(--ntd-text1);font-size:15px;font-weight:600}.ntd-label{fill:var(--ntd-brand);font-size:13px;font-weight:600}.ntd-sub{fill:var(--ntd-text2);font-size:12.5px}.ntd-mini{fill:var(--ntd-text2);font-size:11.5px}.ntd-strong{fill:var(--ntd-text1);font-weight:600}.ntd-em{font-style:italic}.ntd-chiptext{fill:var(--ntd-text1);font-size:13px;font-weight:500}.ntd-code{fill:var(--ntd-brand);font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.ntd-red{fill:var(--ntd-red)}.ntd-line{stroke:var(--ntd-text3);stroke-width:1.4;fill:none}.ntd-dashed{stroke-dasharray:5 4}.ntd-line-green{stroke:var(--ntd-green);stroke-width:1.6;fill:none}.ntd-line-violet{stroke:var(--ntd-violet);stroke-width:1.6;fill:none}.ntd-line-amber{stroke:var(--ntd-amber);stroke-width:1.8;fill:none}.ntd-line-red{stroke:var(--ntd-red);stroke-width:1.6;fill:none}.ntd-arrowhead{fill:var(--ntd-text3)}.ntd-arrowhead-green{fill:var(--ntd-green)}.ntd-arrowhead-violet{fill:var(--ntd-violet)}.ntd-arrowhead-amber{fill:var(--ntd-amber)}.ntd-arrowhead-red{fill:var(--ntd-red)}</style>
<defs><marker id="plug-state-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ntd-arrowhead"/></marker></defs>
<rect x="30" y="50" width="190" height="72" rx="10" class="ntd-chip ntd-chip-green"/>
<text x="125" y="75" class="ntd-chiptext" text-anchor="middle">A hook or a tool</text>
<text x="125" y="93" class="ntd-mini" text-anchor="middle">view.record(name, kind, data)</text>
<text x="125" y="108" class="ntd-mini" text-anchor="middle">ctx.record(…)</text>
<rect x="250" y="50" width="220" height="72" rx="10" class="ntd-chip ntd-chip-violet"/>
<text x="360" y="75" class="ntd-chiptext" text-anchor="middle">Appended with the step</text>
<text x="360" y="93" class="ntd-mini" text-anchor="middle">ExtensionRecorded</text>
<text x="360" y="108" class="ntd-mini" text-anchor="middle">one append: a crash keeps all or none</text>
<rect x="500" y="50" width="180" height="72" rx="10" class="ntd-chip ntd-chip-green"/>
<text x="590" y="75" class="ntd-chiptext" text-anchor="middle">Folded</text>
<text x="590" y="93" class="ntd-mini" text-anchor="middle">reduce(state, kind, data)</text>
<text x="590" y="108" class="ntd-mini" text-anchor="middle">→ state.ext[name]</text>
<rect x="710" y="50" width="170" height="72" rx="10" class="ntd-chip ntd-chip-green"/>
<text x="795" y="75" class="ntd-chiptext" text-anchor="middle">The next hook reads it</text>
<text x="795" y="93" class="ntd-mini" text-anchor="middle">view.ext_state(name)</text>
<text x="795" y="108" class="ntd-mini" text-anchor="middle">ToolContext.state[name]</text>
<path d="M 220 86 L 248 86" class="ntd-line" marker-end="url(#plug-state-arrow)"/>
<path d="M 470 86 L 498 86" class="ntd-line" marker-end="url(#plug-state-arrow)"/>
<path d="M 680 86 L 708 86" class="ntd-line" marker-end="url(#plug-state-arrow)"/>
<path d="M 795 50 L 795 30 L 125 30 L 125 48" class="ntd-line ntd-dashed" marker-end="url(#plug-state-arrow)"/>
<text x="460" y="24" class="ntd-mini" text-anchor="middle">next step</text>
<rect x="250" y="176" width="220" height="60" rx="10" class="ntd-chip ntd-chip-violet ntd-dash"/>
<text x="360" y="195" class="ntd-chiptext" text-anchor="middle">Snapshot</text>
<text x="360" y="213" class="ntd-mini" text-anchor="middle">holds plugin states too;</text>
<text x="360" y="228" class="ntd-mini" text-anchor="middle">any worker folds the same</text>
<path d="M 360 122 L 360 174" class="ntd-line ntd-dashed" marker-end="url(#plug-state-arrow)"/>
<rect x="500" y="176" width="380" height="76" rx="10" class="ntd-chip ntd-dash"/>
<text x="690" y="195.5" class="ntd-chiptext" text-anchor="middle">Also</text>
<text x="690" y="213.5" class="ntd-mini" text-anchor="middle">message=…: the message joins the conversation</text>
<text x="690" y="228.5" class="ntd-mini" text-anchor="middle">folds = (&quot;other&quot;,): fold another name&#x27;s records too</text>
<text x="690" y="243.5" class="ntd-mini" text-anchor="middle">an erased prompt: reduce gets ERASED_KIND</text>
</svg>
