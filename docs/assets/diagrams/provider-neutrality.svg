<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1330 578" role="img" aria-label="Provider Neutrality — Engine → one internal LLM protocol → three adapters; the kernel cannot import a vendor SDK (architecture diagram)" width="1330" height="578">
<style>
