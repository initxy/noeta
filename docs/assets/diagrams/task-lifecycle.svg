<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" role="img" aria-label="Task lifecycle — pending → running → suspended → terminal; one suspended status, four wake conditions (lifecycle diagram)" width="980" height="700">
<style>
@font-face { font-family: 'JetBrains Mono'; font-weight: 400; src: local('JetBrains Mono'), local('JetBrainsMono-Regular'); }
@font-face { font-family: 'JetBrains Mono'; font-weight: 500; src: local('JetBrains Mono'), local('JetBrainsMono-Regular'); }
@font-face { font-family: 'JetBrains Mono'; font-weight: 600; src: local('JetBrains Mono'), local('JetBrainsMono-Regular'); }
@font-face { font-family: 'JetBrains Mono'; font-weight: 700; src: local('JetBrains Mono'), local('JetBrainsMono-Regular'); }
svg { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', 'Noto Sans Mono CJK SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', monospace; }
:root,
    [data-theme="dark"] { --bg: #020617; --grid: #1e293b; --text: #ffffff; --text-muted: #94a3b8; --text-dim: #475569; /* UI chrome (menu hints, footer) needs more contrast than SVG .t-dim accents */ --text-faint: #7d8da1; --panel: rgba(15, 23, 42, 0.5); --panel-border: #1e293b; --lane-fill: rgba(15, 23, 42, 0.22); --lane-stroke: #334155; --arrow: #64748b; --arrow-emphasis: #34d399; /* Opaque mask color used behind semi-transparent component fills so the arrows drawn underneath are properly hidden. */ --mask: #0f172a; --frontend-fill: rgba(8, 51, 68, 0.4); --frontend-stroke: #22d3ee; --backend-fill: rgba(6, 78, 59, 0.4); --backend-stroke: #34d399; --database-fill: rgba(76, 29, 149, 0.4); --database-stroke: #a78bfa; --cloud-fill: rgba(120, 53, 15, 0.3); --cloud-stroke: #fbbf24; --security-fill: rgba(136, 19, 55, 0.4); --security-stroke: #fb7185; --messagebus-fill: rgba(251, 146, 60, 0.3); --messagebus-stroke:#fb923c; --external-fill: rgba(30, 41, 59, 0.5); --external-stroke: #94a3b8; --toolbar-bg: rgba(15, 23, 42, 0.8); --toolbar-border: #334155; --toolbar-text: #e2e8f0; --toolbar-hover: rgba(15, 23, 42, 0.95); --toolbar-menu-bg: #0f172a; }
[data-theme="light"] { --bg: #f8fafc; --grid: #e2e8f0; --text: #0f172a; --text-muted: #64748b; --text-dim: #94a3b8; --text-faint: #64748b; --panel: #ffffff; --panel-border: #e2e8f0; --lane-fill: rgba(248, 250, 252, 0.65); --lane-stroke: #cbd5e1; --arrow: #94a3b8; --arrow-emphasis: #059669; --mask: #ffffff; --frontend-fill: rgba(34, 211, 238, 0.15); --frontend-stroke: #0891b2; --backend-fill: rgba(52, 211, 153, 0.18); --backend-stroke: #059669; --database-fill: rgba(167, 139, 250, 0.2); --database-stroke: #7c3aed; --cloud-fill: rgba(251, 191, 36, 0.18); --cloud-stroke: #d97706; --security-fill: rgba(251, 113, 133, 0.15); --security-stroke: #e11d48; --messagebus-fill: rgba(251, 146, 60, 0.15); --messagebus-stroke:#ea580c; --external-fill: rgba(148, 163, 184, 0.18); --external-stroke: #64748b; --toolbar-bg: rgba(255, 255, 255, 0.92); --toolbar-border: #cbd5e1; --toolbar-text: #334155; --toolbar-hover: #ffffff; --toolbar-menu-bg: #ffffff; }
svg { width: 100%; min-width: min(900px, 100%); display: block; }
.c-grid { stroke: var(--grid); fill: none; }
.c-mask { fill: var(--mask); stroke: none; }
.c-frontend { fill: var(--frontend-fill); stroke: var(--frontend-stroke); }
.c-backend { fill: var(--backend-fill); stroke: var(--backend-stroke); }
.c-database { fill: var(--database-fill); stroke: var(--database-stroke); }
.c-cloud { fill: var(--cloud-fill); stroke: var(--cloud-stroke); }
.c-security { fill: var(--security-fill); stroke: var(--security-stroke); }
.c-messagebus { fill: var(--messagebus-fill); stroke: var(--messagebus-stroke); }
.c-external { fill: var(--external-fill); stroke: var(--external-stroke); }
.t-primary { fill: var(--text); }
.t-muted { fill: var(--text-muted); }
.t-dim { fill: var(--text-dim); }
.t-frontend { fill: var(--frontend-stroke); }
.t-backend { fill: var(--backend-stroke); }
.t-database { fill: var(--database-stroke); }
.t-cloud { fill: var(--cloud-stroke); }
.t-security { fill: var(--security-stroke); }
.t-messagebus { fill: var(--messagebus-stroke); }
.t-external { fill: var(--external-stroke); }
.a-default { stroke: var(--arrow); fill: none; }
.a-emphasis { stroke: var(--arrow-emphasis); fill: none; }
.a-security { stroke: var(--security-stroke); fill: none; stroke-dasharray: 5,5; }
.a-dashed { stroke: var(--database-stroke); fill: none; stroke-dasharray: 4,4; }
.m-default { fill: var(--arrow); }
.m-emphasis { fill: var(--arrow-emphasis); }
.m-security { fill: var(--security-stroke); }
.m-dashed { fill: var(--database-stroke); }
.c-security-group { fill: transparent; stroke: var(--security-stroke); stroke-dasharray: 4,4; }
.c-region { fill: rgba(251, 191, 36, 0.05); stroke: var(--cloud-stroke); stroke-dasharray: 8,4; }
.c-lane { fill: var(--lane-fill); stroke: var(--lane-stroke); stroke-dasharray: 6,6; }
svg[data-animation="trace"] [data-animate="edge"] { stroke-dasharray: 10 8; stroke-dashoffset: 54; animation: archify-edge-flow 2.4s linear infinite; animation-delay: calc(var(--step, 0) * 160ms); }
svg[data-animation="trace"] [data-animate="node"] { transform-box: fill-box; transform-origin: center; animation: archify-node-pulse 3.6s ease-in-out infinite; animation-delay: calc(var(--step, 0) * 160ms); }
:root, svg { --bg: #020617; --grid: #1e293b; --text: #ffffff; --text-muted: #94a3b8; --text-dim: #475569; --text-faint: #7d8da1; --panel: rgba(15, 23, 42, 0.5); --panel-border: #1e293b; --lane-fill: rgba(15, 23, 42, 0.22); --lane-stroke: #334155; --arrow: #64748b; --arrow-emphasis: #34d399; --mask: #0f172a; --frontend-fill: rgba(8, 51, 68, 0.4); --frontend-stroke: #22d3ee; --backend-fill: rgba(6, 78, 59, 0.4); --backend-stroke: #34d399; --database-fill: rgba(76, 29, 149, 0.4); --database-stroke: #a78bfa; --cloud-fill: rgba(120, 53, 15, 0.3); --cloud-stroke: #fbbf24; --security-fill: rgba(136, 19, 55, 0.4); --security-stroke: #fb7185; --messagebus-fill: rgba(251, 146, 60, 0.3); --messagebus-stroke: #fb923c; --external-fill: rgba(30, 41, 59, 0.5); --external-stroke: #94a3b8; --toolbar-bg: rgba(15, 23, 42, 0.8); --toolbar-border: #334155; --toolbar-text: #e2e8f0; --toolbar-hover: rgba(15, 23, 42, 0.95); --toolbar-menu-bg: #0f172a; }
@media (prefers-color-scheme: light) { :root, svg { --bg: #f8fafc; --grid: #e2e8f0; --text: #0f172a; --text-muted: #64748b; --text-dim: #94a3b8; --text-faint: #64748b; --panel: #ffffff; --panel-border: #e2e8f0; --lane-fill: rgba(248, 250, 252, 0.65); --lane-stroke: #cbd5e1; --arrow: #94a3b8; --arrow-emphasis: #059669; --mask: #ffffff; --frontend-fill: rgba(34, 211, 238, 0.15); --frontend-stroke: #0891b2; --backend-fill: rgba(52, 211, 153, 0.18); --backend-stroke: #059669; --database-fill: rgba(167, 139, 250, 0.2); --database-stroke: #7c3aed; --cloud-fill: rgba(251, 191, 36, 0.18); --cloud-stroke: #d97706; --security-fill: rgba(251, 113, 133, 0.15); --security-stroke: #e11d48; --messagebus-fill: rgba(251, 146, 60, 0.15); --messagebus-stroke: #ea580c; --external-fill: rgba(148, 163, 184, 0.18); --external-stroke: #64748b; --toolbar-bg: rgba(255, 255, 255, 0.92); --toolbar-border: #cbd5e1; --toolbar-text: #334155; --toolbar-hover: #ffffff; --toolbar-menu-bg: #ffffff; } }
svg[data-theme="light"] { --bg: #f8fafc; --grid: #e2e8f0; --text: #0f172a; --text-muted: #64748b; --text-dim: #94a3b8; --text-faint: #64748b; --panel: #ffffff; --panel-border: #e2e8f0; --lane-fill: rgba(248, 250, 252, 0.65); --lane-stroke: #cbd5e1; --arrow: #94a3b8; --arrow-emphasis: #059669; --mask: #ffffff; --frontend-fill: rgba(34, 211, 238, 0.15); --frontend-stroke: #0891b2; --backend-fill: rgba(52, 211, 153, 0.18); --backend-stroke: #059669; --database-fill: rgba(167, 139, 250, 0.2); --database-stroke: #7c3aed; --cloud-fill: rgba(251, 191, 36, 0.18); --cloud-stroke: #d97706; --security-fill: rgba(251, 113, 133, 0.15); --security-stroke: #e11d48; --messagebus-fill: rgba(251, 146, 60, 0.15); --messagebus-stroke: #ea580c; --external-fill: rgba(148, 163, 184, 0.18); --external-stroke: #64748b; --toolbar-bg: rgba(255, 255, 255, 0.92); --toolbar-border: #cbd5e1; --toolbar-text: #334155; --toolbar-hover: #ffffff; --toolbar-menu-bg: #ffffff; }
svg[data-theme="dark"] { --bg: #020617; --grid: #1e293b; --text: #ffffff; --text-muted: #94a3b8; --text-dim: #475569; --text-faint: #7d8da1; --panel: rgba(15, 23, 42, 0.5); --panel-border: #1e293b; --lane-fill: rgba(15, 23, 42, 0.22); --lane-stroke: #334155; --arrow: #64748b; --arrow-emphasis: #34d399; --mask: #0f172a; --frontend-fill: rgba(8, 51, 68, 0.4); --frontend-stroke: #22d3ee; --backend-fill: rgba(6, 78, 59, 0.4); --backend-stroke: #34d399; --database-fill: rgba(76, 29, 149, 0.4); --database-stroke: #a78bfa; --cloud-fill: rgba(120, 53, 15, 0.3); --cloud-stroke: #fbbf24; --security-fill: rgba(136, 19, 55, 0.4); --security-stroke: #fb7185; --messagebus-fill: rgba(251, 146, 60, 0.3); --messagebus-stroke: #fb923c; --external-fill: rgba(30, 41, 59, 0.5); --external-stroke: #94a3b8; --toolbar-bg: rgba(15, 23, 42, 0.8); --toolbar-border: #334155; --toolbar-text: #e2e8f0; --toolbar-hover: rgba(15, 23, 42, 0.95); --toolbar-menu-bg: #0f172a; }
rect.c-bg-rect { fill: var(--bg); }
</style>
<rect width="100%" height="100%" class="c-bg-rect"/>
        <!-- Definitions -->
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-default" />
          </marker>
          <marker id="arrowhead-emphasis" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-emphasis" />
          </marker>
          <marker id="arrowhead-security" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-security" />
          </marker>
          <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-dashed" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" class="c-grid" stroke-width="0.5"/>
          </pattern>
        </defs>

        <!-- Background Grid -->
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- Lifecycle bands -->
        <path d="M 72 112 L 908 112" class="a-default" stroke-width="0.8" stroke-dasharray="3,8"/>
        <text x="72" y="100" class="t-dim" font-size="10" font-weight="600">01 / Task status</text>
        <path d="M 72 264 L 908 264" class="a-default" stroke-width="0.8" stroke-dasharray="3,8"/>
        <text x="72" y="252" class="t-dim" font-size="10" font-weight="600">02 / Wake conditions</text>
        <path d="M 72 436 L 908 436" class="a-default" stroke-width="0.8" stroke-dasharray="3,8"/>
        <text x="72" y="424" class="t-dim" font-size="10" font-weight="600">03 / Terminal events</text>

        <!-- Primary lifecycle rail -->
        <path d="M 154 157 L 440 157" class="a-emphasis" stroke-width="2.2" marker-end="url(#arrowhead-emphasis)"/>

        <!-- Transition paths -->
        <path d="M 153 157 L 189 157" class="a-emphasis" stroke-width="2" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 307 157 L 343 157" class="a-emphasis" stroke-width="2" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 402 126 L 402 106 Q 402 96 392 96 L 258 96 Q 248 96 248 106 L 248 126" class="a-emphasis" stroke-width="2" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 248 188 L 248 404 Q 248 414 258 414 L 392 414 Q 402 414 402 424 L 402 450" class="a-emphasis" stroke-width="2" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 248 188 L 248 382 Q 248 392 258 392 L 546 392 Q 556 392 556 402 L 556 450" class="a-security" stroke-width="1.1" marker-end="url(#arrowhead-security)"/>
        <path d="M 461 157 L 795 157 Q 805 157 805 167 L 805 469 Q 805 479 795 479 L 769 479" class="a-security" stroke-width="1.1" marker-end="url(#arrowhead-security)"/>

        <!-- States -->
        <rect x="35" y="126" width="118" height="62" rx="7" class="c-mask"/>
        <rect x="35" y="126" width="118" height="62" rx="7" class="c-frontend" stroke-width="1.5"/>
        <text x="45" y="140" class="t-frontend" font-size="7" font-weight="700">01</text>
        <text x="94" y="147" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">Pending</text>
        <text x="94" y="163" class="t-muted" font-size="7" text-anchor="middle">queued for a lease</text>

        <rect x="189" y="126" width="118" height="62" rx="7" class="c-mask"/>
        <rect x="189" y="126" width="118" height="62" rx="7" class="c-backend" stroke-width="1.5"/>
        <text x="199" y="140" class="t-backend" font-size="7" font-weight="700">02</text>
        <text x="248" y="147" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">Running</text>
        <text x="248" y="163" class="t-muted" font-size="7" text-anchor="middle">compose/decide/dispatch</text>
        <text x="248" y="177" class="t-backend" font-size="7" text-anchor="middle">a Worker holds the lease</text>

        <rect x="343" y="126" width="118" height="62" rx="7" class="c-mask"/>
        <rect x="343" y="126" width="118" height="62" rx="7" class="c-cloud" stroke-width="1.5"/>
        <text x="353" y="140" class="t-cloud" font-size="7" font-weight="700">03</text>
        <text x="402" y="147" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">Suspended</text>
        <text x="402" y="163" class="t-muted" font-size="7" text-anchor="middle">wake_on is set</text>
        <text x="402" y="177" class="t-cloud" font-size="7" text-anchor="middle">no thread, no memory</text>

        <rect x="493" y="278" width="126" height="44" rx="7" class="c-mask"/>
        <rect x="493" y="278" width="126" height="44" rx="7" class="c-cloud" stroke-width="1.5"/>
        <text x="556" y="299" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">Human answer</text>
        <text x="556" y="315" class="t-muted" font-size="7" text-anchor="middle">HumanResponseReceived</text>

        <rect x="647" y="278" width="126" height="44" rx="7" class="c-mask"/>
        <rect x="647" y="278" width="126" height="44" rx="7" class="c-cloud" stroke-width="1.5"/>
        <text x="710" y="299" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">Timer fired</text>
        <text x="710" y="315" class="t-muted" font-size="7" text-anchor="middle">TimerFired</text>

        <rect x="493" y="334" width="126" height="44" rx="7" class="c-mask"/>
        <rect x="493" y="334" width="126" height="44" rx="7" class="c-cloud" stroke-width="1.5"/>
        <text x="556" y="355" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">Subtask done</text>
        <text x="556" y="371" class="t-muted" font-size="7" text-anchor="middle">SubtaskCompleted</text>

        <rect x="647" y="334" width="126" height="44" rx="7" class="c-mask"/>
        <rect x="647" y="334" width="126" height="44" rx="7" class="c-cloud" stroke-width="1.5"/>
        <text x="710" y="355" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">External event</text>
        <text x="710" y="371" class="t-muted" font-size="7" text-anchor="middle">ExternalEvent</text>

        <rect x="343" y="450" width="118" height="58" rx="7" class="c-mask"/>
        <rect x="343" y="450" width="118" height="58" rx="7" class="c-database" stroke-width="1.5"/>
        <text x="402" y="471" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">Completed</text>
        <text x="402" y="487" class="t-muted" font-size="7" text-anchor="middle">TaskCompleted</text>

        <rect x="497" y="450" width="118" height="58" rx="7" class="c-mask"/>
        <rect x="497" y="450" width="118" height="58" rx="7" class="c-security" stroke-width="1.5"/>
        <text x="556" y="471" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">Failed</text>
        <text x="556" y="487" class="t-muted" font-size="7" text-anchor="middle">TaskFailed</text>

        <rect x="651" y="450" width="118" height="58" rx="7" class="c-mask"/>
        <rect x="651" y="450" width="118" height="58" rx="7" class="c-security" stroke-width="1.5"/>
        <text x="710" y="471" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">Cancelled</text>
        <text x="710" y="487" class="t-muted" font-size="7" text-anchor="middle">TaskCancelled</text>

        <!-- Transition labels -->


        <rect x="309" y="75" width="32" height="16" rx="4" class="c-mask"/>
        <text x="325" y="86" class="t-backend" font-size="8" text-anchor="middle">wake</text>
        <rect x="304.3" y="393" width="41.400000000000006" height="16" rx="4" class="c-mask"/>
        <text x="325" y="404" class="t-backend" font-size="8" text-anchor="middle">finish</text>
        <rect x="386" y="371" width="32" height="16" rx="4" class="c-mask"/>
        <text x="402" y="382" class="t-security" font-size="8" text-anchor="middle">fail</text>
        <rect x="784.3" y="297" width="41.400000000000006" height="16" rx="4" class="c-mask"/>
        <text x="805" y="308" class="t-security" font-size="8" text-anchor="middle">cancel</text>

        <!-- Legend -->
        <text x="220" y="582" class="t-primary" font-size="10" font-weight="600">Legend</text>
        <rect x="220" y="594" width="14" height="9" rx="2" class="c-backend" stroke-width="1"/>
        <text x="240" y="602" class="t-muted" font-size="7">active state</text>
        <rect x="325" y="594" width="14" height="9" rx="2" class="c-cloud" stroke-width="1"/>
        <text x="345" y="602" class="t-muted" font-size="7">waiting</text>
        <rect x="415" y="594" width="14" height="9" rx="2" class="c-database" stroke-width="1"/>
        <text x="435" y="602" class="t-muted" font-size="7">terminal success</text>
        <rect x="560" y="594" width="14" height="9" rx="2" class="c-security" stroke-width="1"/>
        <text x="580" y="602" class="t-muted" font-size="7">failure / exit</text>
      </svg>
